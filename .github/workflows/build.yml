                          ),
                          const SizedBox(height: 18),
                          SwitchListTile(
                            title: Text(t['voice_alerts']!, style: TextStyle(color: hc ? Colors.black : Colors.white)),
                            value: app.voiceAlerts,
                            onChanged: (v) => setDlg(() => app.updateSettings(voice: v)),
                          ),
                          SwitchListTile(
                            title: Text(t['high_contrast']!, style: TextStyle(color: hc ? Colors.black : Colors.white)),
                            value: app.highContrast,
                            onChanged: (v) => setDlg(() => app.updateSettings(hc: v)),
                          ),
                          const SizedBox(height: 10),
                          ListTile(
                            title: Text(t['alert_sound']!, style: TextStyle(color: hc ? Colors.black : Colors.white, fontWeight: FontWeight.bold)),
                            subtitle: DropdownButton<String>(
                              value: app.soundType,
                              dropdownColor: hc ? Colors.white : const Color(0xFF1E293B),
                              isExpanded: true,
                              items: [
                                DropdownMenuItem(value: 'electric', child: Text(t['sound_electric']!, style: TextStyle(color: hc ? Colors.black : Colors.cyanAccent))),
                                DropdownMenuItem(value: 'soft', child: Text(t['sound_soft']!, style: TextStyle(color: hc ? Colors.black : Colors.white))),
                                DropdownMenuItem(value: 'loud', child: Text(t['sound_loud']!, style: TextStyle(color: hc ? Colors.black : Colors.white))),
                              ],
                              onChanged: (val) {
                                if (val != null) setDlg(() => app.updateSettings(sound: val));
                              },
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            void _openLanguagePicker() {
              final app = CyberPillMasterApp.of(context);
              final hc = app.highContrast;

              showModalBottomSheet(
                context: context,
                backgroundColor: hc ? Colors.white : const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(30))),
                builder: (ctx) => ListView(
                  shrinkWrap: true,
                  padding: const EdgeInsets.symmetric(vertical: 20),
                  children: [
                    _langTile('עברית (Hebrew)', 'he'),
                    _langTile('English (English)', 'en'),
                    _langTile('Русский (Russian)', 'ru'),
                    _langTile('Română (Romanian)', 'ro'),
                    _langTile('العربية (Arabic)', 'ar'),
                    _langTile('Deutsch (German)', 'de'),
                  ],
                ),
              );
            }

            Widget _langTile(String label, String code) {
              final app = CyberPillMasterApp.of(context);
              final hc = app.highContrast;
              return Container(
                margin: const EdgeInsets.symmetric(horizontal: 20, vertical: 6),
                decoration: cyber3D(radius: 16, highContrast: hc),
                child: ListTile(
                  title: Text(label, style: TextStyle(color: hc ? Colors.black : Colors.white, fontWeight: FontWeight.bold)),
                  trailing: app.currentLang == code ? const Icon(Icons.check, color: Color(0xFF06B6D4)) : null,
                  onTap: () {
                    Navigator.pop(context);
                    app.setLanguage(code);
                  },
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang]!;
              final hc = app.highContrast;

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  centerTitle: true,
                  title: Column(
                    children: [
                      Text(
                        t['app_name']!,
                        style: TextStyle(
                          fontWeight: FontWeight.w900,
                          fontSize: 22,
                          color: hc ? Colors.black : const Color(0xFF06B6D4),
                        ),
                      ),
                      Text(
                        '${t['welcome']!}, ${app.userName}',
                        style: TextStyle(fontSize: 13, color: hc ? Colors.black54 : Colors.white60),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.language),
                      onPressed: _openLanguagePicker,
                    ),
                    IconButton(
                      icon: const Icon(Icons.settings),
                      onPressed: _openSettingsDialog,
                    ),
                  ],
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: hc ? Colors.black : const Color(0xFF06B6D4),
                    labelColor: hc ? Colors.black : const Color(0xFF06B6D4),
                    unselectedLabelColor: hc ? Colors.grey : Colors.white38,
                    tabs: [
                      Tab(icon: const Icon(Icons.medication), text: t['meds_tab']!),
                      Tab(icon: const Icon(Icons.event_note), text: t['appointments_tab']!),
                    ],
                  ),
                ),
                body: TabBarView(
                  controller: _tabController,
                  children: [
                    // Medicines Tab
                    _meds.isEmpty
                        ? Center(child: Text(t['empty_meds']!, style: TextStyle(color: hc ? Colors.black54 : Colors.white38, fontSize: 18)))
                        : ListView.builder(
                            padding: const EdgeInsets.all(18),
                            itemCount: _meds.length,
                            itemBuilder: (ctx, i) {
                              final med = _meds[i];
                              final timeStr = '${med.hour.toString().padLeft(2, '0')}:${med.minute.toString().padLeft(2, '0')}';
                              return Container(
                                margin: const EdgeInsets.only(bottom: 16),
                                decoration: cyber3D(radius: 22, isPressed: med.isTaken, highContrast: hc),
                                child: ListTile(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                                  leading: Container(
                                    width: 46,
                                    height: 46,
                                    decoration: cyber3D(radius: 14, isPressed: med.isTaken, highContrast: hc),
                                    child: Icon(
                                      med.isTaken ? Icons.check_circle : Icons.alarm,
                                      color: med.isTaken ? Colors.greenAccent : const Color(0xFF06B6D4),
                                    ),
                                  ),
                                  title: Text(
                                    med.name,
                                    style: TextStyle(
                                      fontSize: 18,
                                      fontWeight: FontWeight.bold,
                                      color: hc ? Colors.black : Colors.white,
                                      decoration: med.isTaken ? TextDecoration.lineThrough : null,
                                    ),
                                  ),
                                  subtitle: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text('$timeStr | ${t['dosage']!}: ${med.dosage}', style: TextStyle(color: hc ? Colors.black87 : Colors.white70)),
                                      Text('${t['stock']!}: ${med.stock}', style: TextStyle(color: hc ? Colors.black54 : Colors.cyanAccent)),
                                      if (med.stock <= 5)
                                        Text(t['stock_alert']!, style: const TextStyle(color: Colors.redAccent, fontWeight: FontWeight.bold)),
                                    ],
                                  ),
                                  trailing: IconButton(
                                    icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                    onPressed: () {
                                      setState(() => _meds.removeAt(i));
                                      _saveMeds();
                                    },
                                  ),
                                  onTap: () => _showAlarmActionDialog(med),
                                ),
                              );
                            },
                          ),
                    // Appointments Tab
                    _apps.isEmpty
                        ? Center(child: Text(t['empty_apps']!, style: TextStyle(color: hc ? Colors.black54 : Colors.white38, fontSize: 18)))
                        : ListView.builder(
                            padding: const EdgeInsets.all(18),
                            itemCount: _apps.length,
                            itemBuilder: (ctx, i) {
                              final appItem = _apps[i];
                              return Container(
                                margin: const EdgeInsets.only(bottom: 16),
                                decoration: cyber3D(radius: 22, highContrast: hc, glowColor: const Color(0xFFA855F7)),
                                child: ListTile(
                                  contentPadding: const EdgeInsets.all(14),
                                  leading: const Icon(Icons.medical_services_outlined, size: 36, color: Color(0xFFA855F7)),
                                  title: Text(
                                    appItem.doctor,
                                    style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: hc ? Colors.black : Colors.white),
                                  ),
                                  subtitle: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      if (appItem.clinic.isNotEmpty) Text(appItem.clinic, style: TextStyle(color: hc ? Colors.black87 : Colors.white70)),
                                      Text('${appItem.date}  •  ${appItem.time}', style: const TextStyle(color: Color(0xFF38BDF8), fontWeight: FontWeight.bold)),
                                    ],
                                  ),
                                  trailing: IconButton(
                                    icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                    onPressed: () {
                                      setState(() => _apps.removeAt(i));
                                      _saveApps();
                                    },
                                  ),
                                ),
                              );
                            },
                          ),
                  ],
                ),
                floatingActionButton: GestureDetector(
                  onTap: () {
                    if (_tabController.index == 0) {
                      _openAddMedicineDialog();
                    } else {
                      _openAddAppointmentDialog();
                    }
                  },
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 22, vertical: 14),
                    decoration: cyber3D(radius: 25, highContrast: hc, glowColor: const Color(0xFF06B6D4)),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(Icons.add, color: Colors.white),
                        const SizedBox(width: 8),
                        Text(
                          _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                            fontSize: 16,
                            color: hc ? Colors.black : Colors.white,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
