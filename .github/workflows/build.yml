          class NotificationService {
          static Future<void> scheduleMedicationReminder({
          required String id,
          required String title,
          required String body,
          required int hour,
          required int minute,
          }) async {
          try {
          final now = tz.TZDateTime.now(tz.local);
          var scheduledDate = tz.TZDateTime(tz.local, now.year, now.month, now.day, hour, minute);
          if (scheduledDate.isBefore(now)) {
          scheduledDate = scheduledDate.add(const Duration(days: 1));
          }

          const AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
          'cyber_pharma_critical_alerts',
          'Cyber Pharma Critical Reminders',
          channelDescription: 'High priority alerts for medicine reminders',
          importance: Importance.max,
          priority: Priority.high,
          ticker: 'Cyber Pharma Reminder Alert',
          icon: '@drawable/ic_launcher_cyber',
          fullScreenIntent: true,
          enableVibration: true,
          playSound: true,
          );
          const NotificationDetails notifDetails = NotificationDetails(android: androidDetails);

          await flutterNotifications.zonedSchedule(
          id.hashCode,
          title,
          body,
          scheduledDate,
          notifDetails,
          androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
          uiLocalNotificationDateInterpretation: UILocalNotificationDateInterpretation.absoluteTime,
          matchDateTimeComponents: DateTimeComponents.time,
          );
          } catch (e) {
          debugPrint('scheduleMedicationReminder error: $e');
          }
          }

          static Future<void> scheduleAppointmentReminder({
          required String id,
          required String title,
          required String body,
          required DateTime appointmentDateTime,
          required int minutesBefore,
          }) async {
          try {
          final reminderTime = appointmentDateTime.subtract(Duration(minutes: minutesBefore));
          final tzReminder = tz.TZDateTime.from(reminderTime, tz.local);
          final now = tz.TZDateTime.now(tz.local);
          if (tzReminder.isBefore(now)) return;

          const AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
          'cyber_pharma_appointment_alerts',
          'Cyber Pharma Medical Appointments',
          channelDescription: 'Reminders for doctor visits and checkups',
          importance: Importance.max,
          priority: Priority.high,
          ticker: 'Medical Appointment Reminder',
          icon: '@drawable/ic_launcher_cyber',
          fullScreenIntent: true,
          enableVibration: true,
          playSound: true,
          );
          const NotificationDetails notifDetails = NotificationDetails(android: androidDetails);

          await flutterNotifications.zonedSchedule(
          ('app_' + id).hashCode,
          title,
          body,
          tzReminder,
          notifDetails,
          androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
          uiLocalNotificationDateInterpretation: UILocalNotificationDateInterpretation.absoluteTime,
          );
          } catch (e) {
          debugPrint('scheduleAppointmentReminder error: $e');
          }
          }

          static Future<void> cancelReminder(int id) async {
          try {
          await flutterNotifications.cancel(id);
          } catch (_) {}
          }
          }

          void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          try {
          tz.initializeTimeZones();
          } catch (e) {
          debugPrint('Timezone initialization error: $e');
          }

          try {
          const AndroidNotificationChannel channel = AndroidNotificationChannel(
          'cyber_pharma_critical_alerts',
          'Cyber Pharma Critical Reminders',
          description: 'High priority alerts for medicine reminders',
          importance: Importance.max,
          playSound: true,
          enableVibration: true,
          );
          await flutterNotifications
          .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
          ?.createNotificationChannel(channel);
          const AndroidInitializationSettings initAndroid = AndroidInitializationSettings('@drawable/ic_launcher_cyber');
          const InitializationSettings initSettings = InitializationSettings(android: initAndroid);
          await flutterNotifications.initialize(initSettings);
          } catch (e) {
          debugPrint('Notification setup error: $e');
          }

          runApp(const CyberPillMasterApp());
          }

          class CyberPillScope extends InheritedWidget {
          final _CyberPillMasterAppState state;
          final String lang;
          final String themeKey;
          final String bgStyle;
          final String frameStyle;
          final String soundType;
          final double soundVolume;
          final bool highContrast;
          final bool voiceAlerts;

          const CyberPillScope({
          super.key,
          required this.state,
          required this.lang,
          required this.themeKey,
          required this.bgStyle,
          required this.frameStyle,
          required this.soundType,
          required this.soundVolume,
          required this.highContrast,
          required this.voiceAlerts,
          required super.child,
          });

          @override
          bool updateShouldNotify(CyberPillScope oldWidget) {
          return lang != oldWidget.lang ||
          themeKey != oldWidget.themeKey ||
          bgStyle != oldWidget.bgStyle ||
          frameStyle != oldWidget.frameStyle ||
          soundType != oldWidget.soundType ||
          soundVolume != oldWidget.soundVolume ||
          highContrast != oldWidget.highContrast ||
          voiceAlerts != oldWidget.voiceAlerts;
          }
          }

          class CyberPillMasterApp extends StatefulWidget {
          const CyberPillMasterApp({super.key});

          static _CyberPillMasterAppState of(BuildContext context) {
          final scope = context.dependOnInheritedWidgetOfExactType<CyberPillScope>();
          if (scope != null) return scope.state;
          return context.findAncestorStateOfType<_CyberPillMasterAppState>()!;
          }

          @override
          State<CyberPillMasterApp> createState() => _CyberPillMasterAppState();
          }

          class _CyberPillMasterAppState extends State<CyberPillMasterApp> {
          String _lang = 'he';
          String _userName = '';
          bool _voiceAlerts = true;
          bool _highContrast = false;
          String _soundType = 'voice';
          double _soundVolume = 1.0;
          String _themeKey = 'cyber_neon';
          String _bgStyle = 'space';
          String _frameStyle = 'glossy_plastic';
          bool _firstRun = true;
          bool _initialized = false;

          String get currentLang => _lang;
          String get userName => _userName;
          bool get voiceAlerts => _voiceAlerts;
          bool get highContrast => _highContrast;
          String get soundType => _soundType;
          double get soundVolume => _soundVolume;
          String get themeKey => _themeKey;
          String get bgStyle => _bgStyle;
          String get frameStyle => _frameStyle;
          bool get firstRun => _firstRun;
          ThemePalette get currentPalette => themePalettes[_themeKey] ?? themePalettes['cyber_neon'] ?? themePalettes['cyberpunk']!;

          @override
          void initState() {
          super.initState();
          _loadConfig();
          }

          Future<void> _loadConfig() async {
          try {
          final prefs = await SharedPreferences.getInstance();
          if (mounted) {
          setState(() {
          _lang = prefs.getString('c_lang') ?? 'he';
          _userName = prefs.getString('c_user_name') ?? '';
          _voiceAlerts = prefs.getBool('c_voice') ?? true;
          _highContrast = prefs.getBool('c_hc') ?? false;
          _soundType = prefs.getString('c_sound') ?? 'voice';
          _soundVolume = prefs.getDouble('c_volume') ?? 1.0;
          _themeKey = prefs.getString('c_theme') ?? 'cyber_neon';
          _bgStyle = prefs.getString('c_bg_style') ?? 'space';
          _frameStyle = prefs.getString('c_frame_style') ?? 'glossy_plastic';
          _firstRun = prefs.getBool('c_first_run') ?? true;
          _initialized = true;
          });
          }
          } catch (e) {
          debugPrint('Config load error: $e');
          if (mounted) setState(() => _initialized = true);
          }
          }

          void setLanguage(String lang) {
          HapticFeedback.mediumImpact();
          setState(() {
          _lang = lang;
          });
          try {
          const Map<String, String> langMap = {
          'he': 'he-IL', 'en': 'en-US', 'ar': 'ar-SA',
          'ru': 'ru-RU', 'fr': 'fr-FR', 'es': 'es-ES'
          };
          flutterTts.setLanguage(langMap[lang] ?? 'he-IL');
          } catch (_) {}
          SharedPreferences.getInstance().then((prefs) => prefs.setString('c_lang', lang));
          }

          void completeOnboarding(String name, String lang) {
          HapticFeedback.heavyImpact();
          setState(() {
          _userName = name;
          _lang = lang;
          _firstRun = false;
          });
          SharedPreferences.getInstance().then((prefs) async {
          await prefs.setString('c_user_name', name);
          await prefs.setString('c_lang', lang);
          await prefs.setBool('c_first_run', false);
          });
          }

          void setFrameStyle(String style) {
          HapticFeedback.lightImpact();
          setState(() {
          _frameStyle = style;
          });
          SharedPreferences.getInstance().then((prefs) => prefs.setString('c_frame_style', style));
          }

          void setBgStyle(String style) {
          HapticFeedback.lightImpact();
          setState(() {
          _bgStyle = style;
          });
          SharedPreferences.getInstance().then((prefs) => prefs.setString('c_bg_style', style));
          }

          void setThemeKey(String key) {
          HapticFeedback.lightImpact();
          setState(() {
          _themeKey = key;
          });
          SharedPreferences.getInstance().then((prefs) => prefs.setString('c_theme', key));
          }

          void setVolume(double vol) {
          setState(() {
          _soundVolume = vol;
          });
          SharedPreferences.getInstance().then((prefs) => prefs.setDouble('c_volume', vol));
          }

          Future<void> saveFullSettings({
          String? lang,
          String? theme,
          String? bgStyle,
          String? frameStyle,
          String? sound,
          double? volume,
          bool? hc,
          bool? voice,
          }) async {
          HapticFeedback.heavyImpact();
          setState(() {
          if (lang != null) _lang = lang;
          if (theme != null) _themeKey = theme;
          if (bgStyle != null) _bgStyle = bgStyle;
          if (frameStyle != null) _frameStyle = frameStyle;
          if (sound != null) _soundType = sound;
          if (volume != null) _soundVolume = volume;
          if (hc != null) _highContrast = hc;
          if (voice != null) _voiceAlerts = voice;
          });

          try {
          final prefs = await SharedPreferences.getInstance();
          if (lang != null) await prefs.setString('c_lang', lang);
          if (theme != null) await prefs.setString('c_theme', theme);
          if (bgStyle != null) await prefs.setString('c_bg_style', bgStyle);
          if (frameStyle != null) await prefs.setString('c_frame_style', frameStyle);
          if (sound != null) await prefs.setString('c_sound', sound);
          if (volume != null) await prefs.setDouble('c_volume', volume);
          if (hc != null) await prefs.setBool('c_hc', hc);
          if (voice != null) await prefs.setBool('c_voice', voice);
          } catch (_) {}
          }

          @override
          Widget build(BuildContext context) {
          if (!_initialized) return const SizedBox();

          final bool isRtl = _lang == 'he' || _lang == 'ar';
          final palette = currentPalette;
          final Color primary = _highContrast ? const Color(0xFFFFE500) : palette.primary;

          return MaterialApp(
          title: 'CYBER PHARMA 3D',
          debugShowCheckedModeBanner: false,
          locale: Locale(_lang),
          supportedLocales: const [
          Locale('he'),
          Locale('en'),
          Locale('ar'),
          Locale('ru'),
          Locale('fr'),
          Locale('es'),
          ],
          localizationsDelegates: [
          GlobalMaterialLocalizations.delegate,
          GlobalWidgetsLocalizations.delegate,
          GlobalCupertinoLocalizations.delegate,
          ],
          theme: ThemeData(
          useMaterial3: true,
          scaffoldBackgroundColor: Colors.transparent,
          colorSchemeSeed: primary,
          fontFamily: 'sans-serif-medium',
          textTheme: ThemeData.dark().textTheme.apply(
          fontFamily: 'sans-serif-medium',
          decoration: TextDecoration.none,
          ),
          ),
          builder: (context, child) {
          return Directionality(
          textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
          child: CyberPillScope(
            key: ValueKey('scope_${_lang}_${_themeKey}_${_bgStyle}_${_frameStyle}'),
            state: this,
            lang: _lang,
            themeKey: _themeKey,
            bgStyle: _bgStyle,
            frameStyle: _frameStyle,
            soundType: _soundType,
            soundVolume: _soundVolume,
            highContrast: _highContrast,
            voiceAlerts: _voiceAlerts,
            child: child ?? const SizedBox(),
          ),
          );
          },
          home: AppSplashScreen(
          onFinish: () => _firstRun ? const FirstTimeSetupScreen() : const MainDashboard(),
          ),
          );
          }
          }
          Widget textChannel3D(
            String text, {
            required double fontSize,
            required Color color,
            Color? glowColor,
            TextAlign textAlign = TextAlign.start,
            FontWeight fontWeight = FontWeight.w900,
            double wordSpacing = 2.0,
          }) {
            final glow = glowColor ?? color;
            return Text(
              text,
              textAlign: textAlign,
              style: TextStyle(
                fontSize: fontSize,
                fontWeight: fontWeight,
                color: color,
                letterSpacing: 0.6,
                wordSpacing: wordSpacing,
                shadows: [
                  // Crisp high-contrast rim occlusion
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(-1.5, -1.5), blurRadius: 1.0),
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(1.5, -1.5), blurRadius: 1.0),
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(-1.5, 1.5), blurRadius: 1.0),
