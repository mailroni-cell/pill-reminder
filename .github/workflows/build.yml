            Map<String, dynamic> _calculateCompliance() {
              final now = DateTime.now();
              int dailyTotal = 0, dailyTaken = 0;
              int weeklyTotal = 0, weeklyTaken = 0;
              int monthlyTotal = 0, monthlyTaken = 0;

              for (var l in _logs) {
                final diff = now.difference(l.timestamp);
                if (diff.inDays == 0 && l.timestamp.day == now.day) {
                  dailyTotal++;
                  if (l.taken) dailyTaken++;
                }
                if (diff.inDays <= 7) {
                  weeklyTotal++;
                  if (l.taken) weeklyTaken++;
                }
                if (diff.inDays <= 30) {
                  monthlyTotal++;
                  if (l.taken) monthlyTaken++;
                }
              }

              return {
                'daily': dailyTotal == 0 ? 100 : ((dailyTaken / dailyTotal) * 100).round(),
                'weekly': weeklyTotal == 0 ? 100 : ((weeklyTaken / weeklyTotal) * 100).round(),
                'monthly': monthlyTotal == 0 ? 100 : ((monthlyTaken / monthlyTotal) * 100).round(),
                'weeklyTaken': weeklyTaken,
                'weeklyTotal': weeklyTotal,
              };
            }

