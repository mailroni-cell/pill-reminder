                              borderRadius: BorderRadius.circular(8),
                              border: Border.all(color: accentColor.withOpacity(0.8), width: 1.5),
                              boxShadow: [
                                BoxShadow(color: accentColor.withOpacity(0.3), blurRadius: 8),
                              ],
                            ),
                            child: Text(
                              '${(_currentVol * 100).toInt()}%',
                              style: TextStyle(
                                color: highlightColor,
                                fontWeight: FontWeight.w900,
                                fontSize: 16,
                                letterSpacing: 1.0,
                                decoration: TextDecoration.none,
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 14),
                      // 3D Physical Rotary Dial Graphic
                      GestureDetector(
                        onPanUpdate: (details) {
                          // Vertical swipe or rotary gesture to smoothly adjust volume
                          final double delta = -details.delta.dy * 0.0075 + details.delta.dx * 0.0075;
                          if (delta.abs() > 0.001) {
