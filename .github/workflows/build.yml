              await prefs.setString('c_lang', lang);
              setState(() {
                _lang = lang;
                _appKey = UniqueKey();
              });
            }

            void completeOnboarding(String name, String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_user_name', name);
              await prefs.setString('c_lang', lang);
              await prefs.setBool('c_first_run', false);
              setState(() {
                _userName = name;
                _lang = lang;
                _firstRun = false;
                _appKey = UniqueKey();
              });
            }

            void setThemeKey(String key) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_theme', key);
              setState(() => _themeKey = key);
            }

            void updateSettings({bool? voice, bool? hc, String? soundMed, String? soundDoc, double? volume}) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (voice != null) {
                  _voiceAlerts = voice;
                  prefs.setBool('c_voice', voice);
                }
                if (hc != null) {
                  _highContrast = hc;
                  prefs.setBool('c_hc', hc);
                }
                if (soundMed != null) {
                  _soundMed = soundMed;
                  prefs.setString('c_sound_med', soundMed);
                }
                if (soundDoc != null) {
                  _soundDoc = soundDoc;
                  prefs.setString('c_sound_doc', soundDoc);
                }
                if (volume != null) {
                  _soundVolume = volume;
                  prefs.setDouble('c_volume', volume);
                }
              });
            }

            Future<void> playAudioTone(String type, double vol) async {
              try {
                await nativeAudio.invokeMethod('playTone', {
                  'type': type,
                  'volume': vol,
                });
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              if (!_initialized) return const SizedBox();

              final bool isRtl = _lang == 'he';
              final palette = themePalettes[_themeKey] ?? themePalettes['cyber']!;
              final Color bg = _highContrast ? Colors.black : palette['bg']!;
              final Color primary = _highContrast ? const Color(0xFFFFD700) : palette['accent']!;

              return KeyedSubtree(
                key: _appKey,
                child: MaterialApp(
                  title: 'Cyber Pharma',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    useMaterial3: true,
                    scaffoldBackgroundColor: bg,
