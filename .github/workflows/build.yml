          class PillItem {
            String name;
            int dosage;
            int stock;
            PillItem({required this.name, required this.dosage, required this.stock});

            Map<String, dynamic> toMap() => {'name': name, 'dosage': dosage, 'stock': stock};
            factory PillItem.fromMap(Map<String, dynamic> map) => PillItem(
                  name: map['name'],
                  dosage: map['dosage'] ?? 1,
                  stock: map['stock'] ?? 30,
                );
          }

          class ScheduleGroup {
            String id;
            String title;
            int hour;
            int minute;
            List<PillItem> pills;
            bool isTaken;

            ScheduleGroup({
              required this.id,
              required this.title,
              required this.hour,
              required this.minute,
              required this.pills,
              this.isTaken = false,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'title': title,
                  'hour': hour,
                  'minute': minute,
                  'pills': pills.map((p) => p.toMap()).toList(),
                  'isTaken': isTaken,
                };

            factory ScheduleGroup.fromMap(Map<String, dynamic> map) => ScheduleGroup(
                  id: map['id'],
                  title: map['title'] ?? '',
                  hour: map['hour'],
                  minute: map['minute'],
                  pills: (map['pills'] as List).map((p) => PillItem.fromMap(p)).toList(),
                  isTaken: map['isTaken'] ?? false,
                );
          }

          class AppointmentModel {
            String id;
            String doctor;
            String clinic;
            String date;
            String time;

            AppointmentModel({
              required this.id,
              required this.doctor,
              required this.clinic,
              required this.date,
              required this.time,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'doctor': doctor,
                  'clinic': clinic,
                  'date': date,
                  'time': time,
                };

            factory AppointmentModel.fromMap(Map<String, dynamic> map) => AppointmentModel(
