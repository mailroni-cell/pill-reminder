          class LiveAddressService {
            static final Map<String, List<String>> _memoryCache = {};

            static Future<List<String>> searchAddresses(String query) async {
              final clean = query.trim();
              if (clean.length < 2) return [];

              if (_memoryCache.containsKey(clean)) {
                return _memoryCache[clean]!;
              }

              final List<String> results = [];

              // 1. Try OpenStreetMap Nominatim API (Supports Streets, Clinics, Hospitals, Cities in Israel)
              try {
                final client = HttpClient();
                client.connectionTimeout = const Duration(seconds: 4);
                final uri = Uri.parse(
                  'https://nominatim.openstreetmap.org/search?q=${Uri.encodeComponent(clean)}&format=json&countrycodes=il&addressdetails=1&limit=10&accept-language=he,en',
                );
                final request = await client.getUrl(uri);
                request.headers.set('User-Agent', 'CyberPharma3D/1.0 (Mobile App)');
                final response = await request.close().timeout(const Duration(seconds: 5));
                if (response.statusCode == 200) {
                  final body = await response.transform(utf8.decoder).join();
                  final List<dynamic> list = jsonDecode(body);
                  for (final item in list) {
                    if (item is Map && item.containsKey('display_name')) {
                      final addr = item['address'] as Map<String, dynamic>?;
                      String formatted = '';
                      if (addr != null) {
                        final road = (addr['road'] ?? addr['pedestrian'] ?? addr['footway'] ?? '').toString();
                        final houseNumber = (addr['house_number'] ?? '').toString();
                        final city = (addr['city'] ?? addr['town'] ?? addr['village'] ?? addr['municipality'] ?? addr['hamlet'] ?? '').toString();
                        final amenity = (addr['amenity'] ?? addr['hospital'] ?? addr['clinic'] ?? addr['pharmacy'] ?? '').toString();

                        final List<String> parts = [];
                        if (amenity.isNotEmpty) parts.add(amenity);
                        if (road.isNotEmpty) {
                          parts.add(houseNumber.isNotEmpty ? '$road $houseNumber' : road);
                        }
                        if (city.isNotEmpty && !parts.contains(city)) parts.add(city);

                        if (parts.isNotEmpty) {
                          formatted = parts.join(', ');
                        }
                      }
                      if (formatted.isEmpty) {
                        final String raw = item['display_name'].toString();
                        formatted = raw.split(',').take(3).map((e) => e.trim()).join(', ');
                      }
                      if (formatted.isNotEmpty && !results.contains(formatted)) {
                        results.add(formatted);
                      }
                    }
                  }
                }
              } catch (_) {}

              // 2. Try Komoot Photon API if Nominatim yielded few/no results
              if (results.length < 3) {
                try {
                  final client = HttpClient();
                  client.connectionTimeout = const Duration(seconds: 3);
                  final uri = Uri.parse(
                    'https://photon.komoot.io/api/?q=${Uri.encodeComponent(clean)}&limit=8&lang=he',
                  );
                  final request = await client.getUrl(uri);
                  final response = await request.close().timeout(const Duration(seconds: 4));
                  if (response.statusCode == 200) {
                    final body = await response.transform(utf8.decoder).join();
                    final Map<String, dynamic> data = jsonDecode(body);
                    final List<dynamic> features = data['features'] ?? [];
                    for (final f in features) {
                      final props = f['properties'] as Map<String, dynamic>?;
                      if (props != null) {
                        final country = (props['country'] ?? '').toString();
                        if (country.isNotEmpty && country != 'Israel' && country != 'ישראל') {
                          continue;
                        }
                        final name = (props['name'] ?? '').toString();
                        final street = (props['street'] ?? '').toString();
                        final houseNumber = (props['housenumber'] ?? '').toString();
                        final city = (props['city'] ?? props['town'] ?? props['village'] ?? '').toString();

                        final List<String> parts = [];
                        if (name.isNotEmpty) parts.add(name);
                        if (street.isNotEmpty && !parts.contains(street)) {
                          parts.add(houseNumber.isNotEmpty ? '$street $houseNumber' : street);
                        }
                        if (city.isNotEmpty && !parts.contains(city)) parts.add(city);

                        final formatted = parts.join(', ');
                        if (formatted.isNotEmpty && !results.contains(formatted)) {
                          results.add(formatted);
                        }
                      }
                    }
                  }
                } catch (_) {}
              }

              // 3. Fallback / supplement with local Israeli settlements if offline or zero results
              if (results.isEmpty) {
                final localMatches = israelAllLocalities
                    .where((l) => l.contains(clean))
                    .take(6)
                    .toList();
                results.addAll(localMatches);
              }

              if (results.isNotEmpty) {
                _memoryCache[clean] = results;
              }
              return results;
            }
          }

          class MedicationsRegistry {
            static List<String> cachedMeds = List.from(defaultMedicationsCatalog);

            static Future<void> init() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final saved = prefs.getStringList('custom_meds_cache');
                if (saved != null && saved.isNotEmpty) {
                  cachedMeds = saved;
                }
              } catch (_) {}
            }

            static void addCustomMedication(String name) async {
              final trimmed = name.trim();
              if (trimmed.isEmpty) return;
              if (!cachedMeds.contains(trimmed)) {
                cachedMeds.insert(0, trimmed);
                try {
                  final prefs = await SharedPreferences.getInstance();
                  await prefs.setStringList('custom_meds_cache', cachedMeds);
                } catch (_) {}
              }
            }
          }

