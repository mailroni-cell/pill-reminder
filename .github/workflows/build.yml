          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            tz.initializeTimeZones();

            const AndroidInitializationSettings initializationSettingsAndroid =
                AndroidInitializationSettings('@mipmap/ic_launcher');

            const InitializationSettings initializationSettings = InitializationSettings(
              android: initializationSettingsAndroid,
            );

            await flutterLocalNotificationsPlugin.initialize(initializationSettings);

            runApp(const PillAppRoot());
          }

          class AppSettingsState {
            String lang = 'he';
            bool voiceAlerts = true;
            double voiceRate = 0.45;
            String themeColor = 'blue';
            bool highContrast = false;
          }

          class PillAppRoot extends StatefulWidget {
            const PillAppRoot({super.key});

            static _PillAppRootState of(BuildContext context) =>
                context.findAncestorStateOfType<_PillAppRootState>()!;

            @override
            State<PillAppRoot> createState() => _PillAppRootState();
          }

          class _PillAppRootState extends State<PillAppRoot> {
            final AppSettingsState settings = AppSettingsState();

            @override
            void initState() {
              super.initState();
              _loadPreferences();
            }

            Future<void> _loadPreferences() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                settings.lang = prefs.getString('app_lang') ?? 'he';
                settings.voiceAlerts = prefs.getBool('app_voice_alerts') ?? true;
                settings.voiceRate = prefs.getDouble('app_voice_rate') ?? 0.45;
                settings.themeColor = prefs.getString('app_theme_color') ?? 'blue';
                settings.highContrast = prefs.getBool('app_high_contrast') ?? false;
              });
            }

            void updateSettings({
              String? lang,
              bool? voiceAlerts,
              double? voiceRate,
              String? themeColor,
              bool? highContrast,
            }) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (lang != null) {
                  settings.lang = lang;
                  prefs.setString('app_lang', lang);
                }
                if (voiceAlerts != null) {
                  settings.voiceAlerts = voiceAlerts;
                  prefs.setBool('app_voice_alerts', voiceAlerts);
                }
                if (voiceRate != null) {
                  settings.voiceRate = voiceRate;
                  prefs.setDouble('app_voice_rate', voiceRate);
                }
                if (themeColor != null) {
                  settings.themeColor = themeColor;
                  prefs.setString('app_theme_color', themeColor);
                }
                if (highContrast != null) {
                  settings.highContrast = highContrast;
                  prefs.setBool('app_high_contrast', highContrast);
                }
              });
            }

            Color getPrimaryColor() {
              if (settings.highContrast) return Colors.black;
              switch (settings.themeColor) {
                case 'green':
                  return const Color(0xFF1B6B48);
                case 'purple':
                  return const Color(0xFF5B2C86);
                default:
                  return const Color(0xFF1E4C74);
              }
            }

            Color getBackgroundColor() {
              if (settings.highContrast) return Colors.white;
              return const Color(0xFFE9EFF5);
            }

            @override
            Widget build(BuildContext context) {
              final bool isRtl = settings.lang == 'he' || settings.lang == 'ar';
              return MaterialApp(
                title: 'Pill Reminder',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: getBackgroundColor(),
                  colorSchemeSeed: getPrimaryColor(),
                ),
                home: Directionality(
                  textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                  child: SplashScreen(settings: settings),
                ),
              );
            }
          }

          // 3D Neumorphic Box Decoration Helper
          BoxDecoration neumorphicDecoration({
            double borderRadius = 20,
            bool isPressed = false,
            bool highContrast = false,
            Color baseColor = const Color(0xFFE9EFF5),
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? Colors.grey.shade300 : Colors.white,
                borderRadius: BorderRadius.circular(borderRadius),
                border: Border.all(color: Colors.black, width: 2.5),
              );
            }
            if (isPressed) {
              return BoxDecoration(
                color: baseColor,
                borderRadius: BorderRadius.circular(borderRadius),
                boxShadow: [
                  BoxShadow(
                    color: Colors.black.withOpacity(0.14),
                    offset: const Offset(3, 3),
                    blurRadius: 4,
                  ),
                  BoxShadow(
                    color: Colors.white.withOpacity(0.9),
                    offset: const Offset(-3, -3),
                    blurRadius: 4,
                  ),
                ],
              );
            }
            return BoxDecoration(
              color: baseColor,
              borderRadius: BorderRadius.circular(borderRadius),
              boxShadow: [
                BoxShadow(
                  color: const Color(0xFFA6B5C8).withOpacity(0.7),
                  offset: const Offset(6, 6),
                  blurRadius: 12,
                ),
                BoxShadow(
                  color: Colors.white,
                  offset: const Offset(-6, -6),
                  blurRadius: 12,
                ),
              ],
            );
          }

          // Splash Screen
          class SplashScreen extends StatefulWidget {
            final AppSettingsState settings;
            const SplashScreen({super.key, required this.settings});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(seconds: 3), () {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (ctx) => MainPillScreen(settings: widget.settings)),
                );
              });
            }

            @override
            Widget build(BuildContext context) {
              final t = translations[widget.settings.lang]!;
              final bool hc = widget.settings.highContrast;
              return Scaffold(
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        width: 140,
                        height: 140,
                        decoration: neumorphicDecoration(borderRadius: 40, highContrast: hc),
                        child: Icon(
                          Icons.medication_liquid_sharp,
                          size: 75,
                          color: PillAppRoot.of(context).getPrimaryColor(),
                        ),
                      ),
                      const SizedBox(height: 36),
                      Text(
                        t['app_title']!,
                        style: TextStyle(
                          fontSize: hc ? 34 : 28,
                          fontWeight: FontWeight.w900,
