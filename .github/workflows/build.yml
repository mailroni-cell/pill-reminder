            @override
            State<AppSplashScreen> createState() => _AppSplashScreenState();
          }

          class _AppSplashScreenState extends State<AppSplashScreen> with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _requestPermissionsAndLaunch();
            }

            Future<void> _requestPermissionsAndLaunch() async {
              try {
                await Permission.notification.request();
              } catch (_) {}
              try {
                await flutterNotifications
                    .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                    ?.requestNotificationsPermission();
              } catch (_) {}

              _anim = AnimationController(vsync: this, duration: const Duration(milliseconds: 1800))..forward();
              Timer(const Duration(milliseconds: 2100), () {
                if (mounted) {
                  Navigator.of(context).pushReplacement(
                    PageRouteBuilder(
                      transitionDuration: const Duration(milliseconds: 700),
                      pageBuilder: (_, __, ___) => widget.onFinish(),
                      transitionsBuilder: (_, a, __, c) => FadeTransition(opacity: a, child: c),
                    ),
                  );
                }
              });
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
