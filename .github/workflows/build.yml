                                      Column(
                                        children: [
                                          Text('${comp['weekly']}%', style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w900, color: Color(0xFF10B981))),
                                          Text(t['compliance_weekly']!, style: const TextStyle(fontSize: 11, color: Colors.white60)),
                                        ],
                                      ),
                                      Column(
                                        children: [
                                          Text('${comp['monthly']}%', style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w900, color: Colors.amberAccent)),
                                          Text(t['compliance_monthly']!, style: const TextStyle(fontSize: 11, color: Colors.white60)),
                                        ],
                                      ),
                                    ],
                                  ),
                                  const Divider(color: Colors.white24, height: 24),
                                  Text(
                                    'סה"כ נלקחו ${comp['weeklyTaken']} מתוך ${comp['weeklyTotal']} מנות מתוזמנות בשבעת הימים האחרונים.',
                                    textAlign: TextAlign.center,
                                    style: const TextStyle(color: Colors.white70, fontSize: 12),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(height: 16),
                            GestureDetector(
                              onTap: _exportAndSharePdf,
                              child: Container(
                                height: 50,
                                decoration: cyber3D(context: context, radius: 18, highContrast: hc, customGlow: const Color(0xFF10B981)),
                                child: Row(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  children: [
                                    const Icon(Icons.share, color: Color(0xFF10B981)),
                                    const SizedBox(width: 8),
                                    Text(
                                      t['share_pdf']!,
                                      style: const TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold, fontSize: 14),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                            const SizedBox(height: 20),
                            Text('יומן נטילות אחרונות', style: TextStyle(color: accent, fontSize: 16, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 8),
                            _logs.isEmpty
                                ? const Padding(
                                    padding: EdgeInsets.all(20),
                                    child: Center(child: Text('טרם נרשמו פעולות נטילה', style: TextStyle(color: Colors.white38))),
                                  )
                                : ListView.builder(
                                    shrinkWrap: true,
                                    physics: const NeverScrollableScrollPhysics(),
                                    itemCount: math.min(10, _logs.length),
                                    itemBuilder: (ctx, lIdx) {
                                      final log = _logs[lIdx];
                                      return Container(
                                        margin: const EdgeInsets.only(bottom: 8),
                                        padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 8),
                                        decoration: cyber3D(context: context, radius: 14, highContrast: hc),
                                        child: Row(
                                          children: [
                                            Icon(
                                              log.taken ? Icons.check_circle : Icons.cancel,
                                              color: log.taken ? const Color(0xFF10B981) : Colors.redAccent,
                                            ),
                                            const SizedBox(width: 10),
                                            Expanded(
                                              child: Column(
                                                crossAxisAlignment: CrossAxisAlignment.start,
                                                children: [
                                                  Text(log.pillName, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                                  Text(DateFormat('dd/MM HH:mm').format(log.timestamp), style: const TextStyle(color: Colors.white38, fontSize: 11)),
                                                ],
                                              ),
                                            ),
                                            Text(
                                              log.taken ? 'נלקח' : 'דולג',
                                              style: TextStyle(
                                                color: log.taken ? const Color(0xFF10B981) : Colors.redAccent,
                                                fontWeight: FontWeight.bold,
                                                fontSize: 12,
                                              ),
                                            ),
                                          ],
                                        ),
                                      );
                                    },
                                  ),
                          ],
                        ),
                      ],
                    ),
                  ),
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: _tabController.index == 2
                      ? null
                      : Padding(
                          padding: const EdgeInsets.only(bottom: 10),
                          child: GestureDetector(
                            onTap: () {
                              if (_tabController.index == 0) {
                                _openAddScheduleDialog();
                              } else if (_tabController.index == 1) {
                                _openAddAppointmentDialog();
                              }
                            },
                            child: Container(
                              padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),
                              decoration: cyber3D(context: context, radius: 26, highContrast: hc),
                              child: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Icon(Icons.add, color: hc ? const Color(0xFFFFD700) : Colors.white),
                                  const SizedBox(width: 8),
                                  Text(
                                    _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                                    style: TextStyle(
                                      fontWeight: FontWeight.bold,
                                      fontSize: 16,
                                      color: hc ? const Color(0xFFFFD700) : Colors.white,
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
