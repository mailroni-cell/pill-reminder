          class Pill3DPainter extends CustomPainter {
            final Color topColor;
            final Color bottomColor;
            final Color glowColor;

            Pill3DPainter({
              required this.topColor,
              required this.bottomColor,
              required this.glowColor,
            });

            @override
            void paint(Canvas canvas, Size size) {
              final center = Offset(size.width / 2, size.height / 2);

              // 1. Radiant 360-Degree LED Glow Ring Around Capsule
              final ringRadius = size.width * 0.44;
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = const Color(0xFF00E5FF).withOpacity(0.25)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 10)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 6.0,
              );
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = const Color(0xFFD500F9).withOpacity(0.35)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 3.5,
              );
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = const Color(0xFF00F5FF)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.8,
              );
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = Colors.white.withOpacity(0.9)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 0.8,
              );

              // 12 High-Intensity Perimeter LED Nodes
              const ledColors = [
                Color(0xFF00F5FF),
                Color(0xFF80D8FF),
                Color(0xFFD500F9),
                Color(0xFFFF4081),
                Color(0xFF7C4DFF),
                Color(0xFF00E5FF),
                Color(0xFF00F5FF),
                Color(0xFFE040FB),
                Color(0xFFD500F9),
                Color(0xFF00FFCC),
                Color(0xFF80D8FF),
                Color(0xFF7C4DFF),
              ];
              for (int i = 0; i < 12; i++) {
                final angle = i * (2 * math.pi / 12);
                final diodePos = Offset(
                  center.dx + ringRadius * math.cos(angle),
                  center.dy + ringRadius * math.sin(angle),
                );
                canvas.drawCircle(diodePos, 3.0, Paint()..color = const Color(0xFF060A14));
                canvas.drawCircle(
                  diodePos,
                  2.2,
                  Paint()
                    ..color = ledColors[i].withOpacity(0.6)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 2),
                );
                canvas.drawCircle(diodePos, 1.6, Paint()..color = ledColors[i]);
                canvas.drawCircle(diodePos, 0.7, Paint()..color = Colors.white);
              }

              // 2. 3D Floating Isometric Neon Capsule (Angled at 45°)
              canvas.save();
              canvas.translate(center.dx, center.dy);
              canvas.rotate(-math.pi / 4);

              final pillWidth = size.width * 0.38;
              final pillHeight = size.height * 0.82;
              final radius = pillWidth / 2;

              final baseRect = Rect.fromCenter(center: Offset.zero, width: pillWidth, height: pillHeight);
              final rrect = RRect.fromRectAndRadius(baseRect, Radius.circular(radius));

              // Deep 3D Contact Occlusion Shadows
              canvas.drawRRect(
                rrect.shift(const Offset(6, 10)),
                Paint()
                  ..color = Colors.black.withOpacity(0.85)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 10),
              );
              canvas.drawRRect(
                rrect.shift(const Offset(3, 5)),
                Paint()
                  ..color = const Color(0xFF020409).withOpacity(0.9)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5),
              );

              // Outer Radiant Aura
              canvas.drawRRect(
                rrect,
                Paint()
                  ..color = const Color(0xFF00E5FF).withOpacity(0.4)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 12),
              );

              canvas.clipRRect(rrect);

              // 3. Top Half (Electric Laser Blue / Hyper-Cyan)
              final topHalfRect = Rect.fromLTRB(-pillWidth / 2, -pillHeight / 2, pillWidth / 2, 0);
              final topPaint = Paint()
                ..shader = const LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: [
                    Color(0xFFFFFFFF),
                    Color(0xFF80D8FF),
                    Color(0xFF00E5FF),
                    Color(0xFF0052CC),
                    Color(0xFF002B49),
                  ],
                  stops: [0.0, 0.25, 0.55, 0.85, 1.0],
                ).createShader(topHalfRect);
              canvas.drawRect(topHalfRect, topPaint);

              // 4. Bottom Half (Laser Radiant Purple / Neon Magenta)
              final bottomHalfRect = Rect.fromLTRB(-pillWidth / 2, 0, pillWidth / 2, pillHeight / 2);
              final bottomPaint = Paint()
                ..shader = const LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: [
                    Color(0xFFFF80AB),
                    Color(0xFFFF4081),
                    Color(0xFFD500F9),
                    Color(0xFF7B1FA2),
                    Color(0xFF2E023D),
                  ],
                  stops: [0.0, 0.25, 0.55, 0.85, 1.0],
                ).createShader(bottomHalfRect);
              canvas.drawRect(bottomHalfRect, bottomPaint);

              // 5. Central High-Tech Superconductor Connector Ring
              final ringRect = Rect.fromCenter(center: Offset.zero, width: pillWidth * 1.1, height: pillHeight * 0.08);
              canvas.drawRRect(
                RRect.fromRectAndRadius(ringRect, const Radius.circular(3)),
                Paint()..color = const Color(0xFF080E1C),
              );
              final beamRect = Rect.fromCenter(center: Offset.zero, width: pillWidth * 1.05, height: pillHeight * 0.035);
              canvas.drawRRect(
                RRect.fromRectAndRadius(beamRect, const Radius.circular(2)),
                Paint()
                  ..shader = const LinearGradient(
                    colors: [Color(0xFF00E5FF), Color(0xFF00FFCC), Colors.white, Color(0xFF00FFCC), Color(0xFF00E5FF)],
                  ).createShader(beamRect),
              );

              // 6. Ultra-Gloss Glass Specular Reflections
              final sheenPath = Path()
                ..moveTo(-pillWidth * 0.32, -pillHeight * 0.44)
                ..quadraticBezierTo(-pillWidth * 0.05, -pillHeight * 0.42, 0, -pillHeight * 0.18)
                ..lineTo(-pillWidth * 0.22, -pillHeight * 0.18)
                ..close();
              canvas.drawPath(sheenPath, Paint()..color = Colors.white.withOpacity(0.9));

              final glintPath = Path()
                ..moveTo(-pillWidth * 0.36, -pillHeight * 0.38)
                ..lineTo(-pillWidth * 0.36, -pillHeight * 0.1)
                ..lineTo(-pillWidth * 0.30, -pillHeight * 0.1)
                ..lineTo(-pillWidth * 0.30, -pillHeight * 0.38)
                ..close();
              canvas.drawPath(glintPath, Paint()..color = Colors.white.withOpacity(0.6));

              // Bottom Glass Fresnel Reflection Rim
              final rimPath = Path()
                ..arcTo(
                  Rect.fromCircle(center: Offset(0, pillHeight * 0.25), radius: pillWidth * 0.42),
                  math.pi * 0.2,
                  math.pi * 0.6,
                  false,
                );
              canvas.drawPath(
                rimPath,
                Paint()
                  ..color = const Color(0xFFD500F9).withOpacity(0.4)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.0
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 2),
              );

              canvas.restore();
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

