                      IconButton(
                        icon: Icon(Icons.settings, color: hc ? const Color(0xFFFFE500) : null),
                        onPressed: _openSettingsDialog,
                      ),
                    ],
                    bottom: TabBar(
                      controller: _tabController,
                      indicatorColor: accent,
                      indicatorWeight: 3.5,
                      labelColor: accent,
                      unselectedLabelColor: Colors.white38,
                      tabs: [
                        Tab(icon: const Icon(Icons.medication_liquid), text: t['meds_tab']!),
                        Tab(icon: const Icon(Icons.calendar_month), text: t['appointments_tab']!),
                      ],
                    ),
                  ),
                  body: SafeArea(
                    child: TabBarView(
                      controller: _tabController,
                      children: [
                        // Meds Tab
                        _schedules.isEmpty
                            ? Center(child: Text(t['empty_meds']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white38, fontSize: 18, fontWeight: FontWeight.bold)))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 90),
                                itemCount: _schedules.length,
                                itemBuilder: (ctx, i) {
                                  final sched = _schedules[i];
                                  final timeStr = '${sched.hour.toString().padLeft(2, '0')}:${sched.minute.toString().padLeft(2, '0')}';
                                  return Container(
                                    margin: const EdgeInsets.only(bottom: 14),
                                    decoration: cyber3D(context: context, radius: 20, isPressed: sched.isTaken, highContrast: hc),
                                    child: ListTile(
                                      contentPadding: const EdgeInsets.all(14),
                                      leading: Icon(sched.isTaken ? Icons.check_circle : Icons.alarm_on, color: sched.isTaken ? const Color(0xFF00FF88) : accent, size: 32),
                                      title: Text(
                                        sched.title.isNotEmpty ? sched.title : timeStr,
                                        style: TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: hc ? const Color(0xFFFFE500) : Colors.white),
                                      ),
                                      subtitle: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          Text('$timeStr • ${sched.pills.length} תרופות', style: TextStyle(color: hc ? Colors.white : Colors.white70)),
                                          ...sched.pills.map((p) => Text('• ${p.name} (מינון: ${p.dosage})', style: TextStyle(color: hc ? const Color(0xFFFFE500) : const Color(0xFF00F0FF), fontWeight: FontWeight.bold))),
                                        ],
                                      ),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.delete_forever, color: Colors.redAccent),
                                        onPressed: () {
                                          setState(() => _schedules.removeAt(i));
                                          _saveSchedules();
                                        },
                                      ),
                                    ),
                                  );
                                },
                              ),
                        // Appointments Tab
                        _apps.isEmpty
                            ? Center(child: Text(t['empty_apps']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white38, fontSize: 18, fontWeight: FontWeight.bold)))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 90),
                                itemCount: _apps.length,
                                itemBuilder: (ctx, i) {
                                  final appItem = _apps[i];
                                  return Container(
                                    margin: const EdgeInsets.only(bottom: 14),
                                    decoration: cyber3D(context: context, radius: 20, highContrast: hc, customGlow: const Color(0xFFA855F7)),
                                    child: ListTile(
                                      contentPadding: const EdgeInsets.all(14),
                                      leading: Icon(Icons.local_hospital, size: 36, color: hc ? const Color(0xFFFFE500) : const Color(0xFFA855F7)),
                                      title: Text('${appItem.type}: ${appItem.doctor}', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: hc ? const Color(0xFFFFE500) : Colors.white)),
                                      subtitle: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          Text('${appItem.date}  •  ${appItem.time}', style: TextStyle(color: hc ? Colors.cyanAccent : const Color(0xFF38BDF8), fontWeight: FontWeight.bold)),
                                          if (appItem.clinic.isNotEmpty) ...[
                                            const SizedBox(height: 4),
                                            Text('📍 ${appItem.clinic}', style: TextStyle(color: hc ? Colors.white : Colors.white70)),
                                            const SizedBox(height: 6),
                                            Row(
                                              children: [
                                                GestureDetector(
                                                  onTap: () => _launchMap(appItem.clinic, true),
                                                  child: Container(
                                                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                                    decoration: BoxDecoration(color: const Color(0xFF00D1FF).withOpacity(0.2), borderRadius: BorderRadius.circular(8)),
                                                    child: Text(t['nav_waze']!, style: const TextStyle(fontSize: 12, color: Color(0xFF00D1FF), fontWeight: FontWeight.bold)),
                                                  ),
                                                ),
                                                const SizedBox(width: 8),
                                                GestureDetector(
                                                  onTap: () => _launchMap(appItem.clinic, false),
                                                  child: Container(
                                                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                                    decoration: BoxDecoration(color: const Color(0xFF34A853).withOpacity(0.2), borderRadius: BorderRadius.circular(8)),
                                                    child: Text(t['nav_google']!, style: const TextStyle(fontSize: 12, color: Color(0xFF34A853), fontWeight: FontWeight.bold)),
                                                  ),
                                                ),
                                              ],
                                            )
                                          ]
                                        ],
                                      ),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                        onPressed: () {
                                          setState(() => _apps.removeAt(i));
                                          _saveApps();
                                        },
                                      ),
                                    ),
                                  );
                                },
                              ),
                      ],
                    ),
                  ),
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: GestureDetector(
                    onTap: () {
                      if (_tabController.index == 0) {
                        _openAddScheduleDialog();
                      } else {
                        _openAddAppointmentDialog();
                      }
                    },
                    child: Container(
                      padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),
                      decoration: cyber3D(context: context, radius: 26, highContrast: hc, isMetallic: true),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.add, color: hc ? const Color(0xFFFFE500) : Colors.white),
                          const SizedBox(width: 8),
                          Text(
                            _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                            style: TextStyle(
                              fontWeight: FontWeight.w900,
                              fontSize: 16,
                              color: hc ? const Color(0xFFFFE500) : Colors.white,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
