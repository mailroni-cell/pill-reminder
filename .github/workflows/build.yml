            final app = CyberPillMasterApp.of(context);
            final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
            final Color surface = palette['surface']!;
            final Color bg = palette['bg']!;
            final Color glow = customGlow ?? palette['accent']!;

            if (isPressed) {
              // Beveled Rubber-inset look
              return BoxDecoration(
                color: surface.withOpacity(0.9),
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: glow.withOpacity(0.7), width: 1.8),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.9), offset: const Offset(4, 4), blurRadius: 8, spreadRadius: -2),
                  BoxShadow(color: glow.withOpacity(0.35), offset: const Offset(-2, -2), blurRadius: 6),
                ],
              );
            }

            // Futuristic Chamfered Metallic / Glowing 3D Glass Look
            return BoxDecoration(
              gradient: LinearGradient(
                colors: isMetallic
                    ? [surface.withOpacity(0.95), bg.withOpacity(0.9), surface.withOpacity(0.85)]
                    : [surface.withOpacity(0.92), bg.withOpacity(0.85)],
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
              ),
              borderRadius: BorderRadius.circular(radius),
              border: Border.all(color: glow.withOpacity(0.55), width: 1.5),
              boxShadow: [
                BoxShadow(color: Colors.black.withOpacity(0.85), offset: const Offset(6, 6), blurRadius: 16),
                BoxShadow(color: glow.withOpacity(0.3), offset: const Offset(-3, -3), blurRadius: 10),
              ],
            );
          }

          // Dynamic Configurable Ambient FX
          class DynamicFuturisticBackground extends StatefulWidget {
            final Widget child;
            final Color accentColor;
            final bool isHighContrast;
            final String effectType;

            const DynamicFuturisticBackground({
              super.key,
              required this.child,
              required this.accentColor,
              required this.isHighContrast,
              required this.effectType,
            });

            @override
            State<DynamicFuturisticBackground> createState() => _DynamicFuturisticBackgroundState();
          }

          class _DynamicFuturisticBackgroundState extends State<DynamicFuturisticBackground> with SingleTickerProviderStateMixin {
            late AnimationController _controller;

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(vsync: this, duration: const Duration(seconds: 6))..repeat();
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) return widget.child;

              return AnimatedBuilder(
                animation: _controller,
                builder: (context, child) {
                  return CustomPaint(
                    painter: BackgroundFXPainter(
                      progress: _controller.value,
                      color: widget.accentColor,
                      effect: widget.effectType,
                    ),
                    child: widget.child,
                  );
                },
              );
            }
          }

          class BackgroundFXPainter extends CustomPainter {
            final double progress;
            final Color color;
            final String effect;

            BackgroundFXPainter({required this.progress, required this.color, required this.effect});

            @override
            void paint(Canvas canvas, Size size) {
              if (effect == 'wave') {
                final paint = Paint()
                  ..shader = LinearGradient(
                    colors: [color.withOpacity(0.0), color.withOpacity(0.12), color.withOpacity(0.0)],
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                  ).createShader(Rect.fromLTWH(0, 0, size.width, size.height))
                  ..style = PaintingStyle.fill;

                final path = Path()..moveTo(0, size.height * 0.7);
                for (double x = 0; x <= size.width; x += 15) {
                  double y = math.sin((x / size.width * 2 * math.pi) + (progress * 2 * math.pi)) * 24 +
                      math.cos((x / size.width * 3 * math.pi) + (progress * 2 * math.pi)) * 12 +
                      size.height * 0.8;
                  path.lineTo(x, y);
                }
                path.lineTo(size.width, size.height);
                path.lineTo(0, size.height);
                path.close();
                canvas.drawPath(path, paint);
              } else if (effect == 'particles') {
                final paint = Paint()..color = color.withOpacity(0.2);
                for (int i = 0; i < 20; i++) {
                  double x = (math.sin(i * 99 + progress * 2 * math.pi) * 0.5 + 0.5) * size.width;
                  double y = ((i * 37 + progress * 150) % size.height);
                  canvas.drawCircle(Offset(x, y), (i % 3 + 2).toDouble(), paint);
                }
              } else {
                // Cyber 3D Grid Perspective Lines
                final paint = Paint()
                  ..color = color.withOpacity(0.07)
                  ..strokeWidth = 1.0;

                double offset = (progress * 40);
                for (double y = size.height * 0.5; y <= size.height; y += 30) {
                  canvas.drawLine(Offset(0, y), Offset(size.width, y), paint);
                }
                for (double x = 0; x <= size.width; x += 40) {
                  canvas.drawLine(Offset(x + (offset % 40) - 20, size.height * 0.5), Offset(x, size.height), paint);
                }
              }
            }

            @override
            bool shouldRepaint(covariant BackgroundFXPainter oldDelegate) => true;
          }

          // First Time Onboarding Screen
          class FirstTimeSetupScreen extends StatefulWidget {
            const FirstTimeSetupScreen({super.key});

            @override
            State<FirstTimeSetupScreen> createState() => _FirstTimeSetupScreenState();
          }

          class _FirstTimeSetupScreenState extends State<FirstTimeSetupScreen> {
            final TextEditingController _ctrl = TextEditingController();
            String _selectedLang = 'he';

            @override
            Widget build(BuildContext context) {
              final t = dict[_selectedLang] ?? dict['he']!;
              final bool isRtl = _selectedLang == 'he';

              return Directionality(
                textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                child: Scaffold(
                  body: SafeArea(
                    child: Center(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 20),
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Container(
                              width: 110,
                              height: 110,
                              decoration: cyber3D(context: context, radius: 35, isMetallic: true),
                              child: const Icon(Icons.shield_outlined, size: 65, color: Color(0xFF00F0FF)),
                            ),
                            const SizedBox(height: 20),
                            Text(
                              t['app_name']!,
                              textAlign: TextAlign.center,
                              style: const TextStyle(
                                fontSize: 26,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 2,
                                color: Colors.white,
                                shadows: [Shadow(color: Color(0xFF00F0FF), blurRadius: 15)],
                              ),
                            ),
                            const SizedBox(height: 6),
                            Text(
                              t['creator']!,
                              style: const TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: Colors.white60),
                            ),
                            const SizedBox(height: 35),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 18),
                              decoration: cyber3D(context: context, radius: 18, isPressed: true),
                              child: TextField(
                                controller: _ctrl,
                                textAlign: TextAlign.center,
                                style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF00F0FF)),
                                decoration: InputDecoration(
                                  border: InputBorder.none,
                                  hintText: t['name_hint']!,
                                  hintStyle: const TextStyle(color: Colors.white38),
                                ),
                              ),
