            String get soundMed => _soundMed;
            String get soundDoc => _soundDoc;
            double get soundVolume => _soundVolume;
            String get themeKey => _themeKey;

            @override
            void initState() {
              super.initState();
              _loadConfig();
            }

            Future<void> _loadConfig() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _lang = prefs.getString('c_lang') ?? 'he';
                _userName = prefs.getString('c_user_name') ?? '';
                _voiceAlerts = prefs.getBool('c_voice') ?? true;
                _highContrast = prefs.getBool('c_hc') ?? false;
                _soundMed = prefs.getString('c_sound_med') ?? 'electric';
                _soundDoc = prefs.getString('c_sound_doc') ?? 'alarm';
                _soundVolume = prefs.getDouble('c_volume') ?? 1.0;
                _themeKey = prefs.getString('c_theme') ?? 'cyber';
                _firstRun = prefs.getBool('c_first_run') ?? true;
                _initialized = true;
              });
            }

            void setLanguage(String lang) async {
