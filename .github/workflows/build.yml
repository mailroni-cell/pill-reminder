          class PillItem {
            String name;
            int dosage;
            int stock;
            PillItem({required this.name, required this.dosage, required this.stock});

            Map<String, dynamic> toMap() => {'name': name, 'dosage': dosage, 'stock': stock};
            factory PillItem.fromMap(Map<String, dynamic> map) => PillItem(
                  name: map['name'],
                  dosage: map['dosage'] ?? 1,
                  stock: map['stock'] ?? 30,
                );
          }

          class ScheduleGroup {
            String id;
            String title;
            int hour;
            int minute;
            List<PillItem> pills;
            bool isTaken;

            ScheduleGroup({
              required this.id,
              required this.title,
              required this.hour,
              required this.minute,
              required this.pills,
              this.isTaken = false,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'title': title,
                  'hour': hour,
                  'minute': minute,
                  'pills': pills.map((p) => p.toMap()).toList(),
                  'isTaken': isTaken,
                };

            factory ScheduleGroup.fromMap(Map<String, dynamic> map) => ScheduleGroup(
                  id: map['id'],
                  title: map['title'] ?? '',
                  hour: map['hour'],
                  minute: map['minute'],
                  pills: (map['pills'] as List).map((p) => PillItem.fromMap(p)).toList(),
                  isTaken: map['isTaken'] ?? false,
                );
          }

          class AppointmentModel {
            String id;
            String type;
            String doctor;
            String clinic;
            String date;
            String time;

            AppointmentModel({
              required this.id,
              required this.type,
              required this.doctor,
              required this.clinic,
              required this.date,
              required this.time,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'type': type,
                  'doctor': doctor,
                  'clinic': clinic,
                  'date': date,
                  'time': time,
                };

            factory AppointmentModel.fromMap(Map<String, dynamic> map) => AppointmentModel(
                  id: map['id'],
                  type: map['type'] ?? 'רופא מומחה',
                  doctor: map['doctor'],
                  clinic: map['clinic'],
                  date: map['date'],
                  time: map['time'],
                );
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            List<ScheduleGroup> _schedules = [];
            List<AppointmentModel> _apps = [];

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _loadData();
              _initTTS();
            }

            void _initTTS() async {
              final app = CyberPillMasterApp.of(context);
              await flutterTts.setLanguage(app.currentLang == 'he' ? 'he-IL' : 'en-US');
              await flutterTts.setSpeechRate(0.5);
              await flutterTts.setVolume(app.soundVolume);
            }

            Future<void> _loadData() async {
              final prefs = await SharedPreferences.getInstance();
              final String? schedsRaw = prefs.getString('c_multi_scheds_store_v6');
              if (schedsRaw != null) {
                final List decoded = jsonDecode(schedsRaw);
                setState(() => _schedules = decoded.map((e) => ScheduleGroup.fromMap(e)).toList());
              }
              final String? appsRaw = prefs.getString('c_apps_store_v6');
              if (appsRaw != null) {
                final List decodedA = jsonDecode(appsRaw);
                setState(() => _apps = decodedA.map((e) => AppointmentModel.fromMap(e)).toList());
              }
            }

            Future<void> _saveSchedules() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_multi_scheds_store_v6', jsonEncode(_schedules.map((m) => m.toMap()).toList()));
            }

            Future<void> _saveApps() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_apps_store_v6', jsonEncode(_apps.map((a) => a.toMap()).toList()));
            }

            void _speak(String text) async {
              final app = CyberPillMasterApp.of(context);
              if (app.voiceAlerts) {
                await flutterTts.setVolume(app.soundVolume);
                await flutterTts.speak(text);
              }
            }

            void _launchMap(String address, bool isWaze) async {
              if (address.trim().isEmpty) return;
              final encoded = Uri.encodeComponent(address.trim());
              final Uri url = isWaze
                  ? Uri.parse('https://waze.com/ul?q=$encoded')
                  : Uri.parse('https://www.google.com/maps/search/?api=1&query=$encoded');
              await launchUrl(url, mode: LaunchMode.externalApplication);
            }

