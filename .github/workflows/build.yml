                              SizedBox(
                                height: 86,
                                child: ListView.builder(
                                  scrollDirection: Axis.horizontal,
                                  physics: const BouncingScrollPhysics(),
                                  itemCount: themePalettes.values.length,
                                  itemBuilder: (context, idx) {
                                    final p = themePalettes.values.elementAt(idx);
