          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            tz.initializeTimeZones();
            const AndroidInitializationSettings initAndroid = AndroidInitializationSettings('@mipmap/ic_launcher');
            const InitializationSettings initSettings = InitializationSettings(android: initAndroid);
            await flutterNotifications.initialize(initSettings);
            runApp(const CyberPillMasterApp());
          }

          class CyberPillMasterApp extends StatefulWidget {
            const CyberPillMasterApp({super.key});

            static _CyberPillMasterAppState of(BuildContext context) =>
                context.findAncestorStateOfType<_CyberPillMasterAppState>()!;

            @override
            State<CyberPillMasterApp> createState() => _CyberPillMasterAppState();
          }

          class _CyberPillMasterAppState extends State<CyberPillMasterApp> {
            String _lang = 'he';
            String _userName = '';
            bool _voiceAlerts = true;
            bool _highContrast = false;
            String _soundType = 'electric';
            bool _initialized = false;
            Key _appKey = UniqueKey();

            String get currentLang => _lang;
            String get userName => _userName;
            bool get voiceAlerts => _voiceAlerts;
            bool get highContrast => _highContrast;
            String get soundType => _soundType;

            @override
            void initState() {
              super.initState();
              _loadConfig();
            }

            Future<void> _loadConfig() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _lang = prefs.getString('c_lang') ?? 'he';
                _userName = prefs.getString('c_user_name') ?? '';
                _voiceAlerts = prefs.getBool('c_voice') ?? true;
                _highContrast = prefs.getBool('c_hc') ?? false;
                _soundType = prefs.getString('c_sound') ?? 'electric';
                _initialized = true;
              });
            }

            void setLanguage(String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_lang', lang);
              setState(() {
                _lang = lang;
                _appKey = UniqueKey(); // Rebuild whole app immediately
              });
            }

            void setUserName(String name) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_user_name', name);
              setState(() => _userName = name);
            }

            void updateSettings({bool? voice, bool? hc, String? sound}) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (voice != null) {
                  _voiceAlerts = voice;
                  prefs.setBool('c_voice', voice);
                }
                if (hc != null) {
                  _highContrast = hc;
                  prefs.setBool('c_hc', hc);
                }
                if (sound != null) {
                  _soundType = sound;
                  prefs.setString('c_sound', sound);
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              if (!_initialized) return const SizedBox();

              final bool isRtl = _lang == 'he' || _lang == 'ar';
              final Color bg = _highContrast ? Colors.black : const Color(0xFF0F172A);
              final Color primary = _highContrast ? Colors.yellowAccent : const Color(0xFF06B6D4);

              return KeyedSubtree(
                key: _appKey,
                child: MaterialApp(
                  title: 'Cyber Pharma',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    useMaterial3: true,
                    scaffoldBackgroundColor: bg,
                    colorSchemeSeed: primary,
                  ),
                  home: Directionality(
                    textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                    child: _userName.isEmpty ? const OnboardingNameScreen() : const CyberSplashScreen(),
                  ),
                ),
              );
            }
          }

          BoxDecoration cyber3D({
            double radius = 24,
            bool isPressed = false,
            bool highContrast = false,
            Color glowColor = const Color(0xFF06B6D4),
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? const Color(0xFF222200) : Colors.black,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: Colors.yellowAccent, width: 2.8),
                boxShadow: const [
                  BoxShadow(color: Colors.yellowAccent, blurRadius: 4, offset: Offset(1, 1))
                ],
              );
            }
            if (isPressed) {
              return BoxDecoration(
                color: const Color(0xFF1E293B),
                borderRadius: BorderRadius.circular(radius),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.6), offset: const Offset(3, 3), blurRadius: 6),
                  BoxShadow(color: glowColor.withOpacity(0.3), offset: const Offset(-2, -2), blurRadius: 6),
                ],
              );
            }
            return BoxDecoration(
              gradient: const LinearGradient(
                colors: [Color(0xFF1E293B), Color(0xFF0F172A)],
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
              ),
              borderRadius: BorderRadius.circular(radius),
              boxShadow: [
                BoxShadow(color: Colors.black.withOpacity(0.8), offset: const Offset(8, 8), blurRadius: 16),
