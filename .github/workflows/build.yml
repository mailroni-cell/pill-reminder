                              const SizedBox(height: 14),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                children: typesList.map((type) {
                                  final bool isSel = selectedType == type;
                                  return Hardware3DButton(
                                    height: 42,
                                    radius: 10,
                                    glowColor: const Color(0xFFA855F7),
                                    isPushed: isSel,
                                    onTap: () {
                                      HapticFeedback.lightImpact();
                                      setDlg(() => selectedType = type);
                                    },
                                    child: Padding(
                                      padding: const EdgeInsets.symmetric(horizontal: 10),
                                      child: Text(
                                        type,
                                        style: TextStyle(
                                          fontWeight: FontWeight.bold,
                                          fontSize: hc ? 16 : 13,
                                          color: isSel ? (hc ? const Color(0xFFFFE500) : Colors.purpleAccent) : Colors.white70,
                                        ),
                                      ),
                                    ),
                                  );
                                }).toList(),
                              ),
                              const SizedBox(height: 14),
                              MechModuleCard(
                                child: TextField(
                                  controller: docCtrl,
                                  textAlign: (app.currentLang == 'he' || app.currentLang == 'ar') ? TextAlign.right : TextAlign.left,
                                  style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.purpleAccent, fontWeight: FontWeight.bold, fontSize: hc ? 18 : 16),
                                  decoration: InputDecoration(
                                    border: InputBorder.none,
                                    hintText: t['doctor_name']!,
                                    hintStyle: const TextStyle(color: Colors.white38),
                                  ),
                                ),
                              ),
                              MechModuleCard(
                                child: TextField(
                                  controller: clinicCtrl,
                                  textAlign: (app.currentLang == 'he' || app.currentLang == 'ar') ? TextAlign.right : TextAlign.left,
                                  style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.bold, fontSize: hc ? 18 : 16),
                                  decoration: InputDecoration(
                                    border: InputBorder.none,
                                    hintText: t['clinic_address']!,
                                    hintStyle: const TextStyle(color: Colors.white38),
                                  ),
                                ),
                              ),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Hardware3DButton(
                                    height: 44,
                                    radius: 12,
                                    glowColor: const Color(0xFF00D1FF),
                                    onTap: () => _launchMap(clinicCtrl.text, true),
                                    child: Padding(
                                      padding: const EdgeInsets.symmetric(horizontal: 14),
                                      child: Row(
                                        children: [
                                          const Icon(Icons.navigation, size: 16, color: Color(0xFF00D1FF)),
                                          const SizedBox(width: 4),
                                          Text(t['nav_waze']!, style: const TextStyle(color: Color(0xFF00D1FF), fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                    ),
                                  ),
                                  const SizedBox(width: 14),
                                  Hardware3DButton(
                                    height: 44,
                                    radius: 12,
                                    glowColor: const Color(0xFF34A853),
                                    onTap: () => _launchMap(clinicCtrl.text, false),
                                    child: Padding(
                                      padding: const EdgeInsets.symmetric(horizontal: 14),
                                      child: Row(
                                        children: [
                                          const Icon(Icons.map, size: 16, color: Color(0xFF34A853)),
                                          const SizedBox(width: 4),
                                          Text(t['nav_google']!, style: const TextStyle(color: Color(0xFF34A853), fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 20),
                              Hardware3DButton(
                                glowColor: const Color(0xFFA855F7),
                                height: 58,
                                radius: 18,
                                onTap: () {
                                  if (docCtrl.text.trim().isEmpty) return;
                                  setState(() {
                                    _apps.add(AppointmentModel(
                                      id: DateTime.now().millisecondsSinceEpoch.toString(),
                                      type: selectedType,
                                      doctor: docCtrl.text.trim(),
                                      clinic: clinicCtrl.text.trim(),
                                      date: '${selectedDate.day}/${selectedDate.month}/${selectedDate.year}',
                                      time: selectedTime.format(context),
                                    ));
                                  });
                                  _saveApps();
                                  Navigator.pop(ctx);
                                },
                                child: textEmbossed(
                                  t['save']!,
                                  fontSize: hc ? 20 : 18,
                                  color: hc ? const Color(0xFFFFE500) : const Color(0xFFA855F7),
