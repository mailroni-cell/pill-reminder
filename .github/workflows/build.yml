                  clinic: map['clinic'],
                  date: map['date'],
                  time: map['time'],
                );
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            List<ScheduleGroup> _schedules = [];
            List<AppointmentModel> _apps = [];

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _loadData();
              _initTTS();
            }

            void _initTTS() async {
              final app = CyberPillMasterApp.of(context);
              Map<String, String> langMap = {
                'he': 'he-IL',
                'en': 'en-US',
                'ru': 'ru-RU',
                'ro': 'ro-RO',
                'ar': 'ar-SA',
                'de': 'de-DE',
              };
              await flutterTts.setLanguage(langMap[app.currentLang] ?? 'he-IL');
              await flutterTts.setSpeechRate(0.45);
            }

            Future<void> _loadData() async {
              final prefs = await SharedPreferences.getInstance();
              final String? schedsRaw = prefs.getString('c_multi_scheds_store');
              if (schedsRaw != null) {
                final List decoded = jsonDecode(schedsRaw);
                setState(() => _schedules = decoded.map((e) => ScheduleGroup.fromMap(e)).toList());
              }
              final String? appsRaw = prefs.getString('c_apps_store_v2');
              if (appsRaw != null) {
                final List decodedA = jsonDecode(appsRaw);
                setState(() => _apps = decodedA.map((e) => AppointmentModel.fromMap(e)).toList());
              }
            }

            Future<void> _saveSchedules() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_multi_scheds_store', jsonEncode(_schedules.map((m) => m.toMap()).toList()));
            }

            Future<void> _saveApps() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_apps_store_v2', jsonEncode(_apps.map((a) => a.toMap()).toList()));
            }

            void _speak(String text) async {
              final app = CyberPillMasterApp.of(context);
              if (app.voiceAlerts) {
                await flutterTts.speak(text);
              }
            }

