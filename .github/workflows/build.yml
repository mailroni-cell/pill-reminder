          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            tz.initializeTimeZones();
            // Configure High Importance Notification Channel for Real-time Heads-up Alerts
            const AndroidNotificationChannel channel = AndroidNotificationChannel(
              'cyber_pharma_critical_alerts',
              'Cyber Pharma Critical Reminders',
              description: 'High priority alerts for medicine reminders',
              importance: Importance.max,
              playSound: true,
              enableVibration: true,
            );
            await flutterNotifications
                .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                ?.createNotificationChannel(channel);
            const AndroidInitializationSettings initAndroid = AndroidInitializationSettings('@drawable/ic_launcher_cyber');
            const InitializationSettings initSettings = InitializationSettings(android: initAndroid);
            await flutterNotifications.initialize(initSettings);
            runApp(const CyberPillMasterApp());
          }

          class CyberPillMasterApp extends StatefulWidget {
            const CyberPillMasterApp({super.key});

            static _CyberPillMasterAppState of(BuildContext context) =>
                context.findAncestorStateOfType<_CyberPillMasterAppState>()!;

            @override
            State<CyberPillMasterApp> createState() => _CyberPillMasterAppState();
          }

          class _CyberPillMasterAppState extends State<CyberPillMasterApp> {
            String _lang = 'he';
            String _userName = '';
            bool _voiceAlerts = true;
            bool _highContrast = false;
            String _soundType = 'voice';
            double _soundVolume = 1.0;
            String _customSoundPath = '';
            String _customSoundName = '';
            String _themeKey = 'cyberpunk';
            String _bgStyle = 'space';
            bool _firstRun = true;
            bool _initialized = false;

            String get customSoundPath => _customSoundPath;
            String get customSoundName => _customSoundName;

            String get currentLang => _lang;
            String get userName => _userName;
            bool get voiceAlerts => _voiceAlerts;
            bool get highContrast => _highContrast;
            String get soundType => _soundType;
            double get soundVolume => _soundVolume;
            String get themeKey => _themeKey;
            String get bgStyle => _bgStyle;
            bool get firstRun => _firstRun;
            ThemePalette get currentPalette => _highContrast
                ? (themePalettes['high_contrast'] ?? themePalettes.values.first)
                : (themePalettes[_themeKey] ?? themePalettes['cyber_neon'] ?? themePalettes.values.first);

            @override
            void initState() {
              super.initState();
              _loadConfig();
            }

            Future<void> _loadConfig() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _lang = prefs.getString('c_lang') ?? 'he';
                _userName = prefs.getString('c_user_name') ?? '';
                _voiceAlerts = prefs.getBool('c_voice') ?? true;
                _highContrast = prefs.getBool('c_hc') ?? false;
                _soundType = prefs.getString('c_sound') ?? 'voice';
                _soundVolume = prefs.getDouble('c_volume') ?? 1.0;
                _customSoundPath = prefs.getString('c_custom_sound_path') ?? '';
                _customSoundName = prefs.getString('c_custom_sound_name') ?? '';
                _themeKey = prefs.getString('c_theme') ?? 'cyberpunk';
                _bgStyle = prefs.getString('c_bg_style') ?? 'space';
                _firstRun = prefs.getBool('c_first_run') ?? true;
                _initialized = true;
              });
            }

            void setLanguage(String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_lang', lang);
              HapticFeedback.mediumImpact();
              setState(() {
                _lang = lang;
              });
            }

            void completeOnboarding(String name, String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_user_name', name);
              await prefs.setString('c_lang', lang);
              await prefs.setBool('c_first_run', false);
              HapticFeedback.heavyImpact();
              setState(() {
                _userName = name;
                _lang = lang;
                _firstRun = false;
              });
            }

            void setBgStyle(String style) {
              setState(() {
                _bgStyle = style;
              });
              SharedPreferences.getInstance().then((prefs) => prefs.setString('c_bg_style', style));
            }

            void setThemeKey(String key) {
              setState(() {
                _themeKey = key;
              });
              SharedPreferences.getInstance().then((prefs) => prefs.setString('c_theme', key));
            }

            Future<void> saveFullSettings({
              String? lang,
              String? theme,
              String? bgStyle,
              String? sound,
              double? volume,
              bool? hc,
              bool? voice,
              String? customSoundPath,
              String? customSoundName,
            }) async {
              if (lang != null) _lang = lang;
              if (theme != null) _themeKey = theme;
              if (bgStyle != null) _bgStyle = bgStyle;
              if (sound != null) _soundType = sound;
              if (volume != null) _soundVolume = volume;
              if (hc != null) _highContrast = hc;
              if (voice != null) _voiceAlerts = voice;
              if (customSoundPath != null) _customSoundPath = customSoundPath;
              if (customSoundName != null) _customSoundName = customSoundName;

              HapticFeedback.heavyImpact();
              setState(() {});

              final prefs = await SharedPreferences.getInstance();
              if (lang != null) await prefs.setString('c_lang', lang);
              if (theme != null) await prefs.setString('c_theme', theme);
              if (bgStyle != null) await prefs.setString('c_bg_style', bgStyle);
              if (sound != null) await prefs.setString('c_sound', sound);
              if (volume != null) await prefs.setDouble('c_volume', volume);
              if (hc != null) await prefs.setBool('c_hc', hc);
              if (voice != null) await prefs.setBool('c_voice', voice);
              if (customSoundPath != null) await prefs.setString('c_custom_sound_path', customSoundPath);
              if (customSoundName != null) await prefs.setString('c_custom_sound_name', customSoundName);
            }

            @override
            Widget build(BuildContext context) {
              if (!_initialized) return const SizedBox();

              final bool isRtl = _lang == 'he' || _lang == 'ar';
              final palette = currentPalette;
              final Color primary = _highContrast ? const Color(0xFFFFE500) : palette.primary;

              return MaterialApp(
                title: 'CYBER PHARMA 3D',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: Colors.transparent,
                  colorSchemeSeed: primary,
                  fontFamily: 'sans-serif-medium',
                  textTheme: ThemeData.dark().textTheme.apply(
                    fontFamily: 'sans-serif-medium',
                    decoration: TextDecoration.none,
                  ),
                ),
                home: Directionality(
                  textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                  child: AppSplashScreen(
                    onFinish: () => _firstRun ? const FirstTimeSetupScreen() : const MainDashboard(),
                  ),
                ),
              );
            }
          }

          Widget textChannel3D(
            String text, {
            required double fontSize,
            required Color color,
            Color? glowColor,
            TextAlign textAlign = TextAlign.start,
            FontWeight fontWeight = FontWeight.w900,
            double wordSpacing = 2.0,
          }) {
            final glow = glowColor ?? color;
            return Text(
              text,
              textAlign: textAlign,
              style: TextStyle(
                fontSize: fontSize,
                fontWeight: fontWeight,
                color: color,
                letterSpacing: 0.6,
                wordSpacing: wordSpacing,
                shadows: [
                  // Crisp high-contrast rim occlusion
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(-1.5, -1.5), blurRadius: 1.0),
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(1.5, -1.5), blurRadius: 1.0),
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(-1.5, 1.5), blurRadius: 1.0),
                  Shadow(color: Colors.black.withOpacity(0.98), offset: const Offset(1.5, 1.5), blurRadius: 1.0),
                  // Deep physical bevel cast shadows
                  Shadow(color: Colors.black.withOpacity(0.95), offset: const Offset(3.0, 4.0), blurRadius: 3.0),
                  Shadow(color: Colors.black.withOpacity(0.90), offset: const Offset(5.0, 7.0), blurRadius: 8.0),
                  // Atmospheric floating 3D neon glow
                  Shadow(color: glow.withOpacity(0.85), offset: const Offset(0.0, 0.0), blurRadius: 16.0),
                ],
              ),
            );
          }

          // 3D Fluorescent Neon Button Text (עבה, זרחני, תלת מימדי ומבריק)
          Widget neon3DButtonText(
            String text, {
            double fontSize = 13,
            Color? color,
            ThemePalette? palette,
            bool highContrast = false,
            TextAlign textAlign = TextAlign.center,
            int? maxLines,
            TextOverflow? overflow,
          }) {
            final Color baseColor = color ??
                (highContrast
                    ? const Color(0xFFFFEA00)
                    : (palette != null ? palette.highlight : const Color(0xFF00F0FF)));

            return Text(
              text,
              textAlign: textAlign,
              maxLines: maxLines,
              overflow: overflow,
              style: TextStyle(
                fontSize: fontSize,
                fontWeight: FontWeight.w900,
                letterSpacing: 0.8,
                color: baseColor,
                decoration: TextDecoration.none,
                shadows: [
                  Shadow(
                    offset: const Offset(0, -1.0),
                    blurRadius: 1.0,
                    color: Colors.white.withOpacity(0.85),
                  ),
                  Shadow(
                    offset: const Offset(0, 2.0),
                    blurRadius: 3.0,
                    color: Colors.black.withOpacity(0.95),
                  ),
                  Shadow(
                    offset: Offset.zero,
                    blurRadius: 8.0,
                    color: baseColor.withOpacity(0.65),
                  ),
                ],
              ),
            );
          }

