            Map<String, dynamic> _calculateCompliance() {
              final now = DateTime.now();
              int dailyTotal = 0, dailyTaken = 0;
              int weeklyTotal = 0, weeklyTaken = 0;
              int monthlyTotal = 0, monthlyTaken = 0;

              for (var l in _logs) {
                final diff = now.difference(l.timestamp);
                if (diff.inDays == 0 && l.timestamp.day == now.day) {
                  dailyTotal++;
                  if (l.taken) dailyTaken++;
                }
                if (diff.inDays <= 7) {
                  weeklyTotal++;
                  if (l.taken) weeklyTaken++;
                }
                if (diff.inDays <= 30) {
                  monthlyTotal++;
                  if (l.taken) monthlyTaken++;
                }
              }

              return {
                'daily': dailyTotal == 0 ? 100 : ((dailyTaken / dailyTotal) * 100).round(),
                'weekly': weeklyTotal == 0 ? 100 : ((weeklyTaken / weeklyTotal) * 100).round(),
                'monthly': monthlyTotal == 0 ? 100 : ((monthlyTaken / monthlyTotal) * 100).round(),
                'weeklyTaken': weeklyTaken,
                'weeklyTotal': weeklyTotal,
              };
            }

            Future<void> _exportAndShareReport() async {
              final comp = _calculateCompliance();
              final app = CyberPillMasterApp.of(context);
              final dateNow = DateFormat('dd/MM/yyyy HH:mm').format(DateTime.now());

              final StringBuffer sb = StringBuffer();
              sb.writeln("========================================");
              sb.writeln("CYBER PHARMA - דוח מעקב והיענות רפואית");
              sb.writeln("========================================");
              sb.writeln("מטופל: " + app.userName);
              sb.writeln("מועד הפקה: " + dateNow);
              sb.writeln("");
              sb.writeln("--- מדדי היענות שבועיים וחודשיים ---");
              sb.writeln("היענות שבועית: " + comp['weekly'].toString() + "% (" + comp['weeklyTaken'].toString() + "/" + comp['weeklyTotal'].toString() + " מנות נלקחו)");
              sb.writeln("היענות חודשית: " + comp['monthly'].toString() + "%");
              sb.writeln("היענות יומית: " + comp['daily'].toString() + "%");
              sb.writeln("");
              sb.writeln("--- יומן נטילת תרופות מפורט ---");
              for (var l in _logs.take(35)) {
                final dStr = DateFormat('dd/MM HH:mm').format(l.timestamp);
                final stStr = l.taken ? "[נלקח בהצלחה]" : "[דולג]";
                sb.writeln(dStr + " | " + l.pillName + " (" + l.dosage.toString() + " כדורים) | " + stStr);
              }
              sb.writeln("========================================");

              final dir = await getTemporaryDirectory();
              final file = File(dir.path + "/CyberPharma_Report.txt");
              await file.writeAsString(sb.toString(), encoding: utf8);

              await Share.shareXFiles(
                [XFile(file.path)],
                text: sb.toString(),
                subject: 'דוח מעקב רפואי - ' + app.userName,
              );
            }

