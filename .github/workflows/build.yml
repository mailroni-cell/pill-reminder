            void _openLiveAddressPicker(Function(String) onSelectAddress) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final palette = app.currentPalette;
              final hc = app.highContrast;
              String searchQuery = '';
              List<String> liveResults = [];
              bool isLoading = false;
              Timer? debounceTimer;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: hc ? Colors.black : palette.surface,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(28))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx2, setModalState) {
                    void doSearch(String q) {
                      debounceTimer?.cancel();
                      if (q.trim().length < 2) {
                        setModalState(() {
                          searchQuery = q;
                          liveResults = [];
                          isLoading = false;
                        });
                        return;
                      }
                      setModalState(() {
                        searchQuery = q;
                        isLoading = true;
                      });
                      debounceTimer = Timer(const Duration(milliseconds: 350), () async {
                        final res = await LiveAddressService.searchAddresses(q);
                        if (ctx.mounted) {
                          setModalState(() {
                            liveResults = res;
                            isLoading = false;
                          });
                        }
                      });
                    }

                    return Directionality(
                      textDirection: (app.currentLang == 'he' || app.currentLang == 'ar') ? TextDirection.rtl : TextDirection.ltr,
                      child: Container(
                        height: MediaQuery.of(context).size.height * 0.82,
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                        child: Column(
                          children: [
                            Container(
                              width: 44,
                              height: 5,
                              decoration: BoxDecoration(color: palette.highlight.withOpacity(0.5), borderRadius: BorderRadius.circular(10)),
                            ),
                            const SizedBox(height: 12),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.travel_explore_rounded, color: palette.highlight, size: 22),
                                const SizedBox(width: 8),
                                Text(
                                  t['online_address_picker'] ?? '🌐 איתור כתובת חי מהרשת',
                                  style: TextStyle(color: palette.highlight, fontSize: 16, fontWeight: FontWeight.w900),
                                ),
                              ],
                            ),
                            const SizedBox(height: 10),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 12),
                              decoration: BoxDecoration(
                                color: Colors.black.withOpacity(0.55),
                                borderRadius: BorderRadius.circular(14),
                                border: Border.all(color: palette.primary.withOpacity(0.8), width: 1.5),
                              ),
                              child: TextField(
                                onChanged: doSearch,
                                autofocus: true,
                                style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
                                decoration: InputDecoration(
                                  hintText: t['search_address_online_hint'] ?? 'הקלד רחוב, מרפאה, בית חולים או עיר (נשאב מהרשת)...',
                                  hintStyle: const TextStyle(color: Colors.white38, fontSize: 12),
                                  border: InputBorder.none,
                                  prefixIcon: Icon(Icons.search_rounded, color: palette.highlight),
                                  suffixIcon: isLoading
                                      ? SizedBox(
                                          width: 20,
                                          height: 20,
                                          child: Center(
                                            child: SizedBox(
                                              width: 16,
                                              height: 16,
                                              child: CircularProgressIndicator(strokeWidth: 2.0, color: palette.highlight),
                                            ),
                                          ),
                                        )
                                      : null,
                                ),
                              ),
                            ),
                            const SizedBox(height: 10),
                            if (isLoading)
                              Padding(
                                padding: const EdgeInsets.symmetric(vertical: 8),
                                child: Text(
                                  t['fetching_from_web'] ?? 'שואב כתובות מהרשת בזמן אמת...',
                                  style: TextStyle(color: palette.highlight, fontSize: 12, fontWeight: FontWeight.bold),
                                ),
                              ),
                            Expanded(
                              child: liveResults.isEmpty && !isLoading && searchQuery.trim().length >= 2
                                  ? Center(
                                      child: Text(
                                        t['no_address_found'] ?? 'לא נמצאו כתובות ברשת. נסה ניסוח אחר.',
                                        style: const TextStyle(color: Colors.white54, fontSize: 13),
                                      ),
                                    )
                                  : ListView.builder(
                                      physics: const BouncingScrollPhysics(),
                                      itemCount: liveResults.length,
                                      itemBuilder: (ctxL, idx) {
                                        final addr = liveResults[idx];
                                        return Container(
                                          margin: const EdgeInsets.symmetric(vertical: 4),
                                          decoration: BoxDecoration(
                                            color: Colors.black.withOpacity(0.35),
                                            borderRadius: BorderRadius.circular(12),
                                            border: Border.all(color: palette.highlight.withOpacity(0.3), width: 1),
                                          ),
                                          child: ListTile(
                                            leading: Container(
                                              padding: const EdgeInsets.all(6),
                                              decoration: BoxDecoration(
                                                color: palette.primary.withOpacity(0.2),
                                                shape: BoxShape.circle,
                                              ),
                                              child: Icon(Icons.location_on_rounded, color: palette.highlight, size: 20),
                                            ),
                                            title: Text(
                                              addr,
                                              style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                                            ),
                                            trailing: Container(
                                              padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                              decoration: BoxDecoration(
                                                color: Colors.black.withOpacity(0.6),
                                                borderRadius: BorderRadius.circular(6),
                                                border: Border.all(color: palette.highlight.withOpacity(0.5), width: 1),
                                              ),
                                              child: Text(
                                                t['online_badge'] ?? '🌐 רשת',
                                                style: TextStyle(color: palette.highlight, fontSize: 10, fontWeight: FontWeight.bold),
                                              ),
                                            ),
                                            onTap: () {
                                              HapticFeedback.lightImpact();
                                              onSelectAddress(addr);
                                              Navigator.pop(ctx);
                                            },
                                          ),
                                        );
                                      },
                                    ),
                            ),
                          ],
                        ),
                      ),
                    );
                  },
                ),
              );
            }

