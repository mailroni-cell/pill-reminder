name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Skeleton
        run: |
          flutter create --org com.example --project-name pill_reminder . --platforms=android --overwrite

      - name: Configure Android Permissions and Desugaring
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          
          python3 -c "
          import os
          fpath = 'android/app/build.gradle.kts'
          if os.path.exists(fpath):
              with open(fpath, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              txt += '\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              with open(fpath, 'w') as f:
                  f.write(txt)
          else:
              fpath_g = 'android/app/build.gradle'
              with open(fpath_g, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              txt += '\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
              with open(fpath_g, 'w') as f:
                  f.write(txt)
          "

      - name: Create pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: Futuristic 3D Pill Reminder & Health Assistant
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
          flutter:
            uses-material-design: true
          EOF

