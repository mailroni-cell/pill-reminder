                            _activeTabIndex == 0 ? Icons.add_alarm_rounded : Icons.event_available_rounded,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                            size: 26,
                          ),
                          const SizedBox(width: 10),
                          textChannel3D(
                            _activeTabIndex == 0
                                ? (t['save_schedule_action'] ?? 'צור תזמון')
                                : (t['book_appointment_action'] ?? 'קבע תור'),
                            fontSize: hc ? 19 : 17,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                            wordSpacing: 3.0,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

          }

          EOF

      - name: Install dependencies
        run: |
          flutter pub get
          python3 -c '
          import os, re
          dirs_to_check = [
              os.environ.get("PUB_CACHE", ""),
              os.path.expanduser("~/.pub-cache"),
              "/home/runner/.pub-cache"
          ]
          checked = set()
          for d in dirs_to_check:
              if d and os.path.exists(d) and d not in checked:
                  checked.add(d)
                  for root, _, files in os.walk(d):
                      for f in files:
                          if f in ("build.gradle", "build.gradle.kts"):
                              p = os.path.join(root, f)
                              try:
                                  with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                                      c = fp.read()
                                  nc = re.sub(r"compileSdkVersion\s+[0-9]+", "compileSdkVersion 36", c)
                                  nc = re.sub(r"compileSdk\s*=\s*[0-9]+", "compileSdk = 36", nc)
                                  nc = re.sub(r"compileSdk\s+[0-9]+", "compileSdk 36", nc)
                                  nc = re.sub(r"targetSdkVersion\s+[0-9]+", "targetSdkVersion 36", nc)
                                  nc = re.sub(r"targetSdk\s*=\s*[0-9]+", "targetSdk = 36", nc)
                                  if nc != c:
                                      with open(p, "w", encoding="utf-8") as fp:
                                          fp.write(nc)
                                      print(f"Patched {f} in {os.path.basename(root)} to compileSdk 36")
                              except Exception:
                                  pass
          '

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
