name: Build Pill Reminder APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Base Flutter Project
        run: |
          flutter create --org com.pillreminder.app --project-name pill_reminder .

      - name: Configure pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: A comprehensive Pill Reminder Flutter application.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            flutter_local_notifications: ^17.2.2
            timezone: ^0.9.4
            flutter_tts: ^4.0.2
            shared_preferences: ^2.2.3
            intl: ^0.19.0
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Enable Core Library Desugaring in Android
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle
          fi

      - name: Setup Native Synthesizer in MainActivity.kt
        run: |
          KOTLIN_DIR="android/app/src/main/kotlin/com/pillreminder/app"
          mkdir -p $KOTLIN_DIR
          cat << 'EOF' > $KOTLIN_DIR/MainActivity.kt
          package com.pillreminder.app

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.pillreminder.app/sound"

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "playBeep") {
                          val freq = call.argument<Double>("frequency") ?: 800.0
                          val dur = call.argument<Int>("durationMs") ?: 250
                          thread { playTone(freq, dur) }
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun playTone(freqOfTone: Double, durationMs: Int) {
                  val sampleRate = 44100
                  val numSamples = (durationMs * sampleRate) / 1000
                  val generatedSnd = ByteArray(2 * numSamples)

                  for (i in 0 until numSamples) {
                      val angle = 2.0 * Math.PI * i / (sampleRate / freqOfTone)
                      val sample = (sin(angle) * 32767).toInt().toShort()
                      generatedSnd[2 * i] = (sample.toInt() and 0x00ff).toByte()
                      generatedSnd[2 * i + 1] = ((sample.toInt() and 0xff00) ushr 8).toByte()
                  }

                  val track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(sampleRate)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(generatedSnd.size)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()

                  track.write(generatedSnd, 0, generatedSnd.size)
                  track.play()
                  Thread.sleep(durationMs.toLong())
                  track.release()
              }
          }
          EOF

      - name: Create lib/main.dart
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/cupertino.dart' hide TextDirection;
          import 'package:flutter/services.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';

          final FlutterLocalNotificationsPlugin notificationsPlugin = FlutterLocalNotificationsPlugin();
          final FlutterTts flutterTts = FlutterTts();
          const MethodChannel soundChannel = MethodChannel('com.pillreminder.app/sound');

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            tz.initializeTimeZones();
            
            const AndroidInitializationSettings initAndroid = AndroidInitializationSettings('@mipmap/ic_launcher');
            const InitializationSettings initSettings = InitializationSettings(android: initAndroid);
            await notificationsPlugin.initialize(initSettings);

            await flutterTts.setLanguage("he-IL");
            await flutterTts.setPitch(1.0);
            await flutterTts.setSpeechRate(0.85);

            runApp(const PillReminderApp());
          }

          class PillReminderApp extends StatefulWidget {
            const PillReminderApp({super.key});

            @override
            State<PillReminderApp> createState() => _PillReminderAppState();
          }

          class _PillReminderAppState extends State<PillReminderApp> {
            bool isDark3D = true;

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: MaterialApp(
                  title: 'Pill Reminder',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    brightness: isDark3D ? Brightness.dark : Brightness.light,
                    scaffoldBackgroundColor: isDark3D ? const Color(0xFF12141D) : const Color(0xFFF3F5FA),
                    colorScheme: ColorScheme.fromSeed(
                      seedColor: const Color(0xFF00E5FF),
                      brightness: isDark3D ? Brightness.dark : Brightness.light,
                    ),
                    fontFamily: 'sans-serif',
                  ),
                  home: MainScreen(
                    isDark: isDark3D,
                    onToggleTheme: () => setState(() => isDark3D = !isDark3D),
                  ),
                ),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            final bool isDark;
            final VoidCallback onToggleTheme;
            const MainScreen({super.key, required this.isDark, required this.onToggleTheme});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int _currentIndex = 0;

            final List<Widget> _pages = const [
              MedicationsPage(),
              AppointmentsPage(),
              StockPage(),
              AdherencePage(),
              EmergencyCardPage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  appBar: AppBar(
                    title: const Text('תזכורת תרופות 3D', style: TextStyle(fontWeight: FontWeight.bold)),
                    centerTitle: true,
                    actions: [
                      IconButton(
                        icon: Icon(widget.isDark ? Icons.light_mode : Icons.dark_mode),
                        onPressed: widget.onToggleTheme,
                      )
                    ],
                  ),
                  body: _pages[_currentIndex],
                  bottomNavigationBar: BottomNavigationBar(
                    currentIndex: _currentIndex,
                    onTap: (index) => setState(() => _currentIndex = index),
                    type: BottomNavigationBarType.fixed,
                    selectedItemColor: const Color(0xFF00E5FF),
                    items: const [
                      BottomNavigationBarItem(icon: Icon(Icons.medication), label: 'תרופות'),
                      BottomNavigationBarItem(icon: Icon(Icons.calendar_today), label: 'תורים'),
                      BottomNavigationBarItem(icon: Icon(Icons.inventory_2), label: 'מלאי'),
                      BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'דוחות'),
                      BottomNavigationBarItem(icon: Icon(Icons.emergency), label: 'חירום'),
                    ],
                  ),
                ),
              );
            }
          }

          class MedicationsPage extends StatefulWidget {
            const MedicationsPage({super.key});

            @override
            State<MedicationsPage> createState() => _MedicationsPageState();
          }

          class _MedicationsPageState extends State<MedicationsPage> {
            List<Map<String, dynamic>> meds = [];

            @override
            void initState() {
              super.initState();
              _loadMeds();
            }

            void _loadMeds() async {
              final prefs = await SharedPreferences.getInstance();
              final data = prefs.getString('meds_list');
              if (data != null) {
                setState(() => meds = List<Map<String, dynamic>>.from(json.decode(data)));
              }
            }

            void _saveMeds() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('meds_list', json.encode(meds));
            }

            void _addMedication(String name, String dose, String time) {
              setState(() {
                meds.add({'name': name, 'dose': dose, 'time': time, 'taken': false});
              });
              _saveMeds();
              _playSound();
            }

            void _playSound() async {
              try {
                await soundChannel.invokeMethod('playBeep', {'frequency': 880.0, 'durationMs': 200});
              } catch (_) {}
            }

            void _speak(String text) async {
              await flutterTts.speak('זמן לקחת $text');
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    children: [
                      ElevatedButton.icon(
                        icon: const Icon(Icons.add),
                        label: const Text('הוסף תרופה חדשה'),
                        onPressed: () {
                          showDialog(
                            context: context,
                            builder: (ctx) {
                              final nameCtrl = TextEditingController();
                              final doseCtrl = TextEditingController();
                              return AlertDialog(
                                title: const Text('תרופה חדשה', textDirection: TextDirection.rtl),
                                content: Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'שם התרופה')),
                                    TextField(controller: doseCtrl, decoration: const InputDecoration(labelText: 'מינון')),
                                  ],
                                ),
                                actions: [
                                  TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('ביטול')),
                                  ElevatedButton(
                                    onPressed: () {
                                      if (nameCtrl.text.isNotEmpty) {
                                        _addMedication(nameCtrl.text, doseCtrl.text, '08:00');
                                        Navigator.pop(ctx);
                                      }
                                    },
                                    child: const Text('שמור'),
                                  )
                                ],
                              );
                            },
                          );
                        },
                      ),
                      const SizedBox(height: 16),
                      Expanded(
                        child: meds.isEmpty
                            ? const Center(child: Text('אין תרופות מוגדרות'))
                            : ListView.builder(
                                itemCount: meds.length,
                                itemBuilder: (ctx, i) {
                                  final m = meds[i];
                                  return Card(
                                    margin: const EdgeInsets.symmetric(vertical: 8),
                                    elevation: 4,
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                                    child: ListTile(
                                      leading: IconButton(
                                        icon: const Icon(Icons.volume_up, color: Color(0xFF00E5FF)),
                                        onPressed: () => _speak(m['name']),
                                      ),
                                      title: Text(m['name'], style: const TextStyle(fontWeight: FontWeight.bold)),
                                      subtitle: Text('מינון: ${m['dose']} | שעה: ${m['time']}'),
                                      trailing: Checkbox(
                                        value: m['taken'] ?? false,
                                        onChanged: (val) {
                                          setState(() => m['taken'] = val);
                                          _saveMeds();
                                        },
                                      ),
                                    ),
                                  );
                                },
                              ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class AppointmentsPage extends StatelessWidget {
            const AppointmentsPage({super.key});
            @override
            Widget build(BuildContext context) {
              return const Center(child: Text('ניהול תורים לרופאים', style: TextStyle(fontSize: 18)));
            }
          }

          class StockPage extends StatelessWidget {
            const StockPage({super.key});
            @override
            Widget build(BuildContext context) {
              return const Center(child: Text('מעקב מלאי תרופות', style: TextStyle(fontSize: 18)));
            }
          }

          class AdherencePage extends StatelessWidget {
            const AdherencePage({super.key});
            @override
            Widget build(BuildContext context) {
              return const Center(child: Text('דוחות היענות וסטטיסטיקה', style: TextStyle(fontSize: 18)));
            }
          }

          class EmergencyCardPage extends StatelessWidget {
            const EmergencyCardPage({super.key});
            @override
            Widget build(BuildContext context) {
              return const Center(child: Text('כרטיס חירום רפואי', style: TextStyle(fontSize: 18)));
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pill-reminder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
