            void _loadData() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final schedStr = prefs.getString('c_schedules');
                final appStr = prefs.getString('c_apps');

                if (mounted) {
                  setState(() {
                    if (schedStr != null && schedStr.isNotEmpty) {
                      try {
                        _schedules = (jsonDecode(schedStr) as List).map((i) => ScheduleGroup.fromJson(i)).toList();
                      } catch (_) {}
                    }
                    if (appStr != null && appStr.isNotEmpty) {
                      try {
                        _apps = (jsonDecode(appStr) as List).map((i) => AppointmentModel.fromJson(i)).toList();
                      } catch (_) {}
                    }
                  });
                }
              } catch (e) {
                debugPrint('Data load error: $e');
              }
            }

            void _saveSchedules() async {
              final prefs = await SharedPreferences.getInstance();
              prefs.setString('c_schedules', jsonEncode(_schedules.map((s) => s.toJson()).toList()));

              // Register exact persistent OS notifications
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              for (var sched in _schedules) {
                if (!sched.isTaken) {
                  final String dLabel = t['dosage_label'] ?? 'מינון';
                  String pillNames = sched.pills.map((p) => '${p.name} ($dLabel: ${p.dosage})').join(', ');
                  String ttsTemplate = t['tts_alert'] ?? 'תזכורת. הגיע הזמן לקחת את התרופה: {pills}';
                  NotificationService.scheduleMedicationReminder(
                    id: sched.id,
                    title: t['app_name'] ?? 'CYBER PHARMA 3D',
                    body: ttsTemplate.replaceAll('{pills}', pillNames),
                    hour: sched.hour,
                    minute: sched.minute,
                  );
                }
              }
            }

            void _saveApps() async {
              final prefs = await SharedPreferences.getInstance();
              prefs.setString('c_apps', jsonEncode(_apps.map((a) => a.toJson()).toList()));

              // Register exact persistent OS notifications for doctor visits
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              for (var a in _apps) {
                try {
                  final partsDate = a.date.split('/');
                  final partsTime = a.time.split(':');
                  if (partsDate.length == 3 && partsTime.length == 2) {
                    final appDt = DateTime(
                      int.parse(partsDate[2]),
                      int.parse(partsDate[1]),
                      int.parse(partsDate[0]),
                      int.parse(partsTime[0]),
                      int.parse(partsTime[1]),
                    );
                    NotificationService.scheduleAppointmentReminder(
                      id: a.id,
                      title: t['app_alert_title'] ?? '🩺 תזכורת תור לרופא!',
                      body: '${a.type}: ${a.doctor} (${a.clinic})',
                      appointmentDateTime: appDt,
                      minutesBefore: a.reminderMinutesBefore,
                    );
                  }
                } catch (_) {}
              }
            }

            void _launchMap(String address, bool isWaze) async {
              String target = address.trim();
              if (target.isEmpty) return;
              final encoded = Uri.encodeComponent(target);

              final Uri nativeUri = isWaze
                  ? Uri.parse('waze://?q=$encoded&navigate=yes')
                  : Uri.parse('geo:0,0?q=$encoded');

              final Uri webUri = isWaze
                  ? Uri.parse('https://waze.com/ul?q=$encoded&navigate=yes')
                  : Uri.parse('https://www.google.com/maps/search/?api=1&query=$encoded');

              try {
                if (await canLaunchUrl(nativeUri)) {
                  await launchUrl(nativeUri, mode: LaunchMode.externalApplication);
                  return;
                }
              } catch (_) {}

              try {
                if (!await launchUrl(webUri, mode: LaunchMode.externalApplication)) {
                  await launchUrl(webUri, mode: LaunchMode.platformDefault);
                }
              } catch (e) {
                debugPrint('Could not launch map: $e');
              }
            }

