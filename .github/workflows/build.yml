                      ],
                    ),
                  ),
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: GestureDetector(
                    onTap: () {
                      if (_tabController.index == 0) {
                        _openAddScheduleDialog();
                      } else {
                        _openAddAppointmentDialog();
                      }
                    },
                    child: Container(
                      padding: const EdgeInsets.symmetric(horizontal: 26, vertical: 15),
                      decoration: cyber3D(context: context, radius: 26, highContrast: hc, isMetallic: true),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.add, color: hc ? const Color(0xFFFFE500) : Colors.white),
                          const SizedBox(width: 8),
                          Text(
                            _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                            style: TextStyle(
                              fontWeight: FontWeight.w900,
                              fontSize: hc ? 18 : 16,
                              color: hc ? const Color(0xFFFFE500) : Colors.white,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
