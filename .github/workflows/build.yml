          class PillItem {
            String name;
            int dosage;
            int stock;
            PillItem({required this.name, required this.dosage, required this.stock});

            Map<String, dynamic> toMap() => {'name': name, 'dosage': dosage, 'stock': stock};
            factory PillItem.fromMap(Map<String, dynamic> map) => PillItem(
                  name: map['name'],
                  dosage: map['dosage'] ?? 1,
                  stock: map['stock'] ?? 30,
                );
          }

          class ScheduleGroup {
            String id;
            String title;
            int hour;
            int minute;
            List<PillItem> pills;
            bool isTaken;

            ScheduleGroup({
              required this.id,
              required this.title,
              required this.hour,
              required this.minute,
              required this.pills,
              this.isTaken = false,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'title': title,
                  'hour': hour,
                  'minute': minute,
                  'pills': pills.map((p) => p.toMap()).toList(),
                  'isTaken': isTaken,
                };

            factory ScheduleGroup.fromMap(Map<String, dynamic> map) => ScheduleGroup(
                  id: map['id'],
                  title: map['title'] ?? '',
                  hour: map['hour'],
                  minute: map['minute'],
                  pills: (map['pills'] as List).map((p) => PillItem.fromMap(p)).toList(),
                  isTaken: map['isTaken'] ?? false,
                );
          }

          class AppointmentModel {
            String id;
            String type;
            String doctor;
            String clinic;
            String date;
            String time;

            AppointmentModel({
              required this.id,
              required this.type,
              required this.doctor,
              required this.clinic,
              required this.date,
              required this.time,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'type': type,
                  'doctor': doctor,
                  'clinic': clinic,
                  'date': date,
                  'time': time,
                };

            factory AppointmentModel.fromMap(Map<String, dynamic> map) => AppointmentModel(
                  id: map['id'],
                  type: map['type'] ?? 'רופא',
                  doctor: map['doctor'],
                  clinic: map['clinic'],
                  date: map['date'],
                  time: map['time'],
                );
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            List<ScheduleGroup> _schedules = [];
            List<AppointmentModel> _apps = [];
            Timer? _alarmCheckTimer;

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _loadData();
              _initTTS();
              _startLiveReminderMonitor();
            }

            @override
            void dispose() {
              _alarmCheckTimer?.cancel();
              _tabController.dispose();
              super.dispose();
            }

            void _initTTS() async {
              final app = CyberPillMasterApp.of(context);
              Map<String, String> langMap = {
                'he': 'he-IL', 'en': 'en-US', 'ru': 'ru-RU',
                'ro': 'ro-RO', 'ar': 'ar-SA', 'de': 'de-DE'
              };
              await flutterTts.setLanguage(langMap[app.currentLang] ?? 'he-IL');
              await flutterTts.setSpeechRate(0.48);
              await flutterTts.setVolume(app.soundVolume);
            }

            void _startLiveReminderMonitor() {
              _alarmCheckTimer = Timer.periodic(const Duration(seconds: 30), (timer) {
                final now = DateTime.now();
                for (var sched in _schedules) {
                  if (!sched.isTaken && sched.hour == now.hour && sched.minute == now.minute) {
                    _triggerHeadsUpAlert(sched);
                    break;
                  }
                }
              });
            }

            void _previewScheduleAudio(ScheduleGroup sched) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              String pillNames = sched.pills.map((p) => '${p.name} במינון ${p.dosage}').join(', ');
              String ttsTemplate = t['tts_alert'] ?? 'תזכורת. הגיע הזמן לקחת את התרופה: {pills}';
              String speechText = ttsTemplate.replaceAll('{pills}', pillNames);

              SoundGenerator.playAlertTone(
                app.soundType,
                app.soundVolume,
                voiceText: speechText,
                lang: app.currentLang,
              );
            }

            void _triggerHeadsUpAlert(ScheduleGroup sched) async {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;

              String pillNames = sched.pills.map((p) => '${p.name} במינון ${p.dosage}').join(', ');
              String ttsTemplate = t['tts_alert'] ?? 'תזכורת. הגיע הזמן לקחת את התרופה: {pills}';
              String speechText = ttsTemplate.replaceAll('{pills}', pillNames);

              SoundGenerator.playAlertTone(
                app.soundType,
                app.soundVolume,
                voiceText: speechText,
                lang: app.currentLang,
              );

              const AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                'cyber_pharma_urgent',
                'Urgent Medicine Reminders',
                channelDescription: 'High priority heads up alarm for pills',
                importance: Importance.max,
                priority: Priority.high,
                fullScreenIntent: true,
                visibility: NotificationVisibility.public,
                category: AndroidNotificationCategory.alarm,
              );

              const NotificationDetails notifDetails = NotificationDetails(android: androidDetails);
              await flutterNotifications.show(
                sched.id.hashCode,
                t['alert_popup_title']!,
                '${sched.title}: ${sched.pills.map((p) => p.name).join(', ')}',
                notifDetails,
              );

              if (mounted) {
                _show3DHeadsUpDialog(sched);
              }
            }

            void _show3DHeadsUpDialog(ScheduleGroup sched) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;
              final palette = app.currentPalette;

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  backgroundColor: hc ? Colors.black : palette.surface,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(26),
                    side: BorderSide(color: hc ? const Color(0xFFFFE500) : palette.primary, width: 3.5),
                  ),
                  title: Row(
                    children: [
                      Icon(Icons.warning_amber_rounded, color: palette.primary, size: 34),
                      const SizedBox(width: 8),
                      Expanded(
                        child: textChannel3D(
                          t['alert_popup_title']!,
                          fontSize: hc ? 20 : 17,
                          color: hc ? const Color(0xFFFFE500) : Colors.white,
                        ),
                      ),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      textChannel3D(sched.title, fontSize: 18, color: palette.highlight),
                      const SizedBox(height: 12),
                      ...sched.pills.map((p) => Text('💊 ${p.name} (מינון: ${p.dosage})', style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.w900))),
                    ],
                  ),
                  actionsAlignment: MainAxisAlignment.spaceEvenly,
                  actions: [
                    Pneumatic3DButton(
                      height: 48,
                      palette: palette,
                      onTap: () {
                        setState(() => sched.isTaken = true);
                        _saveSchedules();
                        Navigator.pop(ctx);
                      },
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 10.0),
                        child: textChannel3D(t['btn_taken']!, fontSize: 14, color: palette.highlight),
                      ),
                    ),
                    Pneumatic3DButton(
                      height: 48,
                      palette: palette,
                      customGlow: const Color(0xFFFFB703),
                      onTap: () {
                        setState(() {
                          sched.minute = (sched.minute + 10) % 60;
                          if (sched.minute < 10) sched.hour = (sched.hour + 1) % 24;
