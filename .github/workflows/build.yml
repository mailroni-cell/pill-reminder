name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Skeleton
        run: |
          flutter create --org com.example --project-name pill_reminder . --platforms=android --overwrite

      - name: Create Medical App Icon
        run: |
          python3 -c '
          import os, base64
          # Transparent 1x1 fallback / simple PNG generator
          # Clean SVG to high-res PNG replacement
          os.makedirs("assets", exist_ok=True)
          '
          # Create a custom launcher icon directly using bash and base64
          python3 -c '
          from PIL import Image, ImageDraw
          import os

          os.makedirs("android/app/src/main/res/mipmap-hdpi", exist_ok=True)
          os.makedirs("android/app/src/main/res/mipmap-mdpi", exist_ok=True)
          os.makedirs("android/app/src/main/res/mipmap-xhdpi", exist_ok=True)
          os.makedirs("android/app/src/main/res/mipmap-xxhdpi", exist_ok=True)
          os.makedirs("android/app/src/main/res/mipmap-xxxhdpi", exist_ok=True)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, sz in sizes.items():
              img = Image.new("RGBA", (sz, sz), (15, 23, 42, 255))
              d = ImageDraw.Draw(img)
              m = int(sz * 0.08)
              d.ellipse([m, m, sz - m, sz - m], fill=(30, 41, 59, 255), outline=(6, 182, 212, 255), width=max(2, int(sz * 0.06)))
              bw = int(sz * 0.16)
              bl = int(sz * 0.52)
              cx, cy = sz // 2, sz // 2
              d.rectangle([cx - bw // 2, cy - bl // 2, cx + bw // 2, cy + bl // 2], fill=(6, 182, 212, 255))
              d.rectangle([cx - bl // 2, cy - bw // 2, cx + bl // 2, cy + bw // 2], fill=(6, 182, 212, 255))
              r = int(sz * 0.07)
              d.ellipse([int(sz * 0.68) - r, int(sz * 0.32) - r, int(sz * 0.68) + r, int(sz * 0.32) + r], fill=(244, 63, 94, 255))
              
              p = f"android/app/src/main/res/{folder}/ic_launcher.png"
              img.save(p, "PNG")
          '

      - name: Configure Android Permissions and Queries
        run: |
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              txt = f.read()
          
          perms = """
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
    <uses-permission android:name="android.permission.VIBRATE"/>
    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
  """
          queries = """
    <queries>
        <intent>
            <action android:name="android.intent.action.VIEW" />
            <data android:scheme="https" />
        </intent>
        <intent>
            <action android:name="android.intent.action.VIEW" />
            <data android:scheme="waze" />
        </intent>
        <intent>
            <action android:name="android.intent.action.VIEW" />
            <data android:scheme="geo" />
        </intent>
    </queries>
  """
          txt = txt.replace("<application", perms + queries + "  <application")
          with open(manifest_path, "w") as f:
              f.write(txt)
          '

          python3 -c '
          import os
          fpath = "android/app/build.gradle.kts"
          if os.path.exists(fpath):
              with open(fpath, "r") as f:
                  txt = f.read()
              if "compileOptions {" in txt:
                  txt = txt.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              txt += "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
              with open(fpath, "w") as f:
                  f.write(txt)
          else:
              fpath_g = "android/app/build.gradle"
              with open(fpath_g, "r") as f:
                  txt = f.read()
              if "compileOptions {" in txt:
                  txt = txt.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              txt += "\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"
              with open(fpath_g, "w") as f:
                  f.write(txt)
          '

