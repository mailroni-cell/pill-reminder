            void _openAddAppointmentDialog() {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;

              String selectedType = t['doc_doctor']!;
              final docCtrl = TextEditingController();
              final clinicCtrl = TextEditingController();
              String timeStr = '10:00';
              String dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: hc ? Colors.black : const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(30))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx2, setDlg) => Directionality(
                    textDirection: TextDirection.rtl,
                    child: Padding(
                      padding: EdgeInsets.only(
                        top: 20,
                        left: 20,
                        right: 20,
                        bottom: MediaQuery.of(context).viewInsets.bottom + 25,
                      ),
                      child: SafeArea(
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(
                                t['add_appointment']!,
                                style: TextStyle(
                                  fontSize: 20,
                                  fontWeight: FontWeight.bold,
                                  color: hc ? const Color(0xFFFFD700) : const Color(0xFFA855F7),
                                ),
                              ),
                              const SizedBox(height: 16),
                              DropdownButton<String>(
                                value: selectedType,
                                dropdownColor: const Color(0xFF1E293B),
                                style: const TextStyle(color: Colors.white),
                                isExpanded: true,
                                items: [t['doc_doctor']!, t['doc_nurse']!, t['doc_test']!, t['doc_treatment']!]
                                    .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                                    .toList(),
                                onChanged: (v) {
                                  if (v != null) setDlg(() => selectedType = v);
                                },
                              ),
                              TextField(
                                controller: docCtrl,
                                style: const TextStyle(color: Colors.white),
                                decoration: InputDecoration(
                                  labelText: t['doctor_name'],
                                  labelStyle: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.cyanAccent),
                                ),
                              ),
                              TextField(
                                controller: clinicCtrl,
                                style: const TextStyle(color: Colors.white),
                                decoration: InputDecoration(
                                  labelText: t['clinic_address'],
                                  labelStyle: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.cyanAccent),
                                ),
                              ),
                              const SizedBox(height: 20),
                              GestureDetector(
                                onTap: () {
                                  if (docCtrl.text.trim().isEmpty) return;
                                  setState(() {
                                    _apps.add(AppointmentModel(
                                      id: DateTime.now().millisecondsSinceEpoch.toString(),
                                      type: selectedType,
                                      doctor: docCtrl.text.trim(),
                                      clinic: clinicCtrl.text.trim(),
                                      date: dateStr,
                                      time: timeStr,
                                    ));
                                  });
                                  _saveApps();
                                  Navigator.pop(ctx);
                                },
                                child: Container(
                                  height: 48,
                                  decoration: cyber3D(context: context, radius: 14, highContrast: hc, customGlow: const Color(0xFF10B981)),
                                  child: Center(
                                    child: Text(t['save']!, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF10B981))),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            void _openSettingsDialog() {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;

              final soundOptions = [
                {'key': 'electric', 'label': 'סייבר אלקטרוני'},
                {'key': 'gong', 'label': 'גונג הרמוני'},
                {'key': 'alarm', 'label': 'אזעקה מודגשת'},
                {'key': 'bell', 'label': 'פעמון דיגיטלי'},
              ];

              String selectedMedSound = app.soundMed;
              String selectedDocSound = app.soundDoc;
              double currentVol = app.soundVolume;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: hc ? Colors.black : const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(30))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx2, setDlg) => Directionality(
                    textDirection: TextDirection.rtl,
                    child: SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(
                                t['settings']!,
                                style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: hc ? const Color(0xFFFFD700) : const Color(0xFF06B6D4)),
                              ),
                              const SizedBox(height: 16),
                              SwitchListTile(
                                title: Text(t['high_contrast']!, style: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.white)),
                                value: app.highContrast,
                                onChanged: (v) => setDlg(() => app.updateSettings(hc: v)),
                              ),
                              const SizedBox(height: 12),
                              Text(t['alert_sound_med']!, style: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.cyanAccent, fontWeight: FontWeight.bold)),
                              DropdownButton<String>(
                                value: selectedMedSound,
                                dropdownColor: const Color(0xFF1E293B),
                                style: const TextStyle(color: Colors.white),
                                items: soundOptions.map((opt) => DropdownMenuItem(value: opt['key']!, child: Text(opt['label']!))).toList(),
                                onChanged: (v) {
                                  if (v != null) {
                                    setDlg(() => selectedMedSound = v);
                                    app.playAudioTone(v, currentVol);
                                  }
                                },
                              ),
                              const SizedBox(height: 12),
                              Text(t['alert_sound_doc']!, style: TextStyle(color: hc ? const Color(0xFFFFD700) : const Color(0xFFA855F7), fontWeight: FontWeight.bold)),
                              DropdownButton<String>(
                                value: selectedDocSound,
                                dropdownColor: const Color(0xFF1E293B),
                                style: const TextStyle(color: Colors.white),
                                items: soundOptions.map((opt) => DropdownMenuItem(value: opt['key']!, child: Text(opt['label']!))).toList(),
                                onChanged: (v) {
                                  if (v != null) {
                                    setDlg(() => selectedDocSound = v);
                                    app.playAudioTone(v, currentVol);
                                  }
                                },
                              ),
                              const SizedBox(height: 20),
                              GestureDetector(
                                onTap: () {
                                  app.updateSettings(soundMed: selectedMedSound, soundDoc: selectedDocSound, volume: currentVol);
                                  Navigator.pop(ctx);
                                },
                                child: Container(
                                  height: 46,
                                  decoration: cyber3D(context: context, radius: 14, highContrast: hc, customGlow: const Color(0xFF10B981)),
                                  child: Center(
                                    child: Text(t['confirm_sound']!, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF10B981))),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;
              final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
              final Color accent = hc ? const Color(0xFFFFD700) : palette['accent']!;
              final comp = _calculateCompliance();

              return Dynamic3DCyberBackground(
                accentColor: accent,
                isHighContrast: hc,
                child: Scaffold(
                  backgroundColor: Colors.transparent,
                  appBar: AppBar(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    centerTitle: true,
                    title: Text(
                      t['app_name']!,
                      style: TextStyle(fontWeight: FontWeight.w900, fontSize: 22, color: accent),
                    ),
                    leading: IconButton(
                      icon: Icon(Icons.health_and_safety, color: hc ? const Color(0xFFFFD700) : Colors.redAccent),
                      onPressed: _openEmergencyCardDialog,
                    ),
                    actions: [
                      IconButton(
                        icon: Icon(Icons.settings, color: hc ? const Color(0xFFFFD700) : null),
                        onPressed: _openSettingsDialog,
                      ),
                    ],
                    bottom: TabBar(
                      controller: _tabController,
                      indicatorColor: accent,
                      labelColor: accent,
                      unselectedLabelColor: Colors.white38,
                      tabs: [
                        Tab(icon: const Icon(Icons.medication), text: t['meds_tab']!),
                        Tab(icon: const Icon(Icons.event_note), text: t['appointments_tab']!),
                        Tab(icon: const Icon(Icons.analytics_outlined), text: t['stats_tab']!),
                      ],
                    ),
                  ),
                  body: SafeArea(
                    child: TabBarView(
                      controller: _tabController,
                      children: [
                        _schedules.isEmpty
                            ? Center(child: Text(t['empty_meds']!, style: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.white38, fontSize: 18)))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 90),
                                itemCount: _schedules.length,
                                itemBuilder: (ctx, i) {
                                  final sched = _schedules[i];
                                  final timeStr = sched.hour.toString().padLeft(2, '0') + ':' + sched.minute.toString().padLeft(2, '0');
                                  return Container(
                                    margin: const EdgeInsets.only(bottom: 14),
                                    decoration: cyber3D(context: context, radius: 20, isPressed: sched.isTaken, highContrast: hc),
                                    child: ListTile(
                                      leading: Icon(sched.isTaken ? Icons.check_circle : Icons.alarm, color: sched.isTaken ? Colors.greenAccent : accent),
                                      title: Text(sched.title.isNotEmpty ? sched.title : timeStr, style: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.white, fontWeight: FontWeight.bold)),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                        onPressed: () {
                                          setState(() => _schedules.removeAt(i));
                                          _saveSchedules();
                                        },
                                      ),
                                      onTap: () => _showAlarmActionDialog(sched),
                                    ),
                                  );
                                },
                              ),
                        _apps.isEmpty
                            ? Center(child: Text(t['empty_apps']!, style: TextStyle(color: hc ? const Color(0xFFFFD700) : Colors.white38, fontSize: 18)))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 90),
                                itemCount: _apps.length,
                                itemBuilder: (ctx, i) {
                                  final ap = _apps[i];
                                  return Container(
                                    margin: const EdgeInsets.only(bottom: 14),
                                    decoration: cyber3D(context: context, radius: 20, highContrast: hc),
                                    child: ListTile(
                                      leading: const Icon(Icons.medical_services, color: Colors.purpleAccent),
                                      title: Text(ap.doctor + ' (' + ap.type + ')', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                      subtitle: Text(ap.date + ' | ' + ap.time + '\n' + ap.clinic, style: const TextStyle(color: Colors.white60)),
                                      trailing: ap.clinic.isNotEmpty
                                          ? IconButton(
                                              icon: const Icon(Icons.navigation, color: Colors.cyanAccent),
                                              onPressed: () => _launchMap(ap.clinic, true),
                                            )
                                          : null,
                                    ),
                                  );
                                },
                              ),
                        ListView(
                          padding: const EdgeInsets.all(18),
                          children: [
                            Container(
                              padding: const EdgeInsets.all(16),
                              decoration: cyber3D(context: context, radius: 20, highContrast: hc),
                              child: Column(
                                children: [
                                  Text(t['summary_title']!, style: TextStyle(color: accent, fontSize: 16, fontWeight: FontWeight.bold)),
                                  const SizedBox(height: 12),
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceAround,
                                    children: [
                                      Text(comp['daily'].toString() + '%\n' + t['compliance_daily']!, textAlign: TextAlign.center, style: const TextStyle(color: Colors.cyanAccent, fontWeight: FontWeight.bold)),
                                      Text(comp['weekly'].toString() + '%\n' + t['compliance_weekly']!, textAlign: TextAlign.center, style: const TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold)),
                                      Text(comp['monthly'].toString() + '%\n' + t['compliance_monthly']!, textAlign: TextAlign.center, style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                                    ],
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(height: 20),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10B981), minimumSize: const Size.fromHeight(50)),
                              icon: const Icon(Icons.share, color: Colors.black),
                              label: Text(t['share_pdf']!, style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                              onPressed: _exportAndShareReport,
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                  floatingActionButton: _tabController.index == 2
                      ? null
                      : FloatingActionButton(
                          backgroundColor: accent,
                          onPressed: () {
                            if (_tabController.index == 0) {
                              _openAddScheduleDialog();
                            } else {
                              _openAddAppointmentDialog();
                            }
                          },
                          child: const Icon(Icons.add, color: Colors.black),
                        ),
                ),
              );
            }
          }
          EOF

      - name: Enable Core Library Desugaring
        run: |
          GRADLE_FILE="android/app/build.gradle"
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' $GRADLE_FILE
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' $GRADLE_FILE

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
