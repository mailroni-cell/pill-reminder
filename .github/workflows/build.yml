          class _MainDashboardState extends State<MainDashboard> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            List<ScheduleGroup> _schedules = [];
            List<AppointmentModel> _apps = [];
            Timer? _alarmCheckTimer;

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _loadData();
              _initTTS();
              _startLiveReminderMonitor();
            }

            @override
            void dispose() {
              _alarmCheckTimer?.cancel();
              _tabController.dispose();
              super.dispose();
            }

            void _initTTS() async {
              final app = CyberPillMasterApp.of(context);
              Map<String, String> langMap = {
                'he': 'he-IL',
                'en': 'en-US',
                'ru': 'ru-RU',
                'ro': 'ro-RO',
                'ar': 'ar-SA',
                'de': 'de-DE',
              };
              await flutterTts.setLanguage(langMap[app.currentLang] ?? 'he-IL');
              await flutterTts.setSpeechRate(0.48);
              await flutterTts.setVolume(app.soundVolume);
            }

            void _startLiveReminderMonitor() {
              _alarmCheckTimer = Timer.periodic(const Duration(seconds: 30), (timer) {
                final now = DateTime.now();
                for (var sched in _schedules) {
                  if (!sched.isTaken && sched.hour == now.hour && sched.minute == now.minute) {
                    _triggerHeadsUpAlert(sched);
                    break;
                  }
                }
              });
            }

            void _triggerHeadsUpAlert(ScheduleGroup sched) async {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              SoundGenerator.playEffect(app.soundType, app.soundVolume);

              if (app.voiceAlerts) {
                String pillNames = sched.pills.map((p) => p.name).join(', ');
                await flutterTts.speak('תזכורת: הגיע הזמן ליטול $pillNames');
              }

              const AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                'cyber_pharma_urgent',
                'Urgent Medicine Reminders',
                channelDescription: 'High priority heads up alarm for pills',
                importance: Importance.max,
                priority: Priority.high,
                fullScreenIntent: true,
                visibility: NotificationVisibility.public,
                category: AndroidNotificationCategory.alarm,
              );

              const NotificationDetails notifDetails = NotificationDetails(android: androidDetails);
              await flutterNotifications.show(
                sched.id.hashCode,
                t['alert_popup_title']!,
                '${sched.title}: ${sched.pills.map((p) => p.name).join(', ')}',
                notifDetails,
              );

              if (mounted) {
                _show3DHeadsUpDialog(sched);
              }
            }

            void _show3DHeadsUpDialog(ScheduleGroup sched) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  backgroundColor: hc ? Colors.black : const Color(0xFF0F172A),
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(26),
                    side: BorderSide(color: hc ? const Color(0xFFFFE500) : const Color(0xFFFF0055), width: 3),
                  ),
                  title: Row(
                    children: [
                      const Icon(Icons.warning_amber_rounded, color: Color(0xFFFF0055), size: 32),
                      const SizedBox(width: 8),
                      Expanded(
                        child: Text(
                          t['alert_popup_title']!,
                          style: TextStyle(
                            fontSize: hc ? 20 : 17,
                            fontWeight: FontWeight.w900,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                          ),
                        ),
                      ),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(sched.title, style: const TextStyle(color: Color(0xFF00F0FF), fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      ...sched.pills.map((p) => Text('💊 ${p.name} (מינון: ${p.dosage})', style: const TextStyle(color: Colors.white, fontSize: 16))),
                    ],
                  ),
                  actionsAlignment: MainAxisAlignment.spaceEvenly,
                  actions: [
                    CyberTactileButton(
                      height: 44,
                      glowColor: const Color(0xFF00FF88),
                      onTap: () {
                        setState(() => sched.isTaken = true);
                        _saveSchedules();
                        Navigator.pop(ctx);
                      },
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 8.0),
                        child: Text(t['btn_taken']!, style: const TextStyle(color: Color(0xFF00FF88), fontWeight: FontWeight.bold)),
                      ),
                    ),
                    CyberTactileButton(
                      height: 44,
                      glowColor: const Color(0xFFFFB703),
                      onTap: () {
                        setState(() {
                          sched.minute = (sched.minute + 10) % 60;
                          if (sched.minute < 10) sched.hour = (sched.hour + 1) % 24;
                        });
                        _saveSchedules();
                        Navigator.pop(ctx);
                      },
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 8.0),
                        child: Text(t['btn_snooze']!, style: const TextStyle(color: Color(0xFFFFB703), fontWeight: FontWeight.bold)),
