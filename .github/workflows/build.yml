              'dosage': 'الجرعة',
              'stock': 'المخزون',
              'time': 'الوقت',
              'save': 'حفظ',
              'cancel': 'إلغاء',
              'empty_state': 'لا توجد أدوية',
              'stock_alert': 'المخزون منخفض!',
              'settings': 'الإعدادات',
              'help': 'مساعدة',
