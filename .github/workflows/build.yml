name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Skeleton
        run: |
          flutter create --org com.example --project-name pill_reminder . --platforms=android --overwrite

      - name: Configure Android Permissions and Gradle
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle
          fi

      - name: Create pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: Pill reminder app
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
          flutter:
            uses-material-design: true
          EOF

      - name: Create lib/main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/cupertino.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;

          final FlutterLocalNotificationsPlugin flutterLocalNotificationsPlugin =
              FlutterLocalNotificationsPlugin();
          final FlutterTts flutterTts = FlutterTts();

          const List<String> commonMedicinesList = [
            'אקמול (Acamol)',
            'אופטלגין (Optalgin)',
            'נורופן (Nurofen)',
            'אדוויל (Advil)',
            'אספירין (Aspirin)',
            'ליפיטור (Lipitor)',
            'קרסטור (Crestor)',
            'גלוקופאז (Glucophage)',
            'לוסרטן (Losartan)',
            'נורווסק (Norvasc)',
            'קונקור (Concor)',
            'נקסיום (Nexium)',
            'לוסק (Losec)',
            'ציפרלקס (Cipralex)',
            'זולופט (Zoloft)',
            'קסנקס (Xanax)',
            'קלונקס (Clonex)',
            'אוגמנטין (Augmentin)',
            'מוקסיפן (Moxypen)',
            'אלטרוקסין (Eltroxin)',
            'ויטמין D3 (Vitamin D3)',
            'ויטמין B12 (Vitamin B12)',
            'ברזל (Iron)',
            'חומצה פולית (Folic Acid)',
            'מגנזיום (Magnesium)'
