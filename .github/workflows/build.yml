          class _RotaryVolumeDial3DState extends State<RotaryVolumeDial3D> {
            double _currentVol = 1.0;

            @override
            void initState() {
              super.initState();
              _currentVol = widget.volume;
            }

            @override
            void didUpdateWidget(covariant RotaryVolumeDial3D oldWidget) {
              super.didUpdateWidget(oldWidget);
              if (oldWidget.volume != widget.volume) {
                _currentVol = widget.volume;
              }
            }

            void _updateVolume(double newVol) {
              final double clamped = newVol.clamp(0.0, 1.0);
              setState(() => _currentVol = clamped);
              widget.onChanged(clamped);
            }

            @override
            Widget build(BuildContext context) {
              final palette = widget.palette;
              final hc = widget.highContrast;
              final accentColor = hc ? const Color(0xFFFFE500) : palette.primary;
              final highlightColor = hc ? const Color(0xFFFFE500) : palette.highlight;

              return MechModuleCard(
                accentColor: accentColor,
                showLed: true,
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 8, horizontal: 12),
                  child: Column(
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(
                            children: [
                              Icon(Icons.volume_up_rounded, color: accentColor, size: 22),
                              const SizedBox(width: 8),
                              Text(
                                'חוגת עוצמת שמע 3D (Master Volume)',
                                style: TextStyle(
                                  color: palette.textColor,
                                  fontWeight: FontWeight.w900,
                                  fontSize: 14,
