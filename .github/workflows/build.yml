          class _DynamicFuturisticBackgroundState extends State<DynamicFuturisticBackground> with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: this, duration: const Duration(seconds: 10))..repeat();
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) return widget.child;

              return AnimatedBuilder(
                animation: _anim,
                builder: (context, child) {
                  return CustomPaint(
                    painter: MachineFXPainter(
                      progress: _anim.value,
                      color: widget.accentColor,
                      effect: widget.effectType,
                    ),
                    child: widget.child,
                  );
                },
              );
            }
          }

          class MachineFXPainter extends CustomPainter {
            final double progress;
            final Color color;
            final String effect;

            MachineFXPainter({required this.progress, required this.color, required this.effect});

            @override
            void paint(Canvas canvas, Size size) {
              if (effect == 'carbon') {
                final paintLight = Paint()..color = Colors.white.withOpacity(0.025)..style = PaintingStyle.fill;
                final paintDark = Paint()..color = Colors.black.withOpacity(0.45)..style = PaintingStyle.fill;
                final double cell = 14.0;

                for (double y = 0; y < size.height; y += cell) {
                  for (double x = 0; x < size.width; x += cell) {
                    bool isEven = ((x / cell).toInt() + (y / cell).toInt()) % 2 == 0;
                    canvas.drawRect(Rect.fromLTWH(x, y, cell, cell), isEven ? paintLight : paintDark);
                  }
                }
              } else if (effect == 'hex') {
                final double r = 32.0;
                final double w = math.sqrt(3) * r;
                final double h = 2 * r * 0.75;
                final paint = Paint()
                  ..color = color.withOpacity(0.06)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.2;

                int row = 0;
                for (double y = -r; y < size.height + r; y += h, row++) {
                  double xOffset = (row % 2 == 0) ? 0 : w / 2;
                  for (double x = -w + xOffset; x < size.width + w; x += w) {
                    Path path = Path();
                    for (int i = 0; i < 6; i++) {
                      double angle = (60.0 * i - 30.0) * math.pi / 180.0;
                      double px = x + r * 0.5 * math.cos(angle);
                      double py = y + r * 0.5 * math.sin(angle);
                      if (i == 0) path.moveTo(px, py); else path.lineTo(px, py);
                    }
                    path.close();
                    canvas.drawPath(path, paint);
                  }
                }
              } else if (effect == 'plasma') {
                for (int layer = 1; layer <= 3; layer++) {
                  final paint = Paint()
                    ..color = color.withOpacity(0.05 * layer)
                    ..style = PaintingStyle.fill;
                  final path = Path()..moveTo(0, size.height * 0.65);
                  for (double x = 0; x <= size.width; x += 12) {
                    double y = math.sin((x / size.width * (layer + 1) * math.pi) + (progress * 2 * math.pi)) * (16.0 * layer) +
                        math.cos((x / size.width * 2 * math.pi) + (progress * 2 * math.pi)) * 12 +
                        size.height * (0.7 + layer * 0.07);
                    path.lineTo(x, y);
                  }
                  path.lineTo(size.width, size.height);
                  path.lineTo(0, size.height);
                  path.close();
                  canvas.drawPath(path, paint);
                }
              } else {
                final paint = Paint()
                  ..color = color.withOpacity(0.12)
                  ..strokeWidth = 1.4;

                double horizonY = size.height * 0.48;
                double speedOffset = (progress * 40);

                for (double y = horizonY; y <= size.height; y += 26) {
                  canvas.drawLine(Offset(0, y), Offset(size.width, y), paint);
                }
                for (double x = -size.width * 0.5; x <= size.width * 1.5; x += 38) {
                  canvas.drawLine(Offset(size.width * 0.5, horizonY), Offset(x + (speedOffset % 38), size.height), paint);
                }
              }
            }

            @override
            bool shouldRepaint(covariant MachineFXPainter oldDelegate) => true;
          }

