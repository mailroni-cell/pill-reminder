          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;
          import 'package:url_launcher/url_launcher.dart';

          final FlutterLocalNotificationsPlugin flutterNotifications = FlutterLocalNotificationsPlugin();
          final FlutterTts flutterTts = FlutterTts();
          final AudioPlayer audioPlayer = AudioPlayer();

          class SoundGenerator {
            static Uint8List createToneWav(double frequency, double durationSeconds, {String type = 'sine'}) {
              final int sampleRate = 22050;
              final int numSamples = (sampleRate * durationSeconds).toInt();
              final int dataLength = numSamples * 2;
              final int bufferLength = 44 + dataLength;

              final ByteData buffer = ByteData(bufferLength);
              buffer.setUint8(0, 0x52); buffer.setUint8(1, 0x49); buffer.setUint8(2, 0x46); buffer.setUint8(3, 0x46);
              buffer.setUint32(4, 36 + dataLength, Endian.little);
              buffer.setUint8(8, 0x57); buffer.setUint8(9, 0x41); buffer.setUint8(10, 0x56); buffer.setUint8(11, 0x45);
              buffer.setUint8(12, 0x66); buffer.setUint8(13, 0x6D); buffer.setUint8(14, 0x74); buffer.setUint8(15, 0x20);
              buffer.setUint32(16, 16, Endian.little);
              buffer.setUint16(20, 1, Endian.little);
              buffer.setUint16(22, 1, Endian.little);
              buffer.setUint32(24, sampleRate, Endian.little);
              buffer.setUint32(28, sampleRate * 2, Endian.little);
              buffer.setUint16(32, 2, Endian.little);
              buffer.setUint16(34, 16, Endian.little);
              buffer.setUint8(36, 0x64); buffer.setUint8(37, 0x61); buffer.setUint8(38, 0x74); buffer.setUint8(39, 0x61);
              buffer.setUint32(40, dataLength, Endian.little);

              int offset = 44;
              for (int i = 0; i < numSamples; i++) {
                double t = i / sampleRate;
                double val = 0.0;
                double env = 1.0 - (i / numSamples);

                if (type == 'sweep') {
                  double curFreq = frequency + (i / numSamples) * 750.0;
                  val = math.sin(2 * math.pi * curFreq * t);
                } else if (type == 'gong') {
                  val = 0.6 * math.sin(2 * math.pi * frequency * t) +
                        0.4 * math.sin(2 * math.pi * (frequency * 1.5) * t);
                  env = math.exp(-3.2 * (i / numSamples));
                } else if (type == 'alarm') {
                  val = ((t * frequency * 2).toInt() % 2 == 0) ? 0.75 : -0.75;
                  env = (math.sin(t * 16 * math.pi) > 0) ? 1.0 : 0.0;
                } else {
                  val = math.sin(2 * math.pi * frequency * t);
                  env = math.exp(-2.5 * (i / numSamples));
                }

                int sampleVal = (val * env * 28000).toInt().clamp(-32768, 32767);
                buffer.setInt16(offset, sampleVal, Endian.little);
                offset += 2;
              }
              return buffer.buffer.asUint8List();
            }

            static Future<void> playAlertTone(String soundType, double volume) async {
              try {
                final tempDir = await getTemporaryDirectory();
                final file = File('${tempDir.path}/cyber_alert_$soundType.wav');
                
                Uint8List bytes;
                if (soundType == 'electric') {
                  bytes = createToneWav(600, 0.45, type: 'sweep');
                } else if (soundType == 'gong') {
                  bytes = createToneWav(320, 1.2, type: 'gong');
                } else if (soundType == 'alarm') {
                  bytes = createToneWav(950, 0.65, type: 'alarm');
                } else {
                  bytes = createToneWav(1150, 0.6, type: 'bell');
                }

                await file.writeAsBytes(bytes, flush: true);
                await audioPlayer.stop();
                await audioPlayer.setVolume(volume);
                await audioPlayer.play(DeviceFileSource(file.path));
              } catch (_) {}
            }
          }

