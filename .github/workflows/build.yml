          class _Interactive3DGlassBackgroundState extends State<Interactive3DGlassBackground>
              with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: this, duration: const Duration(seconds: 12))..repeat();
            }

            @override
            void didUpdateWidget(covariant Interactive3DGlassBackground oldWidget) {
              super.didUpdateWidget(oldWidget);
              if (oldWidget.style != widget.style || oldWidget.palette != widget.palette) {
                setState(() {});
              }
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) {
                return Container(color: Colors.black, child: widget.child);
              }

              return Stack(
                children: [
                  Container(color: widget.palette.background),
                  ClipRect(
                    child: RepaintBoundary(
                      child: AnimatedBuilder(
                        animation: _anim,
                        builder: (context, _) {
                          return CustomPaint(
                            size: Size.infinite,
                            painter: Multi3DGraphicsPainter(
                              progress: _anim.value,
                              palette: widget.palette,
                              style: widget.style,
                            ),
                          );
                        },
                      ),
                    ),
                  ),
                  // High-clarity subtle vignette with IgnorePointer to ensure zero interference with buttons
                  IgnorePointer(
                    child: Container(
                      decoration: BoxDecoration(
                        gradient: RadialGradient(
                          center: Alignment.center,
                          radius: 1.25,
                          colors: [
                            widget.palette.background.withOpacity(0.08),
                            widget.palette.background.withOpacity(0.30),
                            Colors.black.withOpacity(0.55),
                          ],
                        ),
                      ),
                    ),

                  ),
                  widget.child,
                ],
              );
            }
          }

