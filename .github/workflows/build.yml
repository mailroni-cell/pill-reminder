              'help_content': 'دليل الاستخدام:\n1. اضغط على دواء جديد وحدد الوقت والجرعة.\n2. اضغط على الرمز لتأكيد أخذ الدواء.\n3. يمكنك تفعيل الخط الكبير من الإعدادات.'
            },
            'de': {
              'app_title': 'Medikamenten-Erinnerung',
              'created_by': 'Erstellt und entwickelt von Roni Schneider',
              'add_med': 'Neues Medikament',
              'med_name': 'Wählen oder eingeben',
              'dosage': 'Dosis',
              'stock': 'Vorrat',
              'time': 'Uhrzeit',
              'save': 'Speichern',
              'cancel': 'Abbrechen',
              'empty_state': 'Keine Medikamente vorhanden',
              'stock_alert': 'Vorrat fast leer!',
              'settings': 'Einstellungen',
              'help': 'Hilfe',
              'voice_alerts': 'Sprachausgabe',
              'high_contrast': 'Hoher Kontrast',
              'tts_phrase': 'Zeit für Ihr Medikament: {name}',
              'help_content': 'Hilfe:\n1. Tippen Sie auf "Neues Medikament" und stellen Sie Dosis und Uhrzeit ein.\n2. Bestätigen Sie die Einnahme durch Antippen.\n3. Hoher Kontrast ist in den Einstellungen verfügbar.'
            },
          };

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            tz.initializeTimeZones();

            const AndroidInitializationSettings initializationSettingsAndroid =
                AndroidInitializationSettings('@mipmap/ic_launcher');

            const InitializationSettings initializationSettings = InitializationSettings(
              android: initializationSettingsAndroid,
            );

            await flutterLocalNotificationsPlugin.initialize(initializationSettings);

            runApp(const PillAppRoot());
          }

          class PillAppRoot extends StatefulWidget {
            const PillAppRoot({super.key});

            static _PillAppRootState of(BuildContext context) =>
                context.findAncestorStateOfType<_PillAppRootState>()!;

            @override
            State<PillAppRoot> createState() => _PillAppRootState();
          }

          class _PillAppRootState extends State<PillAppRoot> {
            String lang = 'he';
            bool voiceAlerts = true;
            bool highContrast = false;

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                lang = prefs.getString('app_lang') ?? 'he';
                voiceAlerts = prefs.getBool('app_voice_alerts') ?? true;
                highContrast = prefs.getBool('app_high_contrast') ?? false;
              });
            }

            void updateState({String? newLang, bool? newVoice, bool? newHc}) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (newLang != null) {
                  lang = newLang;
                  prefs.setString('app_lang', newLang);
                }
                if (newVoice != null) {
                  voiceAlerts = newVoice;
                  prefs.setBool('app_voice_alerts', newVoice);
                }
                if (newHc != null) {
                  highContrast = newHc;
                  prefs.setBool('app_high_contrast', newHc);
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              final bool isRtl = lang == 'he' || lang == 'ar';
              return MaterialApp(
                title: 'Pill Reminder',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: highContrast ? Colors.white : const Color(0xFFE9EEF4),
                  colorSchemeSeed: highContrast ? Colors.black : const Color(0xFF1E4C74),
                ),
                home: Directionality(
                  textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                  child: SplashScreen(lang: lang, highContrast: highContrast),
                ),
              );
            }
          }

          BoxDecoration neumorphicDeco({double radius = 18, bool isPressed = false, bool hc = false}) {
            if (hc) {
              return BoxDecoration(
                color: isPressed ? Colors.grey.shade300 : Colors.white,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: Colors.black, width: 2.2),
              );
            }
            if (isPressed) {
              return BoxDecoration(
                color: const Color(0xFFE9EEF4),
                borderRadius: BorderRadius.circular(radius),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.12), offset: const Offset(2, 2), blurRadius: 4),
                  BoxShadow(color: Colors.white.withOpacity(0.9), offset: const Offset(-2, -2), blurRadius: 4),
                ],
              );
            }
            return BoxDecoration(
              color: const Color(0xFFE9EEF4),
              borderRadius: BorderRadius.circular(radius),
              boxShadow: [
                BoxShadow(color: const Color(0xFFA5B4C7).withOpacity(0.7), offset: const Offset(5, 5), blurRadius: 10),
                const BoxShadow(color: Colors.white, offset: Offset(-5, -5), blurRadius: 10),
              ],
            );
          }

          class SplashScreen extends StatefulWidget {
            final String lang;
            final bool highContrast;
            const SplashScreen({super.key, required this.lang, required this.highContrast});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(seconds: 3), () {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (ctx) => const MainPillScreen()),
                );
              });
            }

            @override
            Widget build(BuildContext context) {
              final t = translations[widget.lang] ?? translations['he']!;
              return Scaffold(
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        width: 130,
                        height: 130,
                        decoration: neumorphicDeco(radius: 35, hc: widget.highContrast),
                        child: const Icon(Icons.medication_liquid, size: 70, color: Color(0xFF1E4C74)),
                      ),
                      const SizedBox(height: 32),
                      Text(
                        t['app_title']!,
                        style: TextStyle(fontSize: widget.highContrast ? 32 : 26, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 14),
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 10),
                        decoration: neumorphicDeco(radius: 14, hc: widget.highContrast),
                        child: Text(
                          t['created_by']!,
                          style: TextStyle(
                            fontSize: widget.highContrast ? 17 : 14,
                            fontWeight: FontWeight.bold,
                            color: widget.highContrast ? Colors.black : const Color(0xFF4B6584),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class Medicine {
            String id;
            String name;
            int dosage;
            int hour;
            int minute;
            int stock;
            bool isTaken;

            Medicine({
              required this.id,
              required this.name,
              required this.dosage,
              required this.hour,
              required this.minute,
              required this.stock,
              this.isTaken = false,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'name': name,
                  'dosage': dosage,
                  'hour': hour,
                  'minute': minute,
                  'stock': stock,
                  'isTaken': isTaken,
                };

            factory Medicine.fromMap(Map<String, dynamic> map) => Medicine(
                  id: map['id'],
                  name: map['name'],
                  dosage: map['dosage'] ?? 1,
                  hour: map['hour'],
                  minute: map['minute'],
                  stock: map['stock'],
                  isTaken: map['isTaken'] ?? false,
                );
          }

          class MainPillScreen extends StatefulWidget {
            const MainPillScreen({super.key});

            @override
            State<MainPillScreen> createState() => _MainPillScreenState();
          }

          class _MainPillScreenState extends State<MainPillScreen> {
            List<Medicine> _medicines = [];

            @override
            void initState() {
              super.initState();
              _loadMeds();
            }

            Future<void> _loadMeds() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_meds_list');
              if (data != null) {
                final List decoded = jsonDecode(data);
                setState(() {
                  _medicines = decoded.map((e) => Medicine.fromMap(e)).toList();
                });
              }
            }

            Future<void> _saveMeds() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString(
                'saved_meds_list',
                jsonEncode(_medicines.map((m) => m.toMap()).toList()),
              );
            }

            void _speak(Medicine med) async {
              final app = PillAppRoot.of(context);
              if (!app.voiceAlerts) return;
              final t = translations[app.lang] ?? translations['he']!;
              String txt = t['tts_phrase']!.replaceAll('{name}', med.name);
              await flutterTts.speak(txt);
            }

            void _toggle(Medicine med) {
              setState(() {
                med.isTaken = !med.isTaken;
                if (med.isTaken) {
                  if (med.stock >= med.dosage) med.stock -= med.dosage;
                  _speak(med);
                } else {
                  med.stock += med.dosage;
                }
              });
              _saveMeds();
            }

            void _showAddDialog() {
              final app = PillAppRoot.of(context);
              final t = translations[app.lang] ?? translations['he']!;
              final nameCtrl = TextEditingController();
              int dosage = 1;
              int stock = 30;
              int hour = 8;
              int minute = 0;
              final hc = app.highContrast;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: hc ? Colors.white : const Color(0xFFE9EEF4),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(25)),
                ),
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setDialog) => Directionality(
                    textDirection: (app.lang == 'he' || app.lang == 'ar') ? TextDirection.rtl : TextDirection.ltr,
                    child: Padding(
                      padding: EdgeInsets.only(
                        top: 20,
                        left: 20,
                        right: 20,
                        bottom: MediaQuery.of(context).viewInsets.bottom + 20,
                      ),
                      child: SingleChildScrollView(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Text(t['add_med']!, style: TextStyle(fontSize: hc ? 24 : 20, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 12),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 10),
                              decoration: neumorphicDeco(radius: 12, hc: hc),
                              child: DropdownButtonHideUnderline(
                                child: DropdownButton<String>(
                                  isExpanded: true,
                                  hint: Text(t['med_name']!),
                                  items: commonMedicinesList.map((m) => DropdownMenuItem(value: m, child: Text(m))).toList(),
                                  onChanged: (val) {
                                    if (val != null) setDialog(() => nameCtrl.text = val);
                                  },
                                ),
                              ),
                            ),
                            const SizedBox(height: 10),
                            Container(
                              decoration: neumorphicDeco(radius: 12, isPressed: true, hc: hc),
                              padding: const EdgeInsets.symmetric(horizontal: 14),
                              child: TextField(
                                controller: nameCtrl,
                                decoration: InputDecoration(border: InputBorder.none, hintText: t['med_name']),
                              ),
                            ),
                            const SizedBox(height: 14),
                            Row(
                              children: [
                                Expanded(
                                  child: Column(
                                    children: [
                                      Text(t['dosage']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                                      Container(
                                        height: 90,
                                        decoration: neumorphicDeco(radius: 12, hc: hc),
                                        child: CupertinoPicker(
                                          itemExtent: 30,
                                          onSelectedItemChanged: (i) => setDialog(() => dosage = i + 1),
                                          children: List.generate(10, (i) => Center(child: Text('${i + 1}'))),
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: Column(
                                    children: [
                                      Text(t['stock']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                                      Container(
                                        height: 90,
                                        decoration: neumorphicDeco(radius: 12, hc: hc),
                                        child: CupertinoPicker(
                                          itemExtent: 30,
                                          scrollController: FixedExtentScrollController(initialItem: 29),
                                          onSelectedItemChanged: (i) => setDialog(() => stock = i + 1),
                                          children: List.generate(100, (i) => Center(child: Text('${i + 1}'))),
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 10),
                            Text(t['time']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                            Container(
                              height: 90,
                              decoration: neumorphicDeco(radius: 12, hc: hc),
                              child: Row(
                                children: [
                                  Expanded(
                                    child: CupertinoPicker(
                                      itemExtent: 30,
                                      scrollController: FixedExtentScrollController(initialItem: 8),
                                      onSelectedItemChanged: (i) => setDialog(() => hour = i),
                                      children: List.generate(24, (i) => Center(child: Text(i.toString().padLeft(2, '0')))),
                                    ),
                                  ),
                                  const Text(':', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                                  Expanded(
                                    child: CupertinoPicker(
                                      itemExtent: 30,
                                      onSelectedItemChanged: (i) => setDialog(() => minute = i * 5),
                                      children: List.generate(12, (i) => Center(child: Text((i * 5).toString().padLeft(2, '0')))),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(height: 18),
                            GestureDetector(
                              onTap: () {
                                if (nameCtrl.text.trim().isEmpty) return;
                                setState(() {
                                  _medicines.add(Medicine(
                                    id: DateTime.now().millisecondsSinceEpoch.toString(),
                                    name: nameCtrl.text.trim(),
                                    dosage: dosage,
                                    hour: hour,
                                    minute: minute,
                                    stock: stock,
                                  ));
                                });
                                _saveMeds();
                                Navigator.pop(ctx);
                              },
                              child: Container(
                                height: 48,
                                decoration: neumorphicDeco(radius: 14, hc: hc),
                                child: Center(
                                  child: Text(t['save']!, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final app = PillAppRoot.of(context);
              final t = translations[app.lang] ?? translations['he']!;
              final hc = app.highContrast;

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  centerTitle: true,
                  title: Text(t['app_title']!, style: TextStyle(fontWeight: FontWeight.bold, fontSize: hc ? 24 : 20)),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.help_outline),
                      onPressed: () {
                        showDialog(
                          context: context,
                          builder: (c) => Directionality(
                            textDirection: (app.lang == 'he' || app.lang == 'ar') ? TextDirection.rtl : TextDirection.ltr,
                            child: AlertDialog(
                              title: Text(t['help']!),
                              content: Text(t['help_content']!),
                              actions: [
                                TextButton(onPressed: () => Navigator.pop(c), child: Text(t['cancel']!)),
                              ],
                            ),
                          ),
                        );
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.settings),
                      onPressed: () {
                        showModalBottomSheet(
                          context: context,
                          backgroundColor: hc ? Colors.white : const Color(0xFFE9EEF4),
                          builder: (c) => StatefulBuilder(
                            builder: (ctx, setS) => Directionality(
                              textDirection: (app.lang == 'he' || app.lang == 'ar') ? TextDirection.rtl : TextDirection.ltr,
                              child: Padding(
                                padding: const EdgeInsets.all(20),
                                child: Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    SwitchListTile(
                                      title: Text(t['high_contrast']!),
                                      value: app.highContrast,
                                      onChanged: (v) {
                                        setS(() => app.updateState(newHc: v));
                                      },
                                    ),
                                    SwitchListTile(
                                      title: Text(t['voice_alerts']!),
                                      value: app.voiceAlerts,
                                      onChanged: (v) {
                                        setS(() => app.updateState(newVoice: v));
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ),
                        );
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.language),
                      onPressed: () {
                        showModalBottomSheet(
                          context: context,
                          backgroundColor: hc ? Colors.white : const Color(0xFFE9EEF4),
                          builder: (c) => ListView(
                            shrinkWrap: true,
                            children: [
                              ListTile(title: const Text('עברית'), onTap: () { app.updateState(newLang: 'he'); Navigator.pop(c); }),
                              ListTile(title: const Text('English'), onTap: () { app.updateState(newLang: 'en'); Navigator.pop(c); }),
                              ListTile(title: const Text('Русский'), onTap: () { app.updateState(newLang: 'ru'); Navigator.pop(c); }),
                              ListTile(title: const Text('Română'), onTap: () { app.updateState(newLang: 'ro'); Navigator.pop(c); }),
                              ListTile(title: const Text('العربية'), onTap: () { app.updateState(newLang: 'ar'); Navigator.pop(c); }),
                              ListTile(title: const Text('Deutsch'), onTap: () { app.updateState(newLang: 'de'); Navigator.pop(c); }),
                            ],
                          ),
                        );
                      },
                    ),
                  ],
                ),
                body: _medicines.isEmpty
                    ? Center(child: Text(t['empty_state']!, style: TextStyle(fontSize: hc ? 20 : 16)))
                    : ListView.builder(
                        padding: const EdgeInsets.all(16),
                        itemCount: _medicines.length,
                        itemBuilder: (ctx, i) {
                          final med = _medicines[i];
                          final timeStr = '${med.hour.toString().padLeft(2, '0')}:${med.minute.toString().padLeft(2, '0')}';
                          return Container(
                            margin: const EdgeInsets.only(bottom: 14),
                            decoration: neumorphicDeco(radius: 16, isPressed: med.isTaken, hc: hc),
                            child: ListTile(
                              leading: Icon(med.isTaken ? Icons.check_circle : Icons.alarm, color: med.isTaken ? Colors.green : Colors.blue),
                              title: Text(med.name, style: TextStyle(fontSize: hc ? 20 : 16, fontWeight: FontWeight.bold)),
                              subtitle: Text('$timeStr | ${t['dosage']}: ${med.dosage} | ${t['stock']}: ${med.stock}'),
                              trailing: IconButton(
                                icon: const Icon(Icons.delete_outline, color: Colors.red),
                                onPressed: () {
                                  setState(() => _medicines.removeAt(i));
                                  _saveMeds();
                                },
                              ),
                              onTap: () => _toggle(med),
                            ),
                          );
                        },
                      ),
                floatingActionButton: GestureDetector(
                  onTap: _showAddDialog,
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                    decoration: neumorphicDeco(radius: 20, hc: hc),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(Icons.add),
                        const SizedBox(width: 6),
                        Text(t['add_med']!, style: TextStyle(fontWeight: FontWeight.bold, fontSize: hc ? 18 : 15)),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
