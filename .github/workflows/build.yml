          class CyberPillMasterApp extends StatefulWidget {
            const CyberPillMasterApp({super.key});

            static _CyberPillMasterAppState of(BuildContext context) =>
                context.findAncestorStateOfType<_CyberPillMasterAppState>()!;

            @override
            State<CyberPillMasterApp> createState() => _CyberPillMasterAppState();
          }

          class _CyberPillMasterAppState extends State<CyberPillMasterApp> {
            String _lang = 'he';
            String _userName = '';
            bool _voiceAlerts = true;
            bool _highContrast = false;
            String _soundMed = 'electric';
            String _soundDoc = 'alarm';
            double _soundVolume = 1.0;
            String _themeKey = 'cyber';
            bool _firstRun = true;
            bool _initialized = false;
            Key _appKey = UniqueKey();

            String get currentLang => _lang;
            String get userName => _userName;
            bool get voiceAlerts => _voiceAlerts;
            bool get highContrast => _highContrast;
            String get soundMed => _soundMed;
            String get soundDoc => _soundDoc;
            double get soundVolume => _soundVolume;
            String get themeKey => _themeKey;

            @override
            void initState() {
              super.initState();
              _loadConfig();
            }

            Future<void> _loadConfig() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _lang = prefs.getString('c_lang') ?? 'he';
                _userName = prefs.getString('c_user_name') ?? '';
                _voiceAlerts = prefs.getBool('c_voice') ?? true;
                _highContrast = prefs.getBool('c_hc') ?? false;
                _soundMed = prefs.getString('c_sound_med') ?? 'electric';
                _soundDoc = prefs.getString('c_sound_doc') ?? 'alarm';
                _soundVolume = prefs.getDouble('c_volume') ?? 1.0;
                _themeKey = prefs.getString('c_theme') ?? 'cyber';
                _firstRun = prefs.getBool('c_first_run') ?? true;
                _initialized = true;
              });
            }

            void setLanguage(String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_lang', lang);
              setState(() {
                _lang = lang;
                _appKey = UniqueKey();
              });
            }

            void completeOnboarding(String name, String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_user_name', name);
              await prefs.setString('c_lang', lang);
              await prefs.setBool('c_first_run', false);
              setState(() {
                _userName = name;
                _lang = lang;
                _firstRun = false;
                _appKey = UniqueKey();
              });
            }

            void setThemeKey(String key) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_theme', key);
              setState(() => _themeKey = key);
            }

            void updateSettings({bool? voice, bool? hc, String? soundMed, String? soundDoc, double? volume}) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (voice != null) {
                  _voiceAlerts = voice;
                  prefs.setBool('c_voice', voice);
                }
                if (hc != null) {
                  _highContrast = hc;
                  prefs.setBool('c_hc', hc);
                }
                if (soundMed != null) {
                  _soundMed = soundMed;
                  prefs.setString('c_sound_med', soundMed);
                }
                if (soundDoc != null) {
                  _soundDoc = soundDoc;
                  prefs.setString('c_sound_doc', soundDoc);
                }
                if (volume != null) {
                  _soundVolume = volume;
                  prefs.setDouble('c_volume', volume);
                }
              });
            }

            Future<void> playAudioTone(String type, double vol) async {
              try {
                await nativeAudio.invokeMethod('playTone', {
                  'type': type,
                  'volume': vol,
                });
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              if (!_initialized) return const SizedBox();

              final bool isRtl = _lang == 'he' || _lang == 'ar';
              final palette = themePalettes[_themeKey] ?? themePalettes['cyber']!;
              final Color bg = _highContrast ? Colors.black : palette['bg']!;
              final Color primary = _highContrast ? const Color(0xFFFFD700) : palette['accent']!;

              return KeyedSubtree(
                key: _appKey,
                child: MaterialApp(
                  title: 'Cyber Pharma',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    useMaterial3: true,
                    scaffoldBackgroundColor: bg,
                    colorSchemeSeed: primary,
                  ),
                  home: Directionality(
                    textDirection: isRtl ? ui.TextDirection.rtl : ui.TextDirection.ltr,
                    child: _firstRun ? const FirstTimeSetupScreen() : const MainDashboard(),
                  ),
                ),
              );
            }
          }

          // 3D Perspective Cyber Grid & Floating Neon Dust
          class Dynamic3DCyberBackground extends StatefulWidget {
            final Widget child;
            final Color accentColor;
            final bool isHighContrast;
            const Dynamic3DCyberBackground({
              super.key,
              required this.child,
              required this.accentColor,
              this.isHighContrast = false,
            });

            @override
            State<Dynamic3DCyberBackground> createState() => _Dynamic3DCyberBackgroundState();
          }

          class _Dynamic3DCyberBackgroundState extends State<Dynamic3DCyberBackground>
              with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: this, duration: const Duration(seconds: 5))
                ..repeat();
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) {
                return widget.child;
              }
              return AnimatedBuilder(
                animation: _anim,
                builder: (context, child) {
                  return CustomPaint(
                    painter: CyberGrid3DPainter(
                      progress: _anim.value,
                      color: widget.accentColor,
                    ),
                    child: widget.child,
                  );
                },
              );
            }
          }

          class CyberGrid3DPainter extends CustomPainter {
            final double progress;
            final Color color;
            CyberGrid3DPainter({required this.progress, required this.color});

            @override
            void paint(Canvas canvas, Size size) {
              final w = size.width;
              final h = size.height;
              final horizon = h * 0.45;

              final linePaint = Paint()
                ..color = color.withOpacity(0.09)
                ..strokeWidth = 1.2
                ..style = PaintingStyle.stroke;

              final vanishingPoint = Offset(w * 0.5, horizon);

              for (double x = -w * 0.3; x <= w * 1.3; x += w * 0.16) {
                canvas.drawLine(vanishingPoint, Offset(x, h), linePaint);
              }

              final double numLines = 8;
              for (int i = 0; i < numLines; i++) {
                double normalized = ((i / numLines) + progress) % 1.0;
                double y = horizon + (h - horizon) * math.pow(normalized, 2.2);
                linePaint.color = color.withOpacity(0.04 + (normalized * 0.1));
                canvas.drawLine(Offset(0, y), Offset(w, y), linePaint);
              }

              final dotPaint = Paint()..style = PaintingStyle.fill;
              for (int i = 0; i < 15; i++) {
                double pProgress = (progress + (i * 0.067)) % 1.0;
                double px = (math.sin(i * 1.5) * 0.4 + 0.5) * w;
                double py = h - (pProgress * h * 0.65);
                double pSize = 1.5 + (pProgress * 2.5);
                dotPaint.color = color.withOpacity((1.0 - pProgress) * 0.35);
                canvas.drawCircle(Offset(px, py), pSize, dotPaint);
              }
            }

            @override
            bool shouldRepaint(covariant CyberGrid3DPainter oldDelegate) => true;
          }

          BoxDecoration cyber3D({
            required BuildContext context,
            double radius = 24,
            bool isPressed = false,
            bool highContrast = false,
            Color? customGlow,
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? const Color(0xFF282500) : Colors.black,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: const Color(0xFFFFD700), width: 3.0),
                boxShadow: const [
                  BoxShadow(color: Color(0xFFFFD700), blurRadius: 4, offset: Offset(1, 1))
                ],
              );
            }
            final app = CyberPillMasterApp.of(context);
            final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
            final Color surface = palette['surface']!;
            final Color bg = palette['bg']!;
            final Color glow = customGlow ?? palette['accent']!;

            if (isPressed) {
              return BoxDecoration(
                color: surface,
                borderRadius: BorderRadius.circular(radius),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.7), offset: const Offset(3, 3), blurRadius: 6),
                  BoxShadow(color: glow.withOpacity(0.3), offset: const Offset(-2, -2), blurRadius: 6),
                ],
              );
            }
            return BoxDecoration(
              gradient: LinearGradient(
                colors: [surface, bg],
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
              ),
              borderRadius: BorderRadius.circular(radius),
              boxShadow: [
                BoxShadow(color: Colors.black.withOpacity(0.85), offset: const Offset(7, 7), blurRadius: 15),
                BoxShadow(color: glow.withOpacity(0.25), offset: const Offset(-3, -3), blurRadius: 10),
              ],
              border: Border.all(color: glow.withOpacity(0.4), width: 1.2),
            );
          }

