                onTapCancel: () => setState(() => _down = false),
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 70),
                  height: widget.height,
                  width: widget.width,
                  transform: pressed ? Matrix4.translationValues(0, 4, 0) : Matrix4.identity(),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(widget.radius),
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: pressed
                          ? [palette['surface']!.withOpacity(0.95), const Color(0xFF030508)]
                          : [palette['surface']!.withOpacity(0.95), palette['bg']!.withOpacity(0.85)],
                    ),
                    border: Border.all(
                      color: pressed ? accent : accent.withOpacity(0.85),
                      width: pressed ? 2.8 : 2.0,
                    ),
                    boxShadow: pressed
                        ? [
                            BoxShadow(color: accent.withOpacity(0.4), blurRadius: 8, spreadRadius: 1),
                            const BoxShadow(color: Colors.black, offset: Offset(1, 1), blurRadius: 4),
                          ]
                        : [
                            BoxShadow(color: Colors.black.withOpacity(0.9), offset: const Offset(0, 8), blurRadius: 16),
                            BoxShadow(color: accent.withOpacity(0.45), offset: const Offset(0, -1), blurRadius: 10),
                            BoxShadow(color: accent.withOpacity(0.2), blurRadius: 12, spreadRadius: 1),
                          ],
                  ),
                  child: Center(child: widget.child),
                ),
              );
            }
          }

          // Real 3D Sculpted Bevel Container for cards & inputs
          BoxDecoration cyber3D({
            required BuildContext context,
            double radius = 22,
            bool isPressed = false,
            bool highContrast = false,
            Color? customGlow,
            bool isMetallic = false,
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? const Color(0xFF222000) : Colors.black,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: const Color(0xFFFFE500), width: 3.5),
                boxShadow: const [
                  BoxShadow(color: Color(0xFFFFE500), blurRadius: 12, spreadRadius: 1.5)
                ],
              );
            }

            final app = CyberPillMasterApp.of(context);
            final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
            final Color surface = palette['surface']!;
            final Color bg = palette['bg']!;
            final Color glow = customGlow ?? palette['accent']!;

            if (isPressed) {
              return BoxDecoration(
                color: surface.withOpacity(0.9),
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: glow.withOpacity(0.9), width: 2.2),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.95), offset: const Offset(4, 4), blurRadius: 10, spreadRadius: -1),
                  BoxShadow(color: glow.withOpacity(0.35), offset: const Offset(-1, -1), blurRadius: 6),
                ],
              );
            }

            return BoxDecoration(
              gradient: LinearGradient(
                colors: isMetallic
                    ? [surface.withOpacity(0.98), bg.withOpacity(0.9), surface.withOpacity(0.98)]
                    : [surface.withOpacity(0.92), bg.withOpacity(0.85)],
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
              ),
              borderRadius: BorderRadius.circular(radius),
              border: Border.all(color: glow.withOpacity(0.7), width: 1.8),
              boxShadow: [
                BoxShadow(color: Colors.black.withOpacity(0.95), offset: const Offset(0, 10), blurRadius: 22),
                BoxShadow(color: glow.withOpacity(0.35), offset: const Offset(-2, -2), blurRadius: 12),
                BoxShadow(color: glow.withOpacity(0.15), blurRadius: 16, spreadRadius: 2),
              ],
            );
          }

          class DynamicFuturisticBackground extends StatefulWidget {
            final Widget child;
            final Color accentColor;
            final bool isHighContrast;
            final String effectType;

            const DynamicFuturisticBackground({
              super.key,
              required this.child,
              required this.accentColor,
              required this.isHighContrast,
              required this.effectType,
            });

            @override
            State<DynamicFuturisticBackground> createState() => _DynamicFuturisticBackgroundState();
          }

          class _DynamicFuturisticBackgroundState extends State<DynamicFuturisticBackground> with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: this, duration: const Duration(seconds: 8))..repeat();
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) return widget.child;

              return AnimatedBuilder(
                animation: _anim,
                builder: (context, child) {
                  return CustomPaint(
                    painter: BackgroundFXPainter(
                      progress: _anim.value,
                      color: widget.accentColor,
                      effect: widget.effectType,
                    ),
                    child: widget.child,
                  );
                },
              );
            }
          }

          class BackgroundFXPainter extends CustomPainter {
            final double progress;
            final Color color;
            final String effect;

            BackgroundFXPainter({required this.progress, required this.color, required this.effect});

            @override
            void paint(Canvas canvas, Size size) {
              if (effect == 'hex') {
                final double r = 32.0;
                final double w = math.sqrt(3) * r;
                final double h = 2 * r * 0.75;
                final paint = Paint()
                  ..color = color.withOpacity(0.05)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.0;

                int row = 0;
                for (double y = -r; y < size.height + r; y += h, row++) {
                  double xOffset = (row % 2 == 0) ? 0 : w / 2;
                  for (double x = -w + xOffset; x < size.width + w; x += w) {
                    Path path = Path();
                    for (int i = 0; i < 6; i++) {
                      double angle = (60.0 * i - 30.0) * math.pi / 180.0;
                      double px = x + r * 0.5 * math.cos(angle);
                      double py = y + r * 0.5 * math.sin(angle);
                      if (i == 0) path.moveTo(px, py); else path.lineTo(px, py);
                    }
                    path.close();
                    canvas.drawPath(path, paint);
                  }
                }
              } else if (effect == 'wave') {
                for (int layer = 1; layer <= 3; layer++) {
                  final paint = Paint()
                    ..color = color.withOpacity(0.06 * layer)
                    ..style = PaintingStyle.fill;
                  final path = Path()..moveTo(0, size.height * 0.65);
                  for (double x = 0; x <= size.width; x += 12) {
                    double y = math.sin((x / size.width * (layer + 1) * math.pi) + (progress * 2 * math.pi)) * (15.0 * layer) +
                        math.cos((x / size.width * 2 * math.pi) + (progress * 2 * math.pi)) * 10 +
                        size.height * (0.7 + layer * 0.07);
                    path.lineTo(x, y);
                  }
                  path.lineTo(size.width, size.height);
                  path.lineTo(0, size.height);
                  path.close();
                  canvas.drawPath(path, paint);
                }
              } else if (effect == 'orbs') {
                for (int i = 0; i < 7; i++) {
                  double t = (progress + (i / 7.0)) % 1.0;
                  double cx = (math.sin(i * 1.5 + t * 2 * math.pi) * 0.4 + 0.5) * size.width;
                  double cy = (math.cos(i * 2.3 + t * 2 * math.pi) * 0.4 + 0.5) * size.height;
                  double r = 40.0 + (i % 4) * 20.0;
                  final orbPaint = Paint()
                    ..shader = RadialGradient(
                      colors: [color.withOpacity(0.22), color.withOpacity(0.0)],
                    ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: r));
                  canvas.drawCircle(Offset(cx, cy), r, orbPaint);
                }
              } else {
                final paint = Paint()
                  ..color = color.withOpacity(0.12)
                  ..strokeWidth = 1.3;

                double horizonY = size.height * 0.50;
                double speedOffset = (progress * 35);

                for (double y = horizonY; y <= size.height; y += 26) {
                  canvas.drawLine(Offset(0, y), Offset(size.width, y), paint);
                }
                for (double x = -size.width * 0.5; x <= size.width * 1.5; x += 36) {
                  canvas.drawLine(Offset(size.width * 0.5, horizonY), Offset(x + (speedOffset % 36), size.height), paint);
                }
              }
            }

            @override
            bool shouldRepaint(covariant BackgroundFXPainter oldDelegate) => true;
          }

