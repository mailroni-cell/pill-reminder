            ScheduleGroup({
              required this.id,
              required this.title,
              required this.hour,
              required this.minute,
              required this.pills,
              this.isTaken = false,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'hour': hour,
                  'minute': minute,
                  'pills': pills.map((p) => p.toJson()).toList(),
                  'isTaken': isTaken,
