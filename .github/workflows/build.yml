          // 3D Neumorphic / Rubber / Metallic Box Decoration Helper
          BoxDecoration cyber3D({
            required BuildContext context,
            double radius = 20,
            bool isPressed = false,
            bool highContrast = false,
            Color? customGlow,
            bool isMetallic = false,
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? const Color(0xFF2B2800) : Colors.black,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: const Color(0xFFFFE500), width: 3.5),
