            void _initTTS() async {
              final app = CyberPillMasterApp.of(context);
              Map<String, String> langMap = {
                'he': 'he-IL', 'en': 'en-US', 'ar': 'ar-SA',
                'ru': 'ru-RU', 'fr': 'fr-FR', 'es': 'es-ES'
              };
              await flutterTts.setLanguage(langMap[app.currentLang] ?? 'he-IL');
              await flutterTts.setSpeechRate(0.48);
              await flutterTts.setVolume(app.soundVolume);
            }

            void _startLiveReminderMonitor() {
              _alarmCheckTimer = Timer.periodic(const Duration(seconds: 30), (timer) {
                final now = DateTime.now();
                for (var sched in _schedules) {
                  if (!sched.isTaken && sched.hour == now.hour && sched.minute == now.minute) {
                    _triggerHeadsUpAlert(sched);
                    break;
                  }
                }
              });
            }

            void _previewScheduleAudio(ScheduleGroup sched) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              String pillNames = sched.pills.map((p) => '${p.name} במינון ${p.dosage}').join(', ');
              String ttsTemplate = t['tts_alert'] ?? 'תזכורת. הגיע הזמן לקחת את התרופה: {pills}';
              String speechText = ttsTemplate.replaceAll('{pills}', pillNames);

              SoundGenerator.playAlertTone(
                app.soundType,
                app.soundVolume,
                voiceText: speechText,
                lang: app.currentLang,
              );
            }

            void _triggerHeadsUpAlert(ScheduleGroup sched) async {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;

              String pillNames = sched.pills.map((p) => '${p.name} במינון ${p.dosage}').join(', ');
              String ttsTemplate = t['tts_alert'] ?? 'תזכורת. הגיע הזמן לקחת את התרופה: {pills}';
              String speechText = ttsTemplate.replaceAll('{pills}', pillNames);

              // High-Importance Android Heads-Up Notification (Importance.max, Priority.high)
              try {
                const AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                  'cyber_pharma_critical_alerts',
                  'Cyber Pharma Critical Reminders',
                  channelDescription: 'High priority alerts for medicine reminders',
                  importance: Importance.max,
                  priority: Priority.high,
                  ticker: 'Cyber Pharma Reminder Alert',
                  icon: '@drawable/ic_launcher_cyber',
                  fullScreenIntent: true,
                  enableVibration: true,
                  playSound: true,
                );
                const NotificationDetails notifDetails = NotificationDetails(android: androidDetails);
                await flutterNotifications.show(
                  sched.id.hashCode,
                  '🚨 ${t['app_title'] ?? 'CYBER PHARMA 3D'}',
                  speechText,
                  notifDetails,
                );
              } catch (e) {
                debugPrint('Notification error: $e');
              }

              // Vibration & Alert Tone / TTS strictly at reminder moment
              HapticFeedback.heavyImpact();
              SoundGenerator.playAlertTone(
                app.soundType,
                app.soundVolume,
                voiceText: app.voiceAlerts ? speechText : null,
                lang: app.currentLang,
              );

              _show3DHeadsUpDialog(sched);
            }

