          class Medicine {
            String id;
            String name;
            int dosage;
            int hour;
            int minute;
            int stock;
            bool isTaken;

            Medicine({
              required this.id,
              required this.name,
              required this.dosage,
              required this.hour,
              required this.minute,
              required this.stock,
              this.isTaken = false,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'name': name,
                  'dosage': dosage,
                  'hour': hour,
                  'minute': minute,
                  'stock': stock,
                  'isTaken': isTaken,
                };

            factory Medicine.fromMap(Map<String, dynamic> map) => Medicine(
                  id: map['id'],
                  name: map['name'],
                  dosage: map['dosage'] ?? 1,
                  hour: map['hour'],
                  minute: map['minute'],
                  stock: map['stock'],
                  isTaken: map['isTaken'] ?? false,
                );
          }

          class MainPillScreen extends StatefulWidget {
            final AppSettingsState settings;
            const MainPillScreen({super.key, required this.settings});

            @override
            State<MainPillScreen> createState() => _MainPillScreenState();
          }

          class _MainPillScreenState extends State<MainPillScreen> {
            List<Medicine> _medicines = [];

            @override
            void initState() {
              super.initState();
              _loadMedicines();
              _setupTts();
            }

            void _setupTts() async {
              Map<String, String> langMap = {
                'he': 'he-IL',
                'en': 'en-US',
                'ru': 'ru-RU',
                'ro': 'ro-RO',
                'ar': 'ar-SA',
                'de': 'de-DE',
              };
              await flutterTts.setLanguage(langMap[widget.settings.lang] ?? 'en-US');
              await flutterTts.setSpeechRate(widget.settings.voiceRate);
            }

            Future<void> _loadMedicines() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_medicines_v3');
              if (data != null) {
                final List decoded = jsonDecode(data);
                setState(() {
                  _medicines = decoded.map((e) => Medicine.fromMap(e)).toList();
                });
              }
            }

            Future<void> _saveMedicines() async {
              final prefs = await SharedPreferences.getInstance();
              final String encoded =
                  jsonEncode(_medicines.map((m) => m.toMap()).toList());
              await prefs.setString('saved_medicines_v3', encoded);
            }

            void _speakAlert(Medicine med) async {
              if (!widget.settings.voiceAlerts) return;
              final t = translations[widget.settings.lang]!;
              String phrase = t['tts_phrase']!
                  .replaceAll('{name}', med.name)
                  .replaceAll('{dosage}', med.dosage.toString());
              await flutterTts.speak(phrase);
            }

            void _toggleTaken(Medicine med) {
              setState(() {
                med.isTaken = !med.isTaken;
                if (med.isTaken) {
                  if (med.stock >= med.dosage) {
                    med.stock -= med.dosage;
                  }
                  _speakAlert(med);
                } else {
                  med.stock += med.dosage;
                }
              });
              _saveMedicines();
            }

            void _deleteMedicine(String id) {
              flutterLocalNotificationsPlugin.cancel(id.hashCode);
              setState(() {
                _medicines.removeWhere((m) => m.id == id);
              });
              _saveMedicines();
            }

