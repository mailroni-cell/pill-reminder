          class _CyberPillMasterAppState extends State<CyberPillMasterApp> {
            String _lang = 'he';
            String _userName = '';
            bool _voiceAlerts = true;
            bool _highContrast = false;
            String _soundType = 'electric';
            double _soundVolume = 1.0;
            String _themeKey = 'cyber';
            String _bgEffect = 'grid';
            bool _firstRun = true;
            bool _initialized = false;
            Key _appKey = UniqueKey();

            String get currentLang => _lang;
            String get userName => _userName;
            bool get voiceAlerts => _voiceAlerts;
            bool get highContrast => _highContrast;
            String get soundType => _soundType;
            double get soundVolume => _soundVolume;
            String get themeKey => _themeKey;
            String get bgEffect => _bgEffect;

            @override
            void initState() {
              super.initState();
              _loadConfig();
            }

            Future<void> _loadConfig() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _lang = prefs.getString('c_lang') ?? 'he';
                _userName = prefs.getString('c_user_name') ?? '';
                _voiceAlerts = prefs.getBool('c_voice') ?? true;
                _highContrast = prefs.getBool('c_hc') ?? false;
                _soundType = prefs.getString('c_sound') ?? 'electric';
                _soundVolume = prefs.getDouble('c_volume') ?? 1.0;
                _themeKey = prefs.getString('c_theme') ?? 'cyber';
                _bgEffect = prefs.getString('c_bgeffect') ?? 'grid';
                _firstRun = prefs.getBool('c_first_run') ?? true;
                _initialized = true;
              });
            }

            void setLanguage(String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_lang', lang);
              HapticFeedback.mediumImpact();
              setState(() {
                _lang = lang;
                _appKey = UniqueKey();
              });
            }

            void completeOnboarding(String name, String lang) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_user_name', name);
              await prefs.setString('c_lang', lang);
              await prefs.setBool('c_first_run', false);
              HapticFeedback.heavyImpact();
              setState(() {
                _userName = name;
                _lang = lang;
                _firstRun = false;
                _appKey = UniqueKey();
              });
            }

            void setThemeKey(String key) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_theme', key);
              HapticFeedback.lightImpact();
              setState(() => _themeKey = key);
            }

            void setBgEffect(String effect) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_bgeffect', effect);
              HapticFeedback.lightImpact();
              setState(() => _bgEffect = effect);
            }

            void updateSettings({bool? voice, bool? hc, String? sound, double? volume}) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (voice != null) {
                  _voiceAlerts = voice;
                  prefs.setBool('c_voice', voice);
                }
                if (hc != null) {
                  _highContrast = hc;
                  prefs.setBool('c_hc', hc);
                }
                if (sound != null) {
                  _soundType = sound;
                  prefs.setString('c_sound', sound);
                }
                if (volume != null) {
                  _soundVolume = volume;
                  prefs.setDouble('c_volume', volume);
                }
              });

              if (sound != null || volume != null) {
                SoundGenerator.playAlertTone(_soundType, _soundVolume);
              } else {
                HapticFeedback.mediumImpact();
              }
            }

            @override
            Widget build(BuildContext context) {
              if (!_initialized) return const SizedBox();

              final bool isRtl = _lang == 'he' || _lang == 'ar';
              final palette = themePalettes[_themeKey] ?? themePalettes['cyber']!;
              final Color primary = _highContrast ? const Color(0xFFFFE500) : palette['accent']!;

              return KeyedSubtree(
                key: _appKey,
                child: MaterialApp(
                  title: 'CYBER PHARMA 3D',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    useMaterial3: true,
                    scaffoldBackgroundColor: Colors.transparent,
                    colorSchemeSeed: primary,
                    fontFamily: 'sans-serif-medium',
                  ),
                  home: Directionality(
                    textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                    child: _firstRun ? const FirstTimeSetupScreen() : const MainDashboard(),
                  ),
                ),
              );
            }
          }

