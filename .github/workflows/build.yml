          class Pneumatic3DButton extends StatefulWidget {
          final Widget child;
          final VoidCallback onTap;
          final double height;
          final double? width;
          final double depth;
          final ThemePalette palette;
          final Color? customGlow;
          final bool isPushed;
          final bool enablePulse;

          const Pneumatic3DButton({
          super.key,
          required this.child,
          required this.onTap,
          required this.palette,
          this.height = 56,
          this.width,
          this.depth = 4.5,
          this.customGlow,
          this.isPushed = false,
          this.enablePulse = true,
          });

          @override
          State<Pneumatic3DButton> createState() => _Pneumatic3DButtonState();
          }

          class _Pneumatic3DButtonState extends State<Pneumatic3DButton> with TickerProviderStateMixin {
          late final AnimationController _pressAnim;
          late final AnimationController _pulseAnim;
          late final Animation<double> _scaleAnimation;
          late final Animation<double> _depthAnimation;
          bool _isTappedDown = false;

          @override
          void initState() {
          super.initState();
          _pressAnim = AnimationController(
          vsync: this,
          duration: const Duration(milliseconds: 70),
          reverseDuration: const Duration(milliseconds: 140),
          );
          _scaleAnimation = Tween<double>(begin: 1.0, end: 0.94).animate(
          CurvedAnimation(parent: _pressAnim, curve: Curves.easeOutQuad, reverseCurve: Curves.easeOutBack),
          );
          _depthAnimation = Tween<double>(begin: 0.0, end: widget.depth).animate(
          CurvedAnimation(parent: _pressAnim, curve: Curves.easeInOut),
          );

          _pulseAnim = AnimationController(
          vsync: this,
          duration: const Duration(milliseconds: 2000),
          );
          if (widget.enablePulse) {
          _pulseAnim.repeat(reverse: true);
          }

          if (widget.isPushed) {
          _pressAnim.value = 1.0;
          }
          }

          @override
          void didUpdateWidget(covariant Pneumatic3DButton oldWidget) {
          super.didUpdateWidget(oldWidget);
          if (widget.isPushed != oldWidget.isPushed) {
          if (widget.isPushed) {
          _pressAnim.forward();
          } else if (!_isTappedDown) {
          _pressAnim.reverse();
          }
          }
          if (widget.enablePulse != oldWidget.enablePulse) {
          if (widget.enablePulse) {
          _pulseAnim.repeat(reverse: true);
          } else {
          _pulseAnim.stop();
          }
          }
          }

          @override
          void dispose() {
          _pressAnim.dispose();
          _pulseAnim.dispose();
          super.dispose();
          }

          void _handleTapDown() {
          _isTappedDown = true;
          HapticFeedback.lightImpact();
          _pressAnim.forward();
          }

          void _handleTapUp() {
          _isTappedDown = false;
          if (!widget.isPushed) {
          _pressAnim.reverse();
          }
          HapticFeedback.mediumImpact();
          widget.onTap();
          }

          void _handleTapCancel() {
          _isTappedDown = false;
          if (!widget.isPushed) {
          _pressAnim.reverse();
          }
          }

          @override
          Widget build(BuildContext context) {
          final glowColor = widget.customGlow ?? widget.palette.glow;

          return GestureDetector(
          onTapDown: (_) => _handleTapDown(),
          onTapUp: (_) => _handleTapUp(),
          onTapCancel: _handleTapCancel,
          child: AnimatedBuilder(
          animation: Listenable.merge([_pressAnim, _pulseAnim]),
          builder: (context, child) {
          final double t = _pressAnim.value;
          final double pulse = _pulseAnim.value;
          final double currentDepth = _depthAnimation.value;
          final double currentScale = _scaleAnimation.value;
          final double ambientGlow = 0.20 + (0.25 * pulse) + (0.45 * t);

          return Transform.scale(
            scale: currentScale,
            child: Container(
              height: widget.height,
              width: widget.width,
              transform: Matrix4.translationValues(0, currentDepth, 0),
              decoration: BoxDecoration(
                borderRadius: BorderRadius.circular(16),
                gradient: LinearGradient(
                  begin: Alignment.topCenter,
                  end: Alignment.bottomCenter,
                  colors: [
                    Color.lerp(widget.palette.surface, widget.palette.bevelDark, t)!,
                    Color.lerp(widget.palette.chassis, widget.palette.surface, t)!,
                  ],
                ),
                border: Border.all(
                  color: Color.lerp(
                    widget.palette.bevelLight.withOpacity(0.7 + 0.3 * pulse),
                    glowColor,
                    t,
                  )!,
                  width: 1.8 + (1.0 * t),
                ),
                boxShadow: [
                  // Physical underside drop shadow
                  BoxShadow(
                    color: Colors.black.withOpacity(0.95 * (1.0 - 0.4 * t)),
                    offset: Offset(0, widget.depth * (1.0 - t) + 2),
                    blurRadius: 5 * (1.0 - 0.4 * t),
                  ),
                  // Living neon pulse aura (ambient + active press burst)
                  BoxShadow(
                    color: glowColor.withOpacity(ambientGlow.clamp(0.0, 1.0)),
                    offset: Offset(0, 2 * (1.0 - t)),
                    blurRadius: 8 + (10 * pulse) + (14 * t),
                    spreadRadius: (1.2 * pulse) + (2.0 * t),
                  ),
                ],
              ),
              child: child,
            ),
          );
          },
          child: Material(
          type: MaterialType.transparency,
          child: DefaultTextStyle(
            style: TextStyle(
              decoration: TextDecoration.none,
              color: widget.palette.highlight,
              fontWeight: FontWeight.bold,
            ),
            child: Center(child: widget.child),
          ),
          ),
          ),
          );
          }
          }

