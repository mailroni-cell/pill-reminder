      - name: Configure Android Manifest, Desugaring and Kotlin Flags
        run: |
          mkdir -p android
          echo "android.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="geo" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="waze" />
                  </intent>
                  <package android:name="com.waze" />
                  <package android:name="com.google.android.apps.maps" />
              </queries>

              <application
                  android:label="CYBER PHARMA 3D"
                  android:name="${applicationName}"
                  android:icon="@drawable/ic_launcher_cyber">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          python3 -c '
          import os, re
          fpath_kts = "android/app/build.gradle.kts"
          fpath_g = "android/app/build.gradle"
          if os.path.exists(fpath_kts):
              with open(fpath_kts, "r") as f:
                  txt = f.read()
              if "compileOptions {" in txt:
                  txt = txt.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              txt = re.sub(r"compileSdk\s*=\s*[0-9]+", "compileSdk = 36", txt)
              txt += "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
              with open(fpath_kts, "w") as f:
                  f.write(txt)
          elif os.path.exists(fpath_g):
              with open(fpath_g, "r") as f:
                  txt = f.read()
              if "compileOptions {" in txt:
                  txt = txt.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              txt = re.sub(r"compileSdkVersion\s+[0-9]+", "compileSdkVersion 36", txt)
              txt = re.sub(r"compileSdk\s*=\s*[0-9]+", "compileSdk = 36", txt)
              txt += "\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"
              with open(fpath_g, "w") as f:
                  f.write(txt)

          root_kts = "android/build.gradle.kts"
          root_g = "android/build.gradle"
          if os.path.exists(root_g):
              with open(root_g, "a") as f:
                  f.write("\nsubprojects {\n    afterEvaluate { project ->\n        if (project.hasProperty(\"android\")) {\n            project.android {\n                compileSdkVersion 36\n            }\n        }\n    }\n}\n")
          '

      - name: Create pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: Ultra-Realistic Heavy Industrial 3D Hardware Medical Console
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
            audioplayers: ^6.0.0
            path_provider: ^2.1.4
            url_launcher: ^6.3.0
            permission_handler: ^11.3.1
            file_picker: ^8.1.2
          flutter:
            uses-material-design: true
          EOF

      - name: Create lib/main.dart
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:file_picker/file_picker.dart';
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'dart:ui';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:flutter/cupertino.dart' hide TextDirection;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;
          import 'package:url_launcher/url_launcher.dart';

          final FlutterLocalNotificationsPlugin flutterNotifications = FlutterLocalNotificationsPlugin();
          final FlutterTts flutterTts = FlutterTts();
          final AudioPlayer audioPlayer = AudioPlayer();

          class SoundGenerator {
            static Uint8List createToneWav(
              double frequency,
              double durationSeconds, {
              String type = 'sine',
              double volume = 1.0,
              double endFrequency = 0.0,
            }) {
              final int sampleRate = 22050;
              final int numSamples = (sampleRate * durationSeconds).toInt();
              final int dataLength = numSamples * 2;
              final int bufferLength = 44 + dataLength;

              final ByteData buffer = ByteData(bufferLength);
              // RIFF header
              buffer.setUint8(0, 0x52); buffer.setUint8(1, 0x49); buffer.setUint8(2, 0x46); buffer.setUint8(3, 0x46);
              buffer.setUint32(4, 36 + dataLength, Endian.little);
              buffer.setUint8(8, 0x57); buffer.setUint8(9, 0x41); buffer.setUint8(10, 0x56); buffer.setUint8(11, 0x45);
              // fmt chunk
              buffer.setUint8(12, 0x66); buffer.setUint8(13, 0x6D); buffer.setUint8(14, 0x74); buffer.setUint8(15, 0x20);
              buffer.setUint32(16, 16, Endian.little);
              buffer.setUint16(20, 1, Endian.little); // PCM
              buffer.setUint16(22, 1, Endian.little); // mono
              buffer.setUint32(24, sampleRate, Endian.little);
              buffer.setUint32(28, sampleRate * 2, Endian.little);
              buffer.setUint16(32, 2, Endian.little);
              buffer.setUint16(34, 16, Endian.little); // 16-bit
              // data chunk
              buffer.setUint8(36, 0x64); buffer.setUint8(37, 0x61); buffer.setUint8(38, 0x74); buffer.setUint8(39, 0x61);
              buffer.setUint32(40, dataLength, Endian.little);

              final double effectiveVol = volume.clamp(0.0, 1.0);
              int offset = 44;
              for (int i = 0; i < numSamples; i++) {
                double t = i / sampleRate;
                double progress = t / durationSeconds;
                double currentFreq = frequency;
                if (endFrequency > 0.0) {
                  currentFreq = frequency + (endFrequency - frequency) * progress;
                }

                double attack = (progress * 30.0).clamp(0.0, 1.0);
                double decay = math.exp(-3.2 * progress);
                double ampEnvelope = attack * decay;

                double sample = 0.0;
                if (type == 'square') {
                  sample = math.sin(2 * math.pi * currentFreq * t) >= 0 ? 0.55 : -0.55;
                  ampEnvelope = (progress * 20.0).clamp(0.0, 1.0) * math.exp(-2.2 * progress);
                } else if (type == 'sawtooth') {
                  sample = (2.0 * (t * currentFreq - (t * currentFreq).floor()) - 1.0) * 0.45;
                } else if (type == 'triangle') {
                  sample = (2.0 * (2.0 * (t * currentFreq - (t * currentFreq).floor()) - 1.0).abs() - 1.0) * 0.65;
                } else if (type == 'chime') {
                  sample = 0.40 * math.sin(2 * math.pi * currentFreq * t) +
                 0.30 * math.sin(2 * math.pi * currentFreq * 1.25 * t) +
                 0.20 * math.sin(2 * math.pi * currentFreq * 1.50 * t) +
                 0.10 * math.sin(2 * math.pi * currentFreq * 2.00 * t);
                  ampEnvelope = attack * math.exp(-2.5 * progress);
                } else if (type == 'radar') {
                  double f = 450.0 + 850.0 * math.pow(progress, 1.4);
                  sample = math.sin(2 * math.pi * f * t) * 0.70;
                  ampEnvelope = (1.0 - progress);
                } else if (type == 'sonar') {
                  sample = math.sin(2 * math.pi * 380.0 * t) * 0.80;
                  ampEnvelope = (progress < 0.08 ? progress * 12.5 : math.exp(-3.5 * (progress - 0.08)));
                } else if (type == 'laser') {
                  double f = 1950.0 * math.exp(-5.5 * progress) + 160.0;
                  sample = math.sin(2 * math.pi * f * t) * 0.75;
                  ampEnvelope = (1.0 - progress);
                } else if (type == 'telemetry') {
                  double cycle = (t * 6.0) % 1.0;
                  bool beepOn = cycle < 0.45 && t < 0.7;
                  sample = beepOn ? (math.sin(2 * math.pi * 1760.0 * t) * 0.65) : 0.0;
                  ampEnvelope = 1.0;
                } else if (type == 'klaxon') {
                  double f = (t * 5.0).toInt() % 2 == 0 ? 600.0 : 880.0;
                  sample = (math.sin(2 * math.pi * f * t) >= 0 ? 0.55 : -0.55);
                  ampEnvelope = 0.9;
                } else if (type == 'harp') {
                  int noteIdx = (progress * 4).toInt().clamp(0, 3);
                  double mult = [1.0, 1.25, 1.5, 2.0][noteIdx];
                  double noteProgress = (progress * 4) - noteIdx;
                  sample = math.sin(2 * math.pi * (currentFreq * mult) * t) * 0.75;
                  ampEnvelope = math.exp(-3.2 * noteProgress);
                } else if (type == 'water') {
                  double f = 550.0 + 850.0 * math.sin(progress * math.pi);
                  sample = math.sin(2 * math.pi * f * t) * 0.70;
                  ampEnvelope = math.sin(progress * math.pi);
                } else if (type == 'synthwave') {
                  sample = 0.40 * (2.0 * (t * currentFreq - (t * currentFreq).floor()) - 1.0) +
                 0.30 * (2.0 * (t * currentFreq * 1.5 - (t * currentFreq * 1.5).floor()) - 1.0) +
                 0.30 * math.sin(2 * math.pi * currentFreq * 2.0 * t);
                  ampEnvelope = (progress < 0.1 ? progress / 0.1 : math.exp(-2.2 * (progress - 0.1)));
                } else {
                  sample = math.sin(2 * math.pi * currentFreq * t) * 0.75;
                }

                double finalSample = sample * ampEnvelope * effectiveVol;
                int intSample = (finalSample * 32767.0).toInt().clamp(-32768, 32767);
                buffer.setInt16(offset, intSample, Endian.little);
                offset += 2;
              }
              return buffer.buffer.asUint8List();
            }

            static Future<void> playAlertTone(
              String soundType,
              double volume, {
              String? voiceText,
              String lang = 'he',
              String? customFilePath,
            }) async {
              try {
                await audioPlayer.stop();
                await flutterTts.stop();

                final double safeVol = volume.clamp(0.0, 1.0);

                // Play custom audio file from phone if selected
                if (soundType == 'custom') {
                  if (customFilePath != null && customFilePath.isNotEmpty) {
                    final f = File(customFilePath);
                    if (await f.exists()) {
                      await audioPlayer.setVolume(safeVol);
                      await audioPlayer.play(DeviceFileSource(customFilePath));
                      return;
                    }
                  }
                  final fallbackBytes = createToneWav(523.25, 0.8, type: 'chime', volume: safeVol);
                  await audioPlayer.setVolume(safeVol);
                  await audioPlayer.play(BytesSource(fallbackBytes), volume: safeVol);
                  return;
                }

                if (soundType == 'voice') {
                  Map<String, String> langMap = {
          'he': 'he-IL', 'en': 'en-US', 'ar': 'ar-SA',
          'ru': 'ru-RU', 'fr': 'fr-FR', 'es': 'es-ES'
                  };
                  String targetLocale = langMap[lang] ?? 'he-IL';
                  String textToSpeak = (voiceText != null && voiceText.trim().isNotEmpty)
            ? voiceText.trim()
            : (lang == 'he' ? 'חיווי קולי פעיל: מערכת תזכורות פועלת כשורה' :
               lang == 'ar' ? 'التنبيه الصوتي نشط: نظام التذكير يعمل بشكل صحيح' :
               lang == 'ru' ? 'Голосовое оповещение активно: напоминания работают нормально' :
               lang == 'fr' ? 'Alerte vocale active: le système fonctionne correctement' :
               lang == 'es' ? 'Alerta de voz activa: el sistema funciona correctamente' :
               'Voice alert active: reminder system operating normally');

                  try {
          await flutterTts.awaitSynthCompletion(true);
          await flutterTts.setLanguage(targetLocale);
          await flutterTts.setVolume(safeVol);
          await flutterTts.setSpeechRate(0.48);
          final dynamic res = await flutterTts.speak(textToSpeak);
          if (res != 1 && res != '1' && res != true) {
            final fallbackBytes = createToneWav(587.33, 0.8, type: 'chime', volume: safeVol);
            await audioPlayer.setVolume(safeVol);
            await audioPlayer.play(BytesSource(fallbackBytes), volume: safeVol);
          }
                  } catch (e) {
          debugPrint('TTS speak error, falling back to chime: $e');
          final fallbackBytes = createToneWav(587.33, 0.8, type: 'chime', volume: safeVol);
          await audioPlayer.setVolume(safeVol);
          await audioPlayer.play(BytesSource(fallbackBytes), volume: safeVol);
                  }
                  return;
                }

                Uint8List wavBytes;
                switch (soundType) {
                  case 'chime':
          wavBytes = createToneWav(523.25, 0.9, type: 'chime', volume: safeVol);
          break;
                  case 'electric':
          wavBytes = createToneWav(880.0, 0.5, type: 'sawtooth', volume: safeVol);
          break;
                  case 'gong':
          wavBytes = createToneWav(220.0, 1.4, type: 'sine', volume: safeVol);
          break;
                  case 'alarm':
          wavBytes = createToneWav(1050.0, 0.6, type: 'square', volume: safeVol);
          break;
                  case 'bell':
          wavBytes = createToneWav(1046.5, 0.8, type: 'triangle', volume: safeVol);
          break;
                  case 'radar':
          wavBytes = createToneWav(400.0, 0.7, type: 'radar', volume: safeVol);
          break;
                  case 'sonar':
          wavBytes = createToneWav(380.0, 1.1, type: 'sonar', volume: safeVol);
          break;
                  case 'laser':
          wavBytes = createToneWav(1950.0, 0.6, type: 'laser', volume: safeVol);
          break;
                  case 'space':
          wavBytes = createToneWav(440.0, 1.2, type: 'chime', volume: safeVol);
          break;
                  case 'telemetry':
          wavBytes = createToneWav(1760.0, 0.7, type: 'telemetry', volume: safeVol);
          break;
                  case 'klaxon':
          wavBytes = createToneWav(650.0, 0.8, type: 'klaxon', volume: safeVol);
          break;
                  case 'harp':
          wavBytes = createToneWav(440.0, 1.0, type: 'harp', volume: safeVol);
          break;
                  case 'digital_drop':
          wavBytes = createToneWav(600.0, 0.6, type: 'water', volume: safeVol);
          break;
                  case 'synth_wave':
          wavBytes = createToneWav(330.0, 1.1, type: 'synthwave', volume: safeVol);
          break;
                  default:
          wavBytes = createToneWav(523.25, 0.7, type: 'chime', volume: safeVol);
          break;
                }

                await audioPlayer.setVolume(safeVol);
                await audioPlayer.play(BytesSource(wavBytes), volume: safeVol);
              } catch (e) {
                debugPrint('Audio playback error: $e');
              }
            }
          }

          class ThemePalette {
            final String id;
            final String name;
            final Color background;
            final Color chassis;
            final Color surface;
            final Color primary;
            final Color highlight;
            final Color bevelLight;
            final Color bevelDark;
            final Color glow;
            final Color ledColor;
            final Color textColor;
            final Color textAccent;
            final Color textSecondary;
            final List<Color> borderGradient;

            const ThemePalette({
              required this.id,
              required this.name,
              required this.background,
              required this.chassis,
              required this.surface,
              required this.primary,
              required this.highlight,
              required this.bevelLight,
              required this.bevelDark,
              required this.glow,
              required this.ledColor,
              this.textColor = const Color(0xFFF8FAFC),
              this.textAccent = const Color(0xFF00F0FF),
              this.textSecondary = const Color(0xFF94A3B8),
              this.borderGradient = const [Color(0xFF00F5FF), Color(0xFFFF007F), Color(0xFF00F5FF)],
            });
          }

          final Map<String, ThemePalette> themePalettes = {
            'cyber_neon': const ThemePalette(
              id: 'cyber_neon',
              name: '1. סייבר ניאון פלואורסצנטי',
              background: Color(0xFF020108),
              chassis: Color(0xFF0A0314),
              surface: Color(0xFF130724),
              primary: Color(0xFF00F5FF),
              highlight: Color(0xFFFF007F),
              bevelLight: Color(0xFF38BDF8),
              bevelDark: Color(0xFF05010B),
              glow: Color(0xFF00F5FF),
              ledColor: Color(0xFF00FF66),
              textColor: Color(0xFFFFFFFF),
              textAccent: Color(0xFF00F5FF),
              textSecondary: Color(0xFFE2E8F0),
              borderGradient: [Color(0xFF00F5FF), Color(0xFFFF007F), Color(0xFF00E5FF)],
            ),
            'industrial_green': const ThemePalette(
              id: 'industrial_green',
              name: '2. ירוק טוקסיק מטריקס',
              background: Color(0xFF010603),
              chassis: Color(0xFF021609),
              surface: Color(0xFF062B12),
              primary: Color(0xFF00FF66),
              highlight: Color(0xFFCCFF00),
