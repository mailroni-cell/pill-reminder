                                        customGlow: active ? p.glow : Colors.transparent,
                                        onTap: () {
                                          app.setThemeKey(p.id);
                                          setDlg(() {});
                                        },
                                        child: Column(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            Row(
                                              mainAxisAlignment: MainAxisAlignment.center,
                                              children: [
