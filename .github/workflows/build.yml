            });

            @override
            State<Pneumatic3DButton> createState() => _Pneumatic3DButtonState();
          }

          class _Pneumatic3DButtonState extends State<Pneumatic3DButton> with SingleTickerProviderStateMixin {
            bool _down = false;
            late AnimationController _animController;
            late Animation<double> _scaleAnimation;

            @override
            void initState() {
              super.initState();
              _animController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 90),
              );
              _scaleAnimation = Tween<double>(begin: 1.0, end: 0.96).animate(
                CurvedAnimation(parent: _animController, curve: Curves.easeInOut),
              );
            }

            @override
            void dispose() {
              _animController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final glowColor = widget.customGlow ?? widget.palette.glow;
              final bool pressed = _down || widget.isPushed;
              final double currentOffset = pressed ? widget.depth : 0.0;

              return GestureDetector(
                onTapDown: (_) {
                  setState(() => _down = true);
                  _animController.forward();
                  HapticFeedback.heavyImpact();
                },
                onTapUp: (_) {
                  setState(() => _down = false);
                  _animController.reverse();
                  HapticFeedback.lightImpact();
                  widget.onTap();
                },
                onTapCancel: () {
                  setState(() => _down = false);
                  _animController.reverse();
                },
                child: AnimatedBuilder(
                  animation: _animController,
                  builder: (ctx, ch) => Transform.scale(
                    scale: _scaleAnimation.value,
                    child: AnimatedContainer(
                      duration: const Duration(milliseconds: 90),
                      curve: Curves.easeOutQuad,
                      height: widget.height,
                      width: widget.width,
                      transform: Matrix4.translationValues(0, currentOffset, 0),
                      decoration: BoxDecoration(
                        borderRadius: BorderRadius.circular(18),
                        gradient: LinearGradient(
                          begin: Alignment.topLeft,
                          end: Alignment.bottomRight,
                          colors: pressed
                              ? [
                                  widget.palette.bevelDark,
                                  widget.palette.surface,
                                  widget.palette.chassis,
                                ]
                              : [
                                  widget.palette.surface,
                                  widget.palette.chassis,
                                  widget.palette.bevelDark,
                                ],
                        ),
                        border: Border.all(
                          color: pressed ? glowColor : widget.palette.primary.withOpacity(0.9),
                          width: pressed ? 2.6 : 2.0,
                        ),
                        boxShadow: pressed
                            ? [
                                BoxShadow(
                                  color: glowColor.withOpacity(0.9),
                                  blurRadius: 18,
                                  spreadRadius: 2,
                                ),
                                BoxShadow(
                                  color: Colors.black.withOpacity(0.95),
                                  offset: const Offset(0, 2),
                                  blurRadius: 4,
                                ),
                              ]
                            : [
                                BoxShadow(
                                  color: Colors.black.withOpacity(0.95),
                                  offset: Offset(0, widget.depth + 3),
                                  blurRadius: 10,
                                ),
                                BoxShadow(
                                  color: glowColor.withOpacity(0.6),
                                  offset: Offset(0, widget.depth * 0.6),
                                  blurRadius: 16,
                                  spreadRadius: 1,
                                ),
                                BoxShadow(
                                  color: Colors.white.withOpacity(0.4),
                                  offset: const Offset(0, -1.5),
                                  blurRadius: 1.5,
                                ),
                              ],
                      ),
                      child: widget.child,
                    ),
                  ),
                ),
              );
            }
          }
