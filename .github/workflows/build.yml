                                textChannel3D(
                                  'CYBER PHARMA 3D',
                                  fontSize: 32,
                                  color: Colors.white,
                                  glowColor: palette.primary,
                                ),
                                const SizedBox(height: 12),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                                  decoration: BoxDecoration(
                                    color: palette.chassis.withOpacity(0.85),
                                    borderRadius: BorderRadius.circular(20),
                                    border: Border.all(color: palette.highlight, width: 2.0),
                                    boxShadow: [
                                      BoxShadow(color: palette.glow.withOpacity(0.4), blurRadius: 18),
                                    ],
                                  ),
                                  child: textChannel3D(
                                    'נוצר ופותח על ידי רוני שניידר',
                                    fontSize: 16,
