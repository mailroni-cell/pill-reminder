name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Skeleton
        run: |
          flutter create --org com.cyberpharma.app --project-name pill_reminder . --platforms=android --overwrite

      - name: Setup Futuristic App Icon
        run: |
          ICON_DIR="android/app/src/main/res/drawable"
          mkdir -p $ICON_DIR
          cat << 'EOF' > $ICON_DIR/ic_launcher_cyber.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#090D16"
                  android:pathData="M0,0h108v108h-108z"/>
              <!-- Glowing Capsule Base -->
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M40,24h28a16,16 0 0,1 16,16v20a0,0 0 0,1 0,0h-60a0,0 0 0,1 0,0v-20a16,16 0 0,1 16,-16z"/>
              <!-- Pill Bottom Glow -->
              <path
                  android:fillColor="#A855F7"
                  android:pathData="M24,60h60a0,0 0 0,1 0,0v20a16,16 0 0,1 -16,16h-28a16,16 0 0,1 -16,-16v-20a0,0 0 0,1 0,0z"/>
              <!-- Energy Divider -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,58h64v4h-64z"/>
          </vector>
          EOF
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/ic_launcher_cyber"/g' android/app/src/main/AndroidManifest.xml

      - name: Configure Android Permissions and Desugaring
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          
          python3 -c "
          import os
          fpath = 'android/app/build.gradle.kts'
          if os.path.exists(fpath):
              with open(fpath, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              txt += '\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              with open(fpath, 'w') as f:
                  f.write(txt)
          else:
              fpath_g = 'android/app/build.gradle'
              with open(fpath_g, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              txt += '\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
              with open(fpath_g, 'w') as f:
                  f.write(txt)
          "

      - name: Create pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: Ultra Futuristic 3D Cyber Pill Reminder
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
            url_launcher: ^6.3.0
          flutter:
            uses-material-design: true
          EOF

      - name: Create lib/main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/cupertino.dart' hide TextDirection;
