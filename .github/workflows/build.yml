            void _initTTS() async {
              await flutterTts.setLanguage('he-IL');
              await flutterTts.setSpeechRate(0.45);
            }

            Future<void> _loadData() async {
              final prefs = await SharedPreferences.getInstance();
              final String? schedsRaw = prefs.getString('c_multi_scheds_store_v6');
              if (schedsRaw != null) {
                final List decoded = jsonDecode(schedsRaw);
                setState(() => _schedules = decoded.map((e) => ScheduleGroup.fromMap(e)).toList());
              }
              final String? appsRaw = prefs.getString('c_apps_store_v6');
              if (appsRaw != null) {
                final List decodedA = jsonDecode(appsRaw);
                setState(() => _apps = decodedA.map((e) => AppointmentModel.fromMap(e)).toList());
              }
              final String? logsRaw = prefs.getString('c_adherence_logs_v1');
              if (logsRaw != null) {
                final List decodedL = jsonDecode(logsRaw);
                setState(() => _logs = decodedL.map((e) => AdherenceLogItem.fromMap(e)).toList());
              }
              setState(() {
                _bloodType = prefs.getString('em_blood') ?? 'A+';
                _allergies = prefs.getString('em_allergies') ?? 'אין רגישויות ידועות';
                _emergencyNotes = prefs.getString('em_notes') ?? 'ללא מחלות רקע מיוחדות';
                _contactName = prefs.getString('em_contact') ?? 'איש קשר ראשי';
                _contactPhone = prefs.getString('em_phone') ?? '050-1234567';
              });
            }

            Future<void> _saveSchedules() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_multi_scheds_store_v6', jsonEncode(_schedules.map((m) => m.toMap()).toList()));
            }

            Future<void> _saveApps() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_apps_store_v6', jsonEncode(_apps.map((a) => a.toMap()).toList()));
