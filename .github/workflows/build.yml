      - name: Configure Android Manifest, Desugaring and Kotlin Flags
        run: |
          mkdir -p android
          echo "android.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="geo" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="waze" />
                  </intent>
                  <package android:name="com.waze" />
                  <package android:name="com.google.android.apps.maps" />
              </queries>
              <application
                  android:label="CYBER PHARMA 3D"
                  android:name="${applicationName}"
                  android:icon="@drawable/ic_launcher_cyber">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
          python3 -c '
          import os
          fpath = "android/app/build.gradle.kts"
          if os.path.exists(fpath):
              with open(fpath, "r") as f:
                  txt = f.read()
              if "compileOptions {" in txt:
                  txt = txt.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              txt += "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
              with open(fpath, "w") as f:
                  f.write(txt)
          else:
              fpath_g = "android/app/build.gradle"
              if os.path.exists(fpath_g):
                  with open(fpath_g, "r") as f:
                      txt = f.read()
                  if "compileOptions {" in txt:
                      txt = txt.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                  txt += "\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"
                  with open(fpath_g, "w") as f:
                      f.write(txt)
          '

      - name: Create pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: Ultra-Realistic Heavy Industrial 3D Hardware Medical Console
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
            audioplayers: ^6.0.0
            path_provider: ^2.1.4
            url_launcher: ^6.3.0
            permission_handler: ^11.3.1
