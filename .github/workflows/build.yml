          name: pill_reminder
          description: Futuristic 3D Pill Reminder & Health Assistant
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
            url_launcher: ^6.3.0
            pdf: ^3.10.8
            printing: ^5.13.1
            share_plus: ^10.0.2
            path_provider: ^2.1.3
            intl: ^0.19.0
          flutter:
            uses-material-design: true
          EOF

