            ];

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _tabController.addListener(() {
                if (_tabController.index != _activeTabIndex) {
                  setState(() {
                    _activeTabIndex = _tabController.index;
                  });
                }
              });
              _loadData();
              _initTTS();
              _startLiveReminderMonitor();
            }

            @override
            void dispose() {
              _alarmCheckTimer?.cancel();
              _tabController.dispose();
              super.dispose();
            }

            void _initTTS() async {
              try {
                final app = CyberPillMasterApp.of(context);
                Map<String, String> langMap = {
                  'he': 'he-IL', 'en': 'en-US', 'ar': 'ar-SA',
                  'ru': 'ru-RU', 'fr': 'fr-FR', 'es': 'es-ES'
                };
                await flutterTts.setLanguage(langMap[app.currentLang] ?? 'he-IL');
                await flutterTts.setSpeechRate(0.48);
                await flutterTts.setVolume(app.soundVolume);
              } catch (e) {
                debugPrint('TTS init error: $e');
              }
            }

            final Set<String> _firedAlerts = {};

            void _startLiveReminderMonitor() {
              _alarmCheckTimer = Timer.periodic(const Duration(seconds: 5), (timer) {
                final now = DateTime.now();
                final String currentMinuteKey = '${now.year}-${now.month}-${now.day}-${now.hour}-${now.minute}';

                // 1. High-Precision Medicine Reminders
                for (var sched in _schedules) {
                  if (!sched.isTaken && sched.hour == now.hour && sched.minute == now.minute) {
                    final String alertKey = 'med_${sched.id}_$currentMinuteKey';
                    if (!_firedAlerts.contains(alertKey)) {
                      _firedAlerts.add(alertKey);
                      _triggerHeadsUpAlert(sched);
                      break;
                    }
                  }
                }

                // 2. High-Precision Doctor Appointment Reminders
                for (var a in _apps) {
                  try {
                    final partsDate = a.date.split('/');
                    final partsTime = a.time.split(':');
                    if (partsDate.length == 3 && partsTime.length == 2) {
                      final appDt = DateTime(
                        int.parse(partsDate[2]),
                        int.parse(partsDate[1]),
                        int.parse(partsDate[0]),
                        int.parse(partsTime[0]),
                        int.parse(partsTime[1]),
                      );
                      final alertDt = appDt.subtract(Duration(minutes: a.reminderMinutesBefore));
                      if (now.year == alertDt.year &&
                          now.month == alertDt.month &&
                          now.day == alertDt.day &&
                          now.hour == alertDt.hour &&
                          now.minute == alertDt.minute) {
                        final String alertKey = 'app_${a.id}_$currentMinuteKey';
                        if (!_firedAlerts.contains(alertKey)) {
                          _firedAlerts.add(alertKey);
                          _triggerAppointmentHeadsUpAlert(a);
                          break;
                        }
                      }
                    }
                  } catch (_) {}
                }
              });
            }

