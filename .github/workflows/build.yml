name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Skeleton
        run: |
          flutter create --org com.example --project-name pill_reminder . --platforms=android --overwrite

      - name: Generate Custom 3D Medical Launcher Icon
        run: |
          python3 -c "
          import os, zlib, struct

          def generate_png(size):
              width = size
              height = size
              raw_data = bytearray()
              cx, cy = width / 2.0, height / 2.0
              r_outer = width * 0.44
              r_inner = width * 0.40
              bar_w = width * 0.16
              bar_l = width * 0.52

              for y in range(height):
                  raw_data.append(0)
                  for x in range(width):
                      dx = x - cx
                      dy = y - cy
                      dist = (dx * dx + dy * dy) ** 0.5

                      r, g, b, a = 15, 23, 42, 255

                      if r_inner <= dist <= r_outer:
                          r, g, b, a = 6, 182, 212, 255
                      elif dist < r_inner:
                          r, g, b, a = 30, 41, 59, 255

                      in_v_bar = (abs(dx) <= bar_w / 2.0) and (abs(dy) <= bar_l / 2.0)
                      in_h_bar = (abs(dy) <= bar_w / 2.0) and (abs(dx) <= bar_l / 2.0)
                      if in_v_bar or in_h_bar:
                          r, g, b, a = 6, 182, 212, 255

                      if ((x - width * 0.7)**2 + (y - height * 0.3)**2)**0.5 <= width * 0.08:
                          r, g, b, a = 244, 63, 94, 255

                      raw_data.extend([r, g, b, a])

              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(bytes(raw_data)))
              png += chunk(b'IEND', b'')
              return png

          res_path = 'android/app/src/main/res'
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          adaptive_dir = os.path.join(res_path, 'mipmap-anydpi-v26')
          if os.path.exists(adaptive_dir):
              for f in os.listdir(adaptive_dir):
                  os.remove(os.path.join(adaptive_dir, f))

          for folder, sz in sizes.items():
              target = os.path.join(res_path, folder)
              os.makedirs(target, exist_ok=True)
              png_bytes = generate_png(sz)
              with open(os.path.join(target, 'ic_launcher.png'), 'wb') as f:
                  f.write(png_bytes)
          "

      - name: Inject Native Audio Synthesizer in Kotlin MainActivity
        run: |
          python3 -c "
          import os
          main_kt = 'android/app/src/main/kotlin/com/example/pill_reminder/MainActivity.kt'
          code = '''package com.example.pill_reminder

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity: FlutterActivity() {
              private val CHANNEL = \"cyber_pharma/audio\"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == \"playTone\") {
                          val type = call.argument<String>(\"type\") ?: \"electric\"
                          val volume = (call.argument<Double>(\"volume\") ?: 1.0).toFloat().coerceIn(0.05f, 1.0f)
                          playSynthesizedTone(type, volume)
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun playSynthesizedTone(type: String, volume: Float) {
                  thread {
                      try {
                          val sampleRate = 44100
                          val durationMs = when (type) {
                              \"gong\" -> 1100
                              \"alarm\" -> 750
                              \"bell\" -> 850
                              else -> 550
                          }
                          val numSamples = (durationMs * sampleRate) / 1000
                          val generatedSnd = ShortArray(numSamples)

                          for (i in 0 until numSamples) {
                              val t = i.toDouble() / sampleRate
                              val sample = when (type) {
                                  \"electric\" -> {
                                      val freq = if (t < 0.18) 520.0 else if (t < 0.36) 780.0 else 1040.0
                                      sin(2.0 * Math.PI * freq * t) * (1.0 - (t / 0.55))
                                  }
                                  \"gong\" -> {
                                      val env = Math.exp(-3.2 * t)
                                      (sin(2.0 * Math.PI * 220.0 * t) * 0.65 + sin(2.0 * Math.PI * 440.0 * t) * 0.35) * env
                                  }
                                  \"alarm\" -> {
                                      val f = if ((t * 9.0).toInt() % 2 == 0) 880.0 else 1180.0
                                      sin(2.0 * Math.PI * f * t)
                                  }
                                  \"bell\" -> {
                                      val env = Math.exp(-4.2 * t)
                                      (sin(2.0 * Math.PI * 1320.0 * t) * 0.7 + sin(2.0 * Math.PI * 2640.0 * t) * 0.3) * env
                                  }
                                  else -> {
                                      sin(2.0 * Math.PI * 660.0 * t) * (1.0 - (t / 0.55))
                                  }
                              }
                              generatedSnd[i] = (sample * 32767 * volume).toInt().coerceIn(-32768, 32767).toShort()
                          }

                          val bufferSize = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                          val track = AudioTrack(
                              AudioManager.STREAM_MUSIC,
                              sampleRate,
                              AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT,
                              maxOf(bufferSize, numSamples * 2),
                              AudioTrack.MODE_STATIC
                          )
                          track.write(generatedSnd, 0, numSamples)
                          track.play()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }
          }
          '''
          with open(main_kt, 'w') as f:
              f.write(code)
          "

      - name: Configure Android Permissions and Desugaring
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          
          python3 -c "
          import os
          fpath = 'android/app/build.gradle.kts'
          if os.path.exists(fpath):
              with open(fpath, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              txt += '\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              with open(fpath, 'w') as f:
                  f.write(txt)
          else:
              fpath_g = 'android/app/build.gradle'
              with open(fpath_g, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              txt += '\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
              with open(fpath_g, 'w') as f:
                  f.write(txt)
          "

