          class _DynamicFuturisticBackgroundState extends State<DynamicFuturisticBackground> with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: this, duration: const Duration(seconds: 10))..repeat();
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) {
                return Container(color: Colors.black, child: widget.child);
              }

              return AnimatedBuilder(
                animation: _anim,
                builder: (context, child) {
                  return CustomPaint(
                    painter: MachineFXPainter(
                      progress: _anim.value,
                      color: widget.accentColor,
                      effect: widget.effectType,
                    ),
                    child: widget.child,
                  );
                },
              );
            }
          }

          class MachineFXPainter extends CustomPainter {
            final double progress;
            final Color color;
            final String effect;

            MachineFXPainter({required this.progress, required this.color, required this.effect});

            @override
            void paint(Canvas canvas, Size size) {
              // Dark Void Base
              final basePaint = Paint()..color = const Color(0xFF030712);
              canvas.drawRect(Rect.fromLTWH(0, 0, size.width, size.height), basePaint);

              if (effect == 'carbon') {
                // 3D Woven Carbon Fiber Mesh
                final double cell = 18.0;
                for (double y = 0; y < size.height; y += cell) {
                  for (double x = 0; x < size.width; x += cell) {
                    bool alt = ((x / cell).toInt() + (y / cell).toInt()) % 2 == 0;
                    final p = Paint()
                      ..shader = LinearGradient(
                        colors: alt
                            ? [const Color(0xFF1E2530), const Color(0xFF080C12)]
                            : [const Color(0xFF0A0F17), const Color(0xFF18202C)],
                        begin: Alignment.topLeft,
                        end: Alignment.bottomRight,
                      ).createShader(Rect.fromLTWH(x, y, cell, cell));
                    canvas.drawRect(Rect.fromLTWH(x, y, cell, cell), p);
                  }
                }
              } else if (effect == 'hex') {
                // Sunken Reactor Core Hex Matrix with pulse glow
                final double r = 36.0;
                final double w = math.sqrt(3) * r;
                final double h = 2 * r * 0.75;
                final strokePaint = Paint()
                  ..color = color.withOpacity(0.18)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.0;

                int row = 0;
                for (double y = -r; y < size.height + r; y += h, row++) {
                  double xOffset = (row % 2 == 0) ? 0 : w / 2;
                  for (double x = -w + xOffset; x < size.width + w; x += w) {
                    Path path = Path();
                    for (int i = 0; i < 6; i++) {
                      double angle = (60.0 * i - 30.0) * math.pi / 180.0;
                      double px = x + r * 0.5 * math.cos(angle);
                      double py = y + r * 0.5 * math.sin(angle);
                      if (i == 0) path.moveTo(px, py); else path.lineTo(px, py);
                    }
                    path.close();
                    canvas.drawPath(path, strokePaint);
                  }
                }
              } else if (effect == 'plasma') {
                // Holographic Multi-layer Plasma Glow
                for (int layer = 1; layer <= 3; layer++) {
                  final paint = Paint()
                    ..color = color.withOpacity(0.08 * layer)
                    ..style = PaintingStyle.fill;
                  final path = Path()..moveTo(0, size.height * 0.6);
                  for (double x = 0; x <= size.width; x += 14) {
                    double y = math.sin((x / size.width * (layer + 1) * math.pi) + (progress * 2 * math.pi)) * (18.0 * layer) +
                        math.cos((x / size.width * 2 * math.pi) + (progress * 2 * math.pi)) * 14 +
                        size.height * (0.65 + layer * 0.08);
                    path.lineTo(x, y);
                  }
                  path.lineTo(size.width, size.height);
                  path.lineTo(0, size.height);
                  path.close();
                  canvas.drawPath(path, paint);
                }
              } else {
                // Infinite Tron 3D Perspective Grid
                final horizonY = size.height * 0.45;
                final gridPaint = Paint()
                  ..color = color.withOpacity(0.22)
                  ..strokeWidth = 1.6;

                // Perspective Z-lines to vanishing point
                final centerX = size.width * 0.5;
                for (double x = -size.width * 0.8; x <= size.width * 1.8; x += 40) {
                  canvas.drawLine(Offset(centerX, horizonY), Offset(x, size.height), gridPaint);
                }

                // Horizontal receding depth lines
                double speed = (progress * 30);
                for (double y = horizonY; y <= size.height; y += 22) {
                  double lineY = y + (speed % 22);
                  if (lineY <= size.height) {
                    double alpha = ((lineY - horizonY) / (size.height - horizonY)).clamp(0.0, 1.0);
                    final p = Paint()
                      ..color = color.withOpacity(0.28 * alpha)
                      ..strokeWidth = 1.8 * alpha;
                    canvas.drawLine(Offset(0, lineY), Offset(size.width, lineY), p);
                  }
                }

                // Glowing Horizon Bar
                final horizonPaint = Paint()
                  ..shader = LinearGradient(
                    colors: [Colors.transparent, color.withOpacity(0.85), Colors.transparent],
                  ).createShader(Rect.fromLTWH(0, horizonY - 4, size.width, 8));
                canvas.drawRect(Rect.fromLTWH(0, horizonY - 4, size.width, 8), horizonPaint);
              }
            }

            @override
            bool shouldRepaint(covariant MachineFXPainter oldDelegate) => true;
          }

