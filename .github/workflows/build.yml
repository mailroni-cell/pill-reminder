          class _CyberTactileButtonState extends State<CyberTactileButton> {
            bool _down = false;

            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
              final Color accent = widget.glowColor ?? (app.highContrast ? const Color(0xFFFFE500) : palette['accent']!);
              final bool pressed = _down || widget.isPushed;

              return GestureDetector(
                onTapDown: (_) => setState(() => _down = true),
                onTapUp: (_) {
                  setState(() => _down = false);
                  widget.onTap();
