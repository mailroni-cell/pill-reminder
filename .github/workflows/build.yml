                                          Text(t['nav_google']!, style: const TextStyle(color: Color(0xFF34A853), fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 20),
                              CyberTactileButton(
                                glowColor: const Color(0xFFA855F7),
                                height: 56,
                                onTap: () {
                                  if (docCtrl.text.trim().isEmpty) return;
                                  setState(() {
                                    _apps.add(AppointmentModel(
                                      id: DateTime.now().millisecondsSinceEpoch.toString(),
                                      type: selectedType,
                                      doctor: docCtrl.text.trim(),
                                      clinic: clinicCtrl.text.trim(),
                                      date: '${selectedDate.day}/${selectedDate.month}/${selectedDate.year}',
                                      time: selectedTime.format(context),
                                    ));
                                  });
                                  _saveApps();
                                  Navigator.pop(ctx);
                                },
                                child: textEmbossed(
                                  t['save']!,
                                  fontSize: hc ? 20 : 18,
                                  color: hc ? const Color(0xFFFFE500) : const Color(0xFFA855F7),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            void _openSettingsDialog() {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;

              final soundOptions = [
                {'key': 'electric', 'label': 'סייבר אלקטרוני (Sweep)'},
                {'key': 'gong', 'label': 'גונג הרמוני עמוק'},
                {'key': 'alarm', 'label': 'אזעקת לייזר חדה'},
                {'key': 'bell', 'label': 'פעמון דיגיטלי נקי'},
              ];

              final bgOptions = [
                {'key': 'carbon', 'label': t['bg_carbon']!},
                {'key': 'grid', 'label': t['bg_grid']!},
                {'key': 'hex', 'label': t['bg_hex']!},
                {'key': 'plasma', 'label': t['bg_plasma']!},
              ];

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: hc ? Colors.black : const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(30))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx2, setDlg) => Directionality(
                    textDirection: (app.currentLang == 'he' || app.currentLang == 'ar') ? TextDirection.rtl : TextDirection.ltr,
                    child: SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              textEmbossed(t['settings']!, fontSize: hc ? 24 : 20, color: hc ? const Color(0xFFFFE500) : const Color(0xFF00F0FF)),
                              const SizedBox(height: 16),
                              Align(
                                alignment: (app.currentLang == 'he' || app.currentLang == 'ar') ? Alignment.centerRight : Alignment.centerLeft,
                                child: Text(t['alert_sound']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.bold)),
                              ),
                              const SizedBox(height: 8),
                              Container(
                                decoration: cyber3D(context: context, radius: 14, highContrast: hc, isPressed: true),
                                child: Column(
                                  children: soundOptions.map((s) {
                                    final bool active = app.soundType == s['key'];
                                    return ListTile(
                                      dense: true,
                                      title: Text(s['label']!, style: TextStyle(color: active ? (hc ? const Color(0xFFFFE500) : const Color(0xFF00F0FF)) : Colors.white70, fontWeight: FontWeight.bold)),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.volume_up, color: Color(0xFF00F0FF)),
                                        onPressed: () => SoundGenerator.playAlertTone(s['key']!, app.soundVolume),
                                      ),
                                      leading: Radio<String>(
                                        value: s['key']!,
                                        groupValue: app.soundType,
                                        onChanged: (val) {
                                          if (val != null) {
                                            app.updateSettings(sound: val);
                                            setDlg(() {});
                                          }
                                        },
                                      ),
                                    );
                                  }).toList(),
                                ),
                              ),
                              const SizedBox(height: 12),
                              Row(
                                children: [
                                  Icon(Icons.volume_up, color: hc ? const Color(0xFFFFE500) : const Color(0xFF00F0FF)),
                                  const SizedBox(width: 8),
                                  Text('${t['sound_vol']!}: ${(app.soundVolume * 100).toInt()}%', style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white)),
                                  Expanded(
                                    child: Slider(
                                      value: app.soundVolume,
                                      onChanged: (v) {
                                        app.updateSettings(volume: v);
                                        setDlg(() {});
                                      },
                                    ),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 14),
                              Align(
                                alignment: (app.currentLang == 'he' || app.currentLang == 'ar') ? Alignment.centerRight : Alignment.centerLeft,
                                child: Text(t['bg_style']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.bold)),
                              ),
                              const SizedBox(height: 8),
                              Wrap(
                                spacing: 8,
                                runSpacing: 8,
                                children: bgOptions.map((opt) {
                                  final bool active = app.bgEffect == opt['key'];
                                  return GestureDetector(
                                    onTap: () {
                                      app.setBgEffect(opt['key']!);
                                      setDlg(() {});
                                    },
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                                      decoration: cyber3D(context: context, radius: 12, isPressed: active, highContrast: hc),
                                      child: Text(opt['label']!, style: TextStyle(color: active ? (hc ? const Color(0xFFFFE500) : const Color(0xFF00F0FF)) : Colors.white60, fontWeight: FontWeight.bold)),
                                    ),
                                  );
                                }).toList(),
                              ),
                              const SizedBox(height: 14),
                              Align(
                                alignment: (app.currentLang == 'he' || app.currentLang == 'ar') ? Alignment.centerRight : Alignment.centerLeft,
                                child: Text(t['themes_title']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.bold)),
                              ),
                              const SizedBox(height: 8),
                              SingleChildScrollView(
                                scrollDirection: Axis.horizontal,
                                child: Row(
                                  children: themePalettes.entries.map((ent) {
                                    final bool active = app.themeKey == ent.key;
                                    return GestureDetector(
                                      onTap: () {
                                        app.setThemeKey(ent.key);
                                        setDlg(() {});
                                      },
                                      child: Container(
                                        margin: const EdgeInsets.symmetric(horizontal: 4),
                                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                                        decoration: BoxDecoration(
                                          color: ent.value['surface'],
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: active ? Colors.white : ent.value['accent'], width: active ? 2.5 : 1),
                                          boxShadow: active
                                              ? [BoxShadow(color: ent.value['accent'], blurRadius: 10, spreadRadius: 1)]
                                              : [],
                                        ),
                                        child: Text(ent.value['name'], style: TextStyle(color: ent.value['accent'], fontWeight: FontWeight.bold)),
                                      ),
                                    );
                                  }).toList(),
                                ),
                              ),
                              const SizedBox(height: 14),
                              SwitchListTile(
                                title: Text(t['high_contrast']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.w900)),
                                value: app.highContrast,
                                onChanged: (v) {
                                  app.updateSettings(hc: v);
                                  setDlg(() {});
                                },
                              ),
                              SwitchListTile(
                                title: Text(t['voice_alerts']!, style: TextStyle(color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.bold)),
                                value: app.voiceAlerts,
                                onChanged: (v) {
                                  app.updateSettings(voice: v);
                                  setDlg(() {});
                                },
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;
              final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
              final Color accent = hc ? const Color(0xFFFFE500) : palette['accent']!;

              return DynamicFuturisticBackground(
                accentColor: accent,
                isHighContrast: hc,
                effectType: app.bgEffect,
                child: Scaffold(
                  backgroundColor: Colors.transparent,
                  appBar: AppBar(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    centerTitle: true,
                    leading: IconButton(
                      icon: const Icon(Icons.language, color: Color(0xFF00F0FF), size: 28),
                      tooltip: t['select_language']!,
                      onPressed: _openLanguagePicker,
                    ),
                    title: Column(
                      children: [
                        textEmbossed(
                          t['app_name']!,
                          fontSize: hc ? 22 : 20,
                          color: accent,
                        ),
                        Text('${t['welcome']!}: ${app.userName}', style: TextStyle(fontSize: hc ? 16 : 13, color: hc ? const Color(0xFFFFE500) : Colors.white70, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    actions: [
                      IconButton(
                        icon: Icon(Icons.settings, size: hc ? 32 : 26, color: hc ? const Color(0xFFFFE500) : accent),
                        onPressed: _openSettingsDialog,
                      ),
                    ],
                    bottom: TabBar(
                      controller: _tabController,
                      indicatorColor: accent,
                      indicatorWeight: 4,
                      labelColor: accent,
                      unselectedLabelColor: Colors.white38,
                      tabs: [
                        Tab(icon: const Icon(Icons.medication_liquid), text: t['meds_tab']!),
                        Tab(icon: const Icon(Icons.calendar_month), text: t['appointments_tab']!),
                      ],
                    ),
                  ),
                  body: SafeArea(
                    child: TabBarView(
                      controller: _tabController,
                      children: [
                        _schedules.isEmpty
                            ? Center(child: textEmbossed(t['empty_meds']!, fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white38))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 95),
                                itemCount: _schedules.length,
                                itemBuilder: (ctx, i) {
                                  final sched = _schedules[i];
                                  final timeStr = '${sched.hour.toString().padLeft(2, '0')}:${sched.minute.toString().padLeft(2, '0')}';
                                  return Container(
                                    margin: const EdgeInsets.only(bottom: 14),
                                    decoration: cyber3D(context: context, radius: 20, isPressed: sched.isTaken, highContrast: hc),
                                    child: ListTile(
                                      contentPadding: const EdgeInsets.all(14),
                                      leading: Icon(sched.isTaken ? Icons.check_circle : Icons.alarm_on, color: sched.isTaken ? const Color(0xFF00FF88) : accent, size: 36),
                                      title: textEmbossed(
                                        sched.title.isNotEmpty ? sched.title : timeStr,
                                        fontSize: hc ? 22 : 18,
                                        color: hc ? const Color(0xFFFFE500) : Colors.white,
                                      ),
                                      subtitle: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          const SizedBox(height: 4),
                                          Text('$timeStr • ${sched.pills.length} תרופות', style: TextStyle(fontSize: hc ? 16 : 14, color: Colors.white70, fontWeight: FontWeight.bold)),
                                          const SizedBox(height: 2),
                                          ...sched.pills.map((p) => Text('• ${p.name} (מינון: ${p.dosage})', style: TextStyle(fontSize: hc ? 17 : 14, color: hc ? const Color(0xFFFFE500) : const Color(0xFF00F0FF), fontWeight: FontWeight.bold))),
                                        ],
                                      ),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.delete_forever, color: Colors.redAccent),
                                        onPressed: () {
                                          HapticFeedback.mediumImpact();
                                          setState(() => _schedules.removeAt(i));
                                          _saveSchedules();
                                        },
                                      ),
                                    ),
                                  );
                                },
                              ),
                        _apps.isEmpty
                            ? Center(child: textEmbossed(t['empty_apps']!, fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white38))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 95),
                                itemCount: _apps.length,
                                itemBuilder: (ctx, i) {
                                  final appItem = _apps[i];
                                  return Container(
                                    margin: const EdgeInsets.only(bottom: 14),
                                    decoration: cyber3D(context: context, radius: 20, highContrast: hc, customGlow: const Color(0xFFA855F7)),
                                    child: ListTile(
                                      contentPadding: const EdgeInsets.all(14),
                                      leading: Icon(Icons.local_hospital, size: 36, color: hc ? const Color(0xFFFFE500) : const Color(0xFFA855F7)),
                                      title: textEmbossed('${appItem.type}: ${appItem.doctor}', fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white),
                                      subtitle: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          const SizedBox(height: 4),
                                          Text('${appItem.date}  •  ${appItem.time}', style: TextStyle(fontSize: hc ? 16 : 14, color: hc ? Colors.cyanAccent : const Color(0xFF38BDF8), fontWeight: FontWeight.bold)),
                                          if (appItem.clinic.isNotEmpty) ...[
                                            const SizedBox(height: 4),
                                            Text('📍 ${appItem.clinic}', style: TextStyle(fontSize: hc ? 16 : 14, color: Colors.white70, fontWeight: FontWeight.bold)),
                                            const SizedBox(height: 8),
                                            Row(
                                              children: [
                                                GestureDetector(
                                                  onTap: () => _launchMap(appItem.clinic, true),
                                                  child: Container(
                                                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                                                    decoration: BoxDecoration(color: const Color(0xFF00D1FF).withOpacity(0.2), borderRadius: BorderRadius.circular(8)),
                                                    child: Text(t['nav_waze']!, style: const TextStyle(fontSize: 12, color: Color(0xFF00D1FF), fontWeight: FontWeight.bold)),
                                                  ),
                                                ),
                                                const SizedBox(width: 8),
                                                GestureDetector(
                                                  onTap: () => _launchMap(appItem.clinic, false),
                                                  child: Container(
                                                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                                                    decoration: BoxDecoration(color: const Color(0xFF34A853).withOpacity(0.2), borderRadius: BorderRadius.circular(8)),
                                                    child: Text(t['nav_google']!, style: const TextStyle(fontSize: 12, color: Color(0xFF34A853), fontWeight: FontWeight.bold)),
                                                  ),
                                                ),
                                              ],
                                            )
                                          ]
                                        ],
                                      ),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                        onPressed: () {
                                          HapticFeedback.mediumImpact();
                                          setState(() => _apps.removeAt(i));
                                          _saveApps();
                                        },
                                      ),
                                    ),
                                  );
                                },
                              ),
                      ],
                    ),
                  ),
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: CyberTactileButton(
                    radius: 28,
                    height: 60,
                    onTap: () {
                      if (_tabController.index == 0) {
                        _openAddScheduleDialog();
                      } else {
                        _openAddAppointmentDialog();
                      }
                    },
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 24),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.add, color: hc ? const Color(0xFFFFE500) : Colors.white, size: 26),
                          const SizedBox(width: 8),
                          textEmbossed(
                            _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                            fontSize: hc ? 18 : 16,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
