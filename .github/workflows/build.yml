          class MedicineModel {
            String id;
            String name;
            int dosage;
            int hour;
            int minute;
            int stock;
            bool isTaken;

            MedicineModel({
              required this.id,
              required this.name,
              required this.dosage,
              required this.hour,
              required this.minute,
              required this.stock,
              this.isTaken = false,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'name': name,
                  'dosage': dosage,
                  'hour': hour,
                  'minute': minute,
                  'stock': stock,
                  'isTaken': isTaken,
                };

            factory MedicineModel.fromMap(Map<String, dynamic> map) => MedicineModel(
                  id: map['id'],
                  name: map['name'],
                  dosage: map['dosage'] ?? 1,
                  hour: map['hour'],
                  minute: map['minute'],
                  stock: map['stock'],
                  isTaken: map['isTaken'] ?? false,
                );
          }

          class AppointmentModel {
            String id;
            String doctor;
            String clinic;
            String date;
            String time;

            AppointmentModel({
              required this.id,
              required this.doctor,
              required this.clinic,
              required this.date,
              required this.time,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'doctor': doctor,
                  'clinic': clinic,
                  'date': date,
                  'time': time,
                };

            factory AppointmentModel.fromMap(Map<String, dynamic> map) => AppointmentModel(
                  id: map['id'],
                  doctor: map['doctor'],
                  clinic: map['clinic'],
                  date: map['date'],
                  time: map['time'],
                );
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            List<MedicineModel> _meds = [];
            List<AppointmentModel> _apps = [];

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _loadData();
              _initTTS();
            }

            void _initTTS() async {
              final app = CyberPillMasterApp.of(context);
              Map<String, String> langMap = {
                'he': 'he-IL',
                'en': 'en-US',
                'ru': 'ru-RU',
                'ro': 'ro-RO',
                'ar': 'ar-SA',
                'de': 'de-DE',
              };
              await flutterTts.setLanguage(langMap[app.currentLang] ?? 'he-IL');
              await flutterTts.setSpeechRate(0.45);
            }

            Future<void> _loadData() async {
              final prefs = await SharedPreferences.getInstance();
              final String? medsRaw = prefs.getString('c_meds_store');
              if (medsRaw != null) {
                final List decoded = jsonDecode(medsRaw);
                setState(() => _meds = decoded.map((e) => MedicineModel.fromMap(e)).toList());
              }
              final String? appsRaw = prefs.getString('c_apps_store');
              if (appsRaw != null) {
                final List decodedA = jsonDecode(appsRaw);
                setState(() => _apps = decodedA.map((e) => AppointmentModel.fromMap(e)).toList());
              }
            }

            Future<void> _saveMeds() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_meds_store', jsonEncode(_meds.map((m) => m.toMap()).toList()));
            }

            Future<void> _saveApps() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('c_apps_store', jsonEncode(_apps.map((a) => a.toMap()).toList()));
            }

            void _speak(String text) async {
              final app = CyberPillMasterApp.of(context);
              if (app.voiceAlerts) {
                await flutterTts.speak(text);
              }
            }

