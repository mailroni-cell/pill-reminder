            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final hc = app.highContrast;
              final palette = app.currentPalette;
              final Color accent = hc ? const Color(0xFFFFE500) : palette.primary;

              return Interactive3DGlassBackground(
                palette: palette,
                isHighContrast: hc,
                style: app.bgStyle,
                child: Scaffold(
                  backgroundColor: Colors.transparent,
                  appBar: AppBar(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    centerTitle: true,
                    // Restored Language Picker Icon
                    leading: IconButton(
                      icon: Icon(Icons.language, color: palette.highlight, size: 26),
                      tooltip: t['select_language']!,
                      onPressed: _openLanguagePicker,
                    ),
                    title: Column(
                      children: [
                        textChannel3D(
                          t['app_name']!,
                          fontSize: hc ? 22 : 20,
                          color: accent,
                        ),
                        Text('${t['welcome']!}: ${app.userName}', style: TextStyle(fontSize: hc ? 16 : 13, color: hc ? const Color(0xFFFFE500) : Colors.white, fontWeight: FontWeight.w900)),
                      ],
                    ),
                    actions: [
                      // Dedicated User Help Guide (?) Icon
                      IconButton(
                        icon: Icon(Icons.help_outline_rounded, size: 26, color: palette.highlight),
                        tooltip: t['help_title']!,
                        onPressed: _openHelpGuideDialog,
                      ),
                      IconButton(
                        icon: Icon(Icons.settings, size: hc ? 30 : 26, color: hc ? const Color(0xFFFFE500) : accent),
                        onPressed: _openSettingsDialog,
                      ),
                    ],
                    bottom: TabBar(
                      controller: _tabController,
                      indicatorColor: accent,
                      indicatorWeight: 4,
                      labelColor: accent,
                      unselectedLabelColor: Colors.white70,
                      tabs: [
                        Tab(icon: const Icon(Icons.medication_liquid), text: t['meds_tab']!),
                        Tab(icon: const Icon(Icons.calendar_month), text: t['appointments_tab']!),
                      ],
                    ),
                  ),
                  body: SafeArea(
                    child: TabBarView(
                      controller: _tabController,
                      children: [
                        _schedules.isEmpty
                            ? Center(child: textChannel3D(t['empty_meds']!, fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white70))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 16, right: 16, top: 16, bottom: 95),
                                itemCount: _schedules.length,
                                itemBuilder: (ctx, i) {
                                  final sched = _schedules[i];
                                  final timeStr = '${sched.hour.toString().padLeft(2, '0')}:${sched.minute.toString().padLeft(2, '0')}';
                                  return MechModuleCard(
                                    isPressed: sched.isTaken,
                                    showLed: true,
                                    child: ListTile(
                                      contentPadding: EdgeInsets.zero,
                                      leading: Icon(sched.isTaken ? Icons.check_circle : Icons.alarm_on, color: sched.isTaken ? const Color(0xFF00FF88) : accent, size: 36),
                                      title: textChannel3D(
                                        sched.title.isNotEmpty ? sched.title : timeStr,
                                        fontSize: hc ? 22 : 18,
                                        color: hc ? const Color(0xFFFFE500) : Colors.white,
                                      ),
                                      subtitle: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          const SizedBox(height: 4),
                                          Text('$timeStr • ${sched.pills.length} תרופות', style: const TextStyle(fontSize: 14, color: Colors.white, fontWeight: FontWeight.bold)),
                                          const SizedBox(height: 2),
                                          ...sched.pills.map((p) => Text('• ${p.name} (מינון: ${p.dosage})', style: TextStyle(fontSize: hc ? 17 : 14, color: hc ? const Color(0xFFFFE500) : palette.highlight, fontWeight: FontWeight.w900))),
                                        ],
                                      ),
                                      trailing: Row(
                                        mainAxisSize: MainAxisSize.min,
                                        children: [
                                          Pneumatic3DButton(
                                            height: 40,
                                            width: 44,
                                            palette: palette,
                                            onTap: () => _previewScheduleAudio(sched),
                                            child: Icon(Icons.play_arrow_rounded, color: palette.highlight, size: 24),
                                          ),
                                          const SizedBox(width: 8),
                                          IconButton(
                                            icon: const Icon(Icons.delete_forever, color: Colors.redAccent),
                                            onPressed: () {
                                              HapticFeedback.mediumImpact();
                                              setState(() => _schedules.removeAt(i));
                                              _saveSchedules();
                                            },
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),
                        _apps.isEmpty
                            ? Center(child: textChannel3D(t['empty_apps']!, fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white70))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 16, right: 16, top: 16, bottom: 95),
                                itemCount: _apps.length,
                                itemBuilder: (ctx, i) {
                                  final appItem = _apps[i];
                                  return MechModuleCard(
                                    accentColor: palette.primary,
                                    showLed: true,
                                    child: ListTile(
                                      contentPadding: EdgeInsets.zero,
                                      leading: Icon(Icons.local_hospital, size: 36, color: hc ? const Color(0xFFFFE500) : palette.primary),
                                      title: textChannel3D('${appItem.type}: ${appItem.doctor}', fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white),
                                      subtitle: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          const SizedBox(height: 4),
                                          Text('${appItem.date}  •  ${appItem.time}', style: TextStyle(fontSize: hc ? 16 : 14, color: hc ? Colors.cyanAccent : palette.highlight, fontWeight: FontWeight.w900)),
                                          if (appItem.clinic.isNotEmpty) ...[
                                            const SizedBox(height: 4),
                                            Text('📍 ${appItem.clinic}', style: const TextStyle(fontSize: 14, color: Colors.white, fontWeight: FontWeight.bold)),
                                            const SizedBox(height: 8),
                                            Row(
                                              children: [
                                                Pneumatic3DButton(
                                                  height: 38,
                                                  palette: palette,
                                                  customGlow: const Color(0xFF00D1FF),
                                                  onTap: () => _launchMap(appItem.clinic, true),
                                                  child: Padding(
                                                    padding: const EdgeInsets.symmetric(horizontal: 10),
                                                    child: Row(
                                                      children: [
                                                        const Icon(Icons.navigation, size: 16, color: Color(0xFF00D1FF)),
                                                        const SizedBox(width: 4),
                                                        Text(t['nav_waze']!, style: const TextStyle(fontSize: 12, color: Color(0xFF00D1FF), fontWeight: FontWeight.bold)),
                                                      ],
                                                    ),
                                                  ),
                                                ),
                                                const SizedBox(width: 8),
                                                Pneumatic3DButton(
                                                  height: 38,
                                                  palette: palette,
                                                  customGlow: const Color(0xFF34A853),
                                                  onTap: () => _launchMap(appItem.clinic, false),
                                                  child: Padding(
                                                    padding: const EdgeInsets.symmetric(horizontal: 10),
                                                    child: Row(
                                                      children: [
                                                        const Icon(Icons.map, size: 16, color: Color(0xFF34A853)),
                                                        const SizedBox(width: 4),
                                                        Text(t['nav_google']!, style: const TextStyle(fontSize: 12, color: Color(0xFF34A853), fontWeight: FontWeight.bold)),
                                                      ],
                                                    ),
                                                  ),
                                                ),
                                              ],
                                            )
                                          ]
                                        ],
                                      ),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                        onPressed: () {
                                          HapticFeedback.mediumImpact();
                                          setState(() => _apps.removeAt(i));
                                          _saveApps();
                                        },
                                      ),
                                    ),
                                  );
                                },
                              ),
                      ],
                    ),
                  ),
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: Pneumatic3DButton(
                    height: 64,
                    palette: palette,
                    onTap: () {
                      if (_tabController.index == 0) {
                        _openAddScheduleDialog();
                      } else {
                        _openAddAppointmentDialog();
                      }
                    },
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 26),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.add, color: hc ? const Color(0xFFFFE500) : Colors.white, size: 28),
                          const SizedBox(width: 8),
                          textChannel3D(
                            _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                            fontSize: hc ? 18 : 16,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
