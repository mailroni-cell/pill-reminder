          class Pill3DPainter extends CustomPainter {
            final Color topColor;
            final Color bottomColor;
            final Color glowColor;

            Pill3DPainter({
              required this.topColor,
              required this.bottomColor,
              required this.glowColor,
            });

            @override
            void paint(Canvas canvas, Size size) {
              final double w = size.width * 0.48;
              final double h = size.height * 0.82;
              final double left = (size.width - w) / 2;
              final double top = (size.height - h) / 2;
              final RRect pillRRect = RRect.fromRectAndRadius(
                Rect.fromLTWH(left, top, w, h),
                Radius.circular(w / 2),
              );

              // Heavy 3D Cast Shadow Base
              canvas.drawRRect(
                pillRRect.shift(const Offset(4, 12)),
                Paint()
                  ..color = Colors.black.withOpacity(0.9)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 14),
              );

              // 3D Metallic Gradient Fill
              final baseGradient = LinearGradient(
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
                colors: [
                  Colors.white.withOpacity(0.95),
                  topColor,
                  bottomColor,
                  Colors.black.withOpacity(0.98),
                ],
                stops: const [0.0, 0.35, 0.75, 1.0],
              );
              canvas.drawRRect(
                pillRRect,
                Paint()..shader = baseGradient.createShader(pillRRect.outerRect),
              );

              // Center Cyber Seam Divider
              final seamY = top + (h / 2);
              canvas.drawLine(
                Offset(left + 2, seamY),
                Offset(left + w - 2, seamY),
                Paint()..color = Colors.white..strokeWidth = 3.5,
              );

              canvas.drawLine(
                Offset(left + 4, seamY),
                Offset(left + w - 4, seamY),
                Paint()
                  ..color = glowColor
                  ..strokeWidth = 7.0
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5),
              );

              // Specular Light Streak
              final highlightPath = Path()
                ..addRRect(
                  RRect.fromRectAndRadius(
                    Rect.fromLTWH(left + 5, top + 6, w * 0.28, h * 0.88),
                    Radius.circular(w * 0.15),
                  ),
                );
              canvas.drawPath(
                highlightPath,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [
                      Colors.white.withOpacity(0.95),
                      Colors.white.withOpacity(0.1),
                    ],
                  ).createShader(Rect.fromLTWH(left + 5, top + 6, w * 0.28, h * 0.88)),
              );
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }

          // Multi 3D Interactive Live Background Painter
          class Multi3DGraphicsPainter extends CustomPainter {
            final double progress;
            final ThemePalette palette;
            final String style;

            Multi3DGraphicsPainter({
              required this.progress,
              required this.palette,
              required this.style,
            });

            @override
            void paint(Canvas canvas, Size size) {
              if (style == 'particles') {
                _paintParticles(canvas, size);
              } else if (style == 'reactor') {
                _paintHexReactor(canvas, size);
              } else if (style == 'wave') {
                _paintQuantumWaves(canvas, size);
              } else if (style == 'tunnel') {
                _paintTronTunnel(canvas, size);
              } else if (style == 'plasma') {
                _paintBioPlasma(canvas, size);
              } else {
                _paintDepthMesh(canvas, size);
              }
            }

            void _paintDepthMesh(Canvas canvas, Size size) {
              final double horizon = size.height * 0.45;
              const double fov = 260.0;
              const int cols = 14;
              const int rows = 18;

              final linePaint = Paint()
                ..color = palette.primary.withOpacity(0.35)
                ..style = PaintingStyle.stroke
                ..strokeWidth = 1.3;

              List<List<Offset>> points = [];
              for (int r = 0; r <= rows; r++) {
                List<Offset> rowPoints = [];
                double z = ((r - progress) / rows);
                if (z <= 0) z += 1.0;
                double depth = (1.0 - z) * 600.0 + 30.0;
                double scale = fov / (fov + depth);
                double y = horizon + (size.height - horizon) * (scale * 1.7);

                for (int c = 0; c <= cols; c++) {
                  double worldX = (c - cols / 2) * (size.width / (cols * 0.45));
                  double x = size.width / 2 + (worldX * scale);
                  double wave = math.sin(c * 0.6 + progress * 2 * math.pi) * 9.0 * scale;
                  rowPoints.add(Offset(x, y + wave));
                }
                points.add(rowPoints);
              }

              for (int r = 0; r < points.length; r++) {
                for (int c = 0; c < points[r].length; c++) {
                  if (c < points[r].length - 1) canvas.drawLine(points[r][c], points[r][c + 1], linePaint);
                  if (r < points.length - 1) canvas.drawLine(points[r][c], points[r + 1][c], linePaint);
                }
              }
            }

            void _paintParticles(Canvas canvas, Size size) {
              const int count = 55;
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;

              for (int i = 0; i < count; i++) {
                double t = (i / count);
                double angle = t * 12 * math.pi + (progress * 2 * math.pi);
                double rad = (size.width * 0.45) * math.sin(t * math.pi + progress * math.pi);
                double x = cx + rad * math.cos(angle);
                double y = cy + (t - 0.5) * size.height * 0.85 + math.sin(angle) * 35;
                double pSize = (math.sin(t * math.pi) * 5.0 + 2.0).clamp(1.5, 7.0);

                canvas.drawCircle(
                  Offset(x, y),
                  pSize,
                  Paint()..color = palette.primary.withOpacity((math.sin(t * math.pi) * 0.7).clamp(0.15, 0.85)),
                );
                canvas.drawCircle(
                  Offset(x, y),
                  pSize * 0.4,
                  Paint()..color = Colors.white.withOpacity(0.9),
                );
              }
            }

            void _paintHexReactor(Canvas canvas, Size size) {
              const double r = 36.0;
              final double w = math.sqrt(3) * r;
              final double h = 2 * r * 0.75;
              int row = 0;

              for (double y = -r; y < size.height + r * 2; y += h, row++) {
                double xOffset = (row % 2 == 0) ? 0 : w / 2;
                for (double x = -w + xOffset; x < size.width + w * 2; x += w) {
                  double dist = math.sqrt(math.pow(x - size.width * 0.5, 2) + math.pow(y - size.height * 0.5, 2));
                  double wave = math.sin((dist * 0.02) - (progress * 2 * math.pi));
                  double alpha = ((wave + 1) * 0.35).clamp(0.08, 0.7);

                  Path hex = Path();
                  for (int i = 0; i < 6; i++) {
                    double a = (60.0 * i - 30.0) * math.pi / 180.0;
                    double px = x + (r * 0.85) * math.cos(a);
                    double py = y + (r * 0.85) * math.sin(a);
                    if (i == 0) hex.moveTo(px, py); else hex.lineTo(px, py);
                  }
                  hex.close();

                  canvas.drawPath(
                    hex,
                    Paint()
                      ..color = palette.primary.withOpacity(alpha)
                      ..style = PaintingStyle.stroke
                      ..strokeWidth = 1.4,
                  );
                }
              }
            }

            void _paintQuantumWaves(Canvas canvas, Size size) {
              for (int w = 0; w < 4; w++) {
                final path = Path();
                double phase = progress * 2 * math.pi + (w * 1.2);
                double baseH = size.height * (0.35 + w * 0.12);

                path.moveTo(0, baseH);
                for (double x = 0; x <= size.width; x += 15) {
                  double y = baseH + math.sin((x * 0.015) + phase) * (30.0 + w * 12);
                  path.lineTo(x, y);
                }

                canvas.drawPath(
                  path,
                  Paint()
                    ..color = (w % 2 == 0 ? palette.primary : palette.highlight).withOpacity(0.35)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.4,
                );
              }
            }

            void _paintTronTunnel(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.48;

              for (int i = 0; i < 12; i++) {
                double t = (i + progress) / 12.0;
                double s = math.pow(t, 2.5) * (size.width * 0.95);
                double alpha = (1.0 - t).clamp(0.1, 0.8);

                canvas.drawRect(
                  Rect.fromCenter(center: Offset(cx, cy), width: s * 1.2, height: s),
                  Paint()
                    ..color = palette.primary.withOpacity(alpha * 0.5)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.6,
                );
              }
              for (double a = 0; a < math.pi * 2; a += math.pi / 4) {
                canvas.drawLine(
                  Offset(cx, cy),
                  Offset(cx + math.cos(a) * size.width, cy + math.sin(a) * size.height),
                  Paint()..color = palette.highlight.withOpacity(0.25)..strokeWidth = 1.2,
                );
              }
            }

            void _paintBioPlasma(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              for (int i = 0; i < 3; i++) {
                double rad = (size.width * (0.35 + i * 0.15));
                double offsetA = progress * 2 * math.pi + i;
                canvas.drawOval(
                  Rect.fromCenter(
                    center: Offset(cx + math.cos(offsetA) * 30, cy + math.sin(offsetA) * 35),
                    width: rad * 1.3,
                    height: rad * 0.9,
                  ),
                  Paint()
                    ..color = (i == 0 ? palette.primary : palette.glow).withOpacity(0.18)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 28),
                );
              }
            }

            @override
            bool shouldRepaint(covariant Multi3DGraphicsPainter oldDelegate) => true;
          }

