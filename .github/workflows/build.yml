            Future<void> _loadData() async {
              final prefs = await SharedPreferences.getInstance();
              final String? schedsRaw = prefs.getString('c_multi_scheds_store_v6');
              if (schedsRaw != null) {
                final List decoded = jsonDecode(schedsRaw);
                setState(() => _schedules = decoded.map((e) => ScheduleGroup.fromMap(e)).toList());
              }
              final String? appsRaw = prefs.getString('c_apps_store_v6');
              if (appsRaw != null) {
                final List decodedA = jsonDecode(appsRaw);
                setState(() => _apps = decodedA.map((e) => AppointmentModel.fromMap(e)).toList());
              }
              final String? logsRaw = prefs.getString('c_adherence_logs_v1');
              if (logsRaw != null) {
                final List decodedL = jsonDecode(logsRaw);
                setState(() => _logs = decodedL.map((e) => AdherenceLogItem.fromMap(e)).toList());
              }
            }

