          class _Pneumatic3DButtonState extends State<Pneumatic3DButton> {
            bool _down = false;

            @override
            Widget build(BuildContext context) {
              final glowColor = widget.customGlow ?? widget.palette.glow;
              final bool pressed = _down || widget.isPushed;
              final double currentOffset = pressed ? widget.depth : 0.0;

