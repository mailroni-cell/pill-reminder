            // Language Picker Dialog
            void _openLanguagePicker() {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang] ?? dict['he']!;
              final palette = app.currentPalette;

              showModalBottomSheet(
                context: context,
                backgroundColor: palette.surface,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(28))),
                builder: (ctx) => SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        textChannel3D(t['select_language']!, fontSize: 20, color: palette.primary),
                        const SizedBox(height: 16),
                        Wrap(
                          spacing: 10,
                          runSpacing: 10,
                          children: appLanguages.map((l) {
                            final bool active = app.currentLang == l['code'];
                            return Pneumatic3DButton(
                              height: 44,
                              palette: palette,
                              isPushed: active,
                              onTap: () {
                                app.setLanguage(l['code']!);
                                Navigator.pop(ctx);
                              },
                              child: Padding(
                                padding: const EdgeInsets.symmetric(horizontal: 14),
                                child: Text(
                                  l['label']!,
                                  style: TextStyle(
                                    color: active ? palette.highlight : Colors.white,
                                    fontSize: 14,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                              ),
                            );
                          }).toList(),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            // Help Guide Modal Dialog
