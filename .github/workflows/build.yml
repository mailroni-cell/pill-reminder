                        bottom: MediaQuery.of(context).viewInsets.bottom + 30,
                      ),
                      child: SafeArea(
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(
                                t['add_appointment']!,
                                style: TextStyle(
                                  fontSize: 22,
                                  fontWeight: FontWeight.bold,
                                  color: hc ? Colors.yellowAccent : const Color(0xFFA855F7),
                                ),
                              ),
                              const SizedBox(height: 16),
                              Container(
                                padding: const EdgeInsets.symmetric(horizontal: 16),
                                decoration: cyber3D(radius: 18, isPressed: true, highContrast: hc),
                                child: TextField(
                                  controller: docCtrl,
                                  style: TextStyle(color: hc ? Colors.yellowAccent : Colors.purpleAccent),
                                  decoration: InputDecoration(
                                    border: InputBorder.none,
                                    hintText: t['doctor_name']!,
                                    hintStyle: TextStyle(color: hc ? Colors.yellow.shade100.withOpacity(0.5) : Colors.white38),
                                  ),
                                ),
                              ),
                              const SizedBox(height: 12),
                              Container(
                                padding: const EdgeInsets.symmetric(horizontal: 16),
                                decoration: cyber3D(radius: 18, isPressed: true, highContrast: hc),
                                child: TextField(
                                  controller: clinicCtrl,
                                  style: TextStyle(color: hc ? Colors.yellowAccent : Colors.white),
                                  decoration: InputDecoration(
                                    border: InputBorder.none,
                                    hintText: t['clinic']!,
                                    hintStyle: TextStyle(color: hc ? Colors.yellow.shade100.withOpacity(0.5) : Colors.white38),
                                  ),
                                ),
                              ),
                              const SizedBox(height: 16),
                              Row(
                                children: [
                                  Expanded(
                                    child: GestureDetector(
                                      onTap: () async {
                                        final picked = await showDatePicker(
                                          context: context,
                                          initialDate: selectedDate,
                                          firstDate: DateTime.now(),
                                          lastDate: DateTime.now().add(const Duration(days: 365)),
                                        );
                                        if (picked != null) setDlg(() => selectedDate = picked);
                                      },
                                      child: Container(
                                        padding: const EdgeInsets.symmetric(vertical: 14),
                                        decoration: cyber3D(radius: 16, highContrast: hc),
                                        child: Center(
                                          child: Text(
                                            '${selectedDate.day}/${selectedDate.month}/${selectedDate.year}',
                                            style: TextStyle(fontWeight: FontWeight.bold, color: hc ? Colors.yellowAccent : Colors.white),
                                          ),
                                        ),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  Expanded(
                                    child: GestureDetector(
                                      onTap: () async {
                                        final tPicked = await showTimePicker(
                                          context: context,
                                          initialTime: selectedTime,
                                        );
                                        if (tPicked != null) setDlg(() => selectedTime = tPicked);
                                      },
                                      child: Container(
                                        padding: const EdgeInsets.symmetric(vertical: 14),
                                        decoration: cyber3D(radius: 16, highContrast: hc),
                                        child: Center(
                                          child: Text(
                                            selectedTime.format(context),
                                            style: TextStyle(fontWeight: FontWeight.bold, color: hc ? Colors.yellowAccent : Colors.white),
                                          ),
                                        ),
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 22),
                              GestureDetector(
                                onTap: () {
                                  if (docCtrl.text.trim().isEmpty) return;
                                  setState(() {
                                    _apps.add(AppointmentModel(
                                      id: DateTime.now().millisecondsSinceEpoch.toString(),
                                      doctor: docCtrl.text.trim(),
                                      clinic: clinicCtrl.text.trim(),
                                      date: '${selectedDate.day}/${selectedDate.month}/${selectedDate.year}',
                                      time: selectedTime.format(context),
                                    ));
                                  });
                                  _saveApps();
                                  Navigator.pop(ctx);
                                },
                                child: Container(
                                  height: 52,
                                  decoration: cyber3D(radius: 20, highContrast: hc, glowColor: const Color(0xFFA855F7)),
                                  child: Center(
                                    child: Text(
                                      t['save']!,
                                      style: TextStyle(
                                        fontSize: 18,
                                        fontWeight: FontWeight.bold,
                                        color: hc ? Colors.yellowAccent : const Color(0xFFA855F7),
                                      ),
                                    ),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            void _openSettingsDialog() {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang]!;
              final hc = app.highContrast;

              final soundOptions = [
                {'key': 'electric', 'label': t['sound_electric']!},
                {'key': 'gong', 'label': t['sound_gong']!},
                {'key': 'alarm', 'label': t['sound_alarm']!},
                {'key': 'bell', 'label': t['sound_bell']!},
                {'key': 'voice_only', 'label': t['sound_voice_only']!},
              ];

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: hc ? Colors.black : const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(35))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx2, setDlg) => Directionality(
                    textDirection: (app.currentLang == 'he' || app.currentLang == 'ar') ? TextDirection.rtl : TextDirection.ltr,
                    child: SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.only(left: 20, right: 20, top: 24, bottom: 20),
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(
                                t['settings']!,
                                style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: hc ? Colors.yellowAccent : const Color(0xFF06B6D4)),
                              ),
                              const SizedBox(height: 18),
                              SwitchListTile(
                                title: Text(t['voice_alerts']!, style: TextStyle(color: hc ? Colors.yellowAccent : Colors.white)),
                                value: app.voiceAlerts,
                                onChanged: (v) => setDlg(() => app.updateSettings(voice: v)),
                              ),
                              SwitchListTile(
                                title: Text(t['high_contrast']!, style: TextStyle(color: hc ? Colors.yellowAccent : Colors.white)),
                                value: app.highContrast,
                                onChanged: (v) => setDlg(() => app.updateSettings(hc: v)),
                              ),
                              const SizedBox(height: 12),
                              Align(
                                alignment: (app.currentLang == 'he' || app.currentLang == 'ar') ? Alignment.centerRight : Alignment.centerLeft,
                                child: Text(t['alert_sound']!, style: TextStyle(color: hc ? Colors.yellowAccent : Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                              ),
                              const SizedBox(height: 8),
                              // Scrollable dedicated tone picker
                              Container(
                                height: 160,
                                decoration: cyber3D(radius: 18, highContrast: hc),
                                child: ListView.builder(
                                  itemCount: soundOptions.length,
                                  itemBuilder: (ctx3, sIdx) {
                                    final opt = soundOptions[sIdx];
                                    final bool selected = app.soundType == opt['key'];
                                    return ListTile(
                                      title: Text(opt['label']!, style: TextStyle(color: selected ? (hc ? Colors.yellowAccent : Colors.cyanAccent) : (hc ? Colors.white70 : Colors.white60), fontWeight: selected ? FontWeight.bold : FontWeight.normal)),
                                      trailing: selected ? Icon(Icons.check_circle, color: hc ? Colors.yellowAccent : const Color(0xFF06B6D4)) : null,
                                      onTap: () {
                                        setDlg(() => app.updateSettings(sound: opt['key']));
                                      },
                                    );
                                  },
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            void _openLanguagePicker() {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang]!;
              final hc = app.highContrast;

              showModalBottomSheet(
                context: context,
                backgroundColor: hc ? Colors.black : const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(30))),
                builder: (ctx) => SafeArea(
                  child: ListView(
                    shrinkWrap: true,
                    padding: const EdgeInsets.symmetric(vertical: 20),
                    children: [
                      _langTile('עברית (Hebrew)', 'he'),
                      _langTile('English (English)', 'en'),
                      _langTile('Русский (Russian)', 'ru'),
                      _langTile('Română (Romanian)', 'ro'),
                      _langTile('العربية (Arabic)', 'ar'),
                      _langTile('Deutsch (German)', 'de'),
                    ],
                  ),
                ),
              );
            }

            Widget _langTile(String label, String code) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang]!;
              final hc = app.highContrast;
              return Container(
                margin: const EdgeInsets.symmetric(horizontal: 20, vertical: 6),
                decoration: cyber3D(radius: 16, highContrast: hc),
                child: ListTile(
                  title: Text(label, style: TextStyle(color: hc ? Colors.yellowAccent : Colors.white, fontWeight: FontWeight.bold)),
                  trailing: app.currentLang == code ? Icon(Icons.check, color: hc ? Colors.yellowAccent : const Color(0xFF06B6D4)) : null,
                  onTap: () {
                    Navigator.pop(context);
                    ScaffoldMessenger.of(context).showSnackBar(
                      SnackBar(content: Text(t['lang_change_alert']!), duration: const Duration(seconds: 1)),
                    );
                    app.setLanguage(code);
                  },
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang]!;
              final hc = app.highContrast;

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  centerTitle: true,
                  title: Column(
                    children: [
                      Text(
                        t['app_name']!,
                        style: TextStyle(
                          fontWeight: FontWeight.w900,
                          fontSize: 22,
                          color: hc ? Colors.yellowAccent : const Color(0xFF06B6D4),
                        ),
                      ),
                      Text(
                        '${t['welcome']!}, ${app.userName}',
                        style: TextStyle(fontSize: 13, color: hc ? Colors.yellow.shade100 : Colors.white60),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: Icon(Icons.language, color: hc ? Colors.yellowAccent : null),
                      onPressed: _openLanguagePicker,
                    ),
                    IconButton(
                      icon: Icon(Icons.settings, color: hc ? Colors.yellowAccent : null),
                      onPressed: _openSettingsDialog,
                    ),
                  ],
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: hc ? Colors.yellowAccent : const Color(0xFF06B6D4),
                    labelColor: hc ? Colors.yellowAccent : const Color(0xFF06B6D4),
                    unselectedLabelColor: hc ? Colors.white38 : Colors.white38,
                    tabs: [
                      Tab(icon: const Icon(Icons.medication), text: t['meds_tab']!),
                      Tab(icon: const Icon(Icons.event_note), text: t['appointments_tab']!),
                    ],
                  ),
                ),
                body: SafeArea(
                  child: TabBarView(
                    controller: _tabController,
                    children: [
                      // Medicines Tab (Grouped Schedules)
                      _schedules.isEmpty
                          ? Center(child: Text(t['empty_meds']!, style: TextStyle(color: hc ? Colors.yellow.shade100 : Colors.white38, fontSize: 18)))
                          : ListView.builder(
                              padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 90),
                              itemCount: _schedules.length,
                              itemBuilder: (ctx, i) {
                                final sched = _schedules[i];
                                final timeStr = '${sched.hour.toString().padLeft(2, '0')}:${sched.minute.toString().padLeft(2, '0')}';
                                return Container(
                                  margin: const EdgeInsets.only(bottom: 16),
                                  decoration: cyber3D(radius: 22, isPressed: sched.isTaken, highContrast: hc),
                                  child: ListTile(
                                    contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                                    leading: Container(
                                      width: 46,
                                      height: 46,
                                      decoration: cyber3D(radius: 14, isPressed: sched.isTaken, highContrast: hc),
                                      child: Icon(
                                        sched.isTaken ? Icons.check_circle : Icons.alarm,
                                        color: sched.isTaken ? Colors.greenAccent : (hc ? Colors.yellowAccent : const Color(0xFF06B6D4)),
                                      ),
                                    ),
                                    title: Text(
                                      sched.title.isNotEmpty ? sched.title : timeStr,
                                      style: TextStyle(
                                        fontSize: 18,
                                        fontWeight: FontWeight.bold,
                                        color: hc ? Colors.yellowAccent : Colors.white,
                                        decoration: sched.isTaken ? TextDecoration.lineThrough : null,
                                      ),
                                    ),
                                    subtitle: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Text('$timeStr • ${sched.pills.length} תרופות בתזמון', style: TextStyle(color: hc ? Colors.white : Colors.white70)),
                                        ...sched.pills.map((p) => Text('• ${p.name} (${p.dosage} כד\')', style: TextStyle(color: hc ? Colors.yellow.shade100 : Colors.cyanAccent))),
                                      ],
                                    ),
                                    trailing: IconButton(
                                      icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                      onPressed: () {
                                        setState(() => _schedules.removeAt(i));
                                        _saveSchedules();
                                      },
                                    ),
                                    onTap: () => _showAlarmActionDialog(sched),
                                  ),
                                );
                              },
                            ),
                      // Appointments Tab
                      _apps.isEmpty
                          ? Center(child: Text(t['empty_apps']!, style: TextStyle(color: hc ? Colors.yellow.shade100 : Colors.white38, fontSize: 18)))
                          : ListView.builder(
                              padding: const EdgeInsets.only(left: 18, right: 18, top: 18, bottom: 90),
                              itemCount: _apps.length,
                              itemBuilder: (ctx, i) {
                                final appItem = _apps[i];
                                return Container(
                                  margin: const EdgeInsets.only(bottom: 16),
                                  decoration: cyber3D(radius: 22, highContrast: hc, glowColor: const Color(0xFFA855F7)),
                                  child: ListTile(
                                    contentPadding: const EdgeInsets.all(14),
                                    leading: Icon(Icons.medical_services_outlined, size: 36, color: hc ? Colors.yellowAccent : const Color(0xFFA855F7)),
                                    title: Text(
                                      appItem.doctor,
                                      style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: hc ? Colors.yellowAccent : Colors.white),
                                    ),
                                    subtitle: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        if (appItem.clinic.isNotEmpty) Text(appItem.clinic, style: TextStyle(color: hc ? Colors.white70 : Colors.white70)),
                                        Text('${appItem.date}  •  ${appItem.time}', style: TextStyle(color: hc ? Colors.cyanAccent : const Color(0xFF38BDF8), fontWeight: FontWeight.bold)),
                                      ],
                                    ),
                                    trailing: IconButton(
                                      icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                      onPressed: () {
                                        setState(() => _apps.removeAt(i));
                                        _saveApps();
                                      },
                                    ),
                                  ),
                                );
                              },
                            ),
                    ],
                  ),
                ),
                floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                floatingActionButton: Padding(
                  padding: const EdgeInsets.only(bottom: 12),
                  child: GestureDetector(
                    onTap: () {
                      if (_tabController.index == 0) {
                        _openAddScheduleDialog();
                      } else {
                        _openAddAppointmentDialog();
                      }
                    },
                    child: Container(
                      padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),
                      decoration: cyber3D(radius: 28, highContrast: hc, glowColor: const Color(0xFF06B6D4)),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.add, color: hc ? Colors.yellowAccent : Colors.white),
                          const SizedBox(width: 8),
                          Text(
                            _tabController.index == 0 ? t['add_med']! : t['add_appointment']!,
                            style: TextStyle(
                              fontWeight: FontWeight.bold,
                              fontSize: 16,
                              color: hc ? Colors.yellowAccent : Colors.white,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
