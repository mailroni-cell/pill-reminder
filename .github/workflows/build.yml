                                          Text('$timeStr • ${(t['pills_count'] ?? '{n} תרופות').replaceAll('{n}', sched.pills.length.toString())}', style: const TextStyle(fontSize: 14, color: Colors.white, fontWeight: FontWeight.bold)),
                                          const SizedBox(height: 2),
                                          ...sched.pills.map((p) {
                                            final String dLabel = t['dosage_label'] ?? 'מינון';
                                            return Text('• ${p.name} ($dLabel: ${p.dosage})', style: TextStyle(fontSize: hc ? 17 : 14, color: hc ? const Color(0xFFFFE500) : palette.highlight, fontWeight: FontWeight.w900));
                                          }),
                                        ],
                                      ),
                                      trailing: Row(
                                        mainAxisSize: MainAxisSize.min,
                                        children: [
                                          Pneumatic3DButton(
                                            height: 40,
                                            width: 44,
                                            palette: palette,
                                            onTap: () => _previewScheduleAudio(sched),
                                            child: Icon(Icons.play_arrow_rounded, color: palette.highlight, size: 24),
                                          ),
                                          const SizedBox(width: 8),
                                          IconButton(
                                            icon: const Icon(Icons.delete_forever, color: Colors.redAccent),
                                            onPressed: () {
                                              HapticFeedback.mediumImpact();
                                              setState(() => _schedules.removeAt(i));
                                              _saveSchedules();
                                            },
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),

                        // Doctor Appointments Tab (With Top-tier Z-Index Navigation Bar)
                        _apps.isEmpty
                            ? Center(child: textChannel3D(t['empty_apps']!, fontSize: hc ? 22 : 18, color: hc ? const Color(0xFFFFE500) : Colors.white70))
                            : ListView.builder(
                                padding: const EdgeInsets.only(left: 16, right: 16, top: 16, bottom: 95),
                                itemCount: _apps.length,
                                itemBuilder: (ctx, i) {
                                  final appItem = _apps[i];
                                  final String navAddress = appItem.clinic.trim().isNotEmpty
                                      ? appItem.clinic.trim()
                                      : (appItem.doctor.trim().isNotEmpty ? appItem.doctor.trim() : '');

                                  return MechModuleCard(
                                    accentColor: palette.primary,
                                    showLed: true,
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Row(
                                          children: [
                                            Icon(Icons.local_hospital_rounded, size: 34, color: hc ? const Color(0xFFFFE500) : palette.primary),
                                            const SizedBox(width: 10),
                                            Expanded(
                                              child: textChannel3D(
                                                () {
                                                  String locType = appItem.type;
                                                  if (appItem.type == 'רופא' || appItem.type.toLowerCase().contains('doc') || appItem.type == dict['en']?['doc_doctor']) locType = t['doc_doctor']!;
                                                  else if (appItem.type == 'אחות' || appItem.type.toLowerCase().contains('nurse') || appItem.type == dict['en']?['doc_nurse']) locType = t['doc_nurse']!;
                                                  else if (appItem.type == 'בדיקה' || appItem.type.toLowerCase().contains('test') || appItem.type == dict['en']?['doc_test']) locType = t['doc_test']!;
                                                  else if (appItem.type == 'טיפול' || appItem.type.toLowerCase().contains('treatment') || appItem.type == dict['en']?['doc_treatment']) locType = t['doc_treatment']!;
                                                  return '$locType: ${appItem.doctor}';
                                                }(),
                                                fontSize: hc ? 20 : 17,
                                                color: hc ? const Color(0xFFFFE500) : Colors.white,
                                              ),
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                              onPressed: () {
                                                HapticFeedback.mediumImpact();
                                                setState(() => _apps.removeAt(i));
                                                _saveApps();
                                              },
                                            ),
                                          ],
                                        ),
                                        const SizedBox(height: 6),
                                        Row(
                                          children: [
                                            Icon(Icons.schedule, size: 16, color: palette.highlight),
                                            const SizedBox(width: 6),
                                            Text(
                                              '${appItem.date}  •  ${appItem.time}',
                                              style: TextStyle(fontSize: hc ? 16 : 14, color: hc ? Colors.cyanAccent : palette.highlight, fontWeight: FontWeight.w900),
                                            ),
                                          ],
                                        ),
                                        const SizedBox(height: 6),
                                        Row(
                                          children: [
                                            const Icon(Icons.location_on_rounded, size: 16, color: Colors.redAccent),
                                            const SizedBox(width: 6),
                                            Expanded(
                                              child: Text(
                                                appItem.clinic.isNotEmpty ? appItem.clinic : (t['no_address'] ?? 'לא צוינה כתובת'),
                                                style: const TextStyle(fontSize: 14, color: Colors.white, fontWeight: FontWeight.bold),
                                                overflow: TextOverflow.ellipsis,
                                              ),
                                            ),
                                          ],
                                        ),
                                        const SizedBox(height: 6),
                                        Row(
                                          children: [
                                            Icon(Icons.alarm_on_rounded, size: 16, color: palette.highlight),
                                            const SizedBox(width: 6),
                                            Text(
                                              '${t['reminder_time_title'] ?? "התרעה"}: ' + () {
                                                final rb = appItem.reminderMinutesBefore;
                                                if (rb == 0) return t['remind_at_time'] ?? 'במועד התור';
                                                if (rb == 15) return t['remind_15m'] ?? '15 דק׳ לפני';
                                                if (rb == 30) return t['remind_30m'] ?? '30 דק׳ לפני';
                                                if (rb == 60) return t['remind_1h'] ?? 'שעה לפני';
                                                if (rb == 120) return t['remind_2h'] ?? 'שעתיים לפני';
                                                if (rb == 1440) return t['remind_1d'] ?? 'יום לפני';
                                                return '$rb min';
                                              }(),
                                              style: TextStyle(fontSize: 13, color: palette.highlight, fontWeight: FontWeight.bold),
                                            ),
                                          ],
                                        ),
                                        const SizedBox(height: 10),
                                        // Dedicated Elevated Real Navigation Bar (Waze & Google Maps)
                                        Container(
                                          decoration: BoxDecoration(
                                            color: Colors.black.withOpacity(0.55),
                                            borderRadius: BorderRadius.circular(14),
                                            border: Border.all(color: palette.primary.withOpacity(0.4), width: 1.5),
                                            boxShadow: [
                                              BoxShadow(
                                                color: Colors.black.withOpacity(0.6),
                                                blurRadius: 6,
                                                offset: const Offset(0, 3),
                                              ),
                                            ],
                                          ),
                                          padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                                          child: Row(
                                            children: [
                                              Expanded(
                                                child: Pneumatic3DButton(
                                                  height: 40,
                                                  palette: palette,
                                                  customGlow: const Color(0xFF00D1FF),
                                                  onTap: () => _launchMap(navAddress, true),
                                                  child: Row(
                                                    mainAxisAlignment: MainAxisAlignment.center,
                                                    children: const [
                                                      Icon(Icons.navigation_rounded, size: 18, color: Color(0xFF00D1FF)),
                                                      SizedBox(width: 6),
                                                      Text(
                                                        'Waze',
                                                        style: TextStyle(color: Color(0xFF00D1FF), fontWeight: FontWeight.w900, fontSize: 13),
                                                      ),
                                                    ],
                                                  ),
                                                ),
                                              ),
                                              const SizedBox(width: 10),
                                              Expanded(
                                                child: Pneumatic3DButton(
                                                  height: 40,
                                                  palette: palette,
                                                  customGlow: const Color(0xFF34A853),
                                                  onTap: () => _launchMap(navAddress, false),
                                                  child: Row(
                                                    mainAxisAlignment: MainAxisAlignment.center,
                                                    children: const [
                                                      Icon(Icons.map_rounded, size: 18, color: Color(0xFF34A853)),
                                                      SizedBox(width: 6),
                                                      Text(
                                                        'Google Maps',
                                                        style: TextStyle(color: Color(0xFF34A853), fontWeight: FontWeight.w900, fontSize: 13),
                                                      ),
                                                    ],
                                                  ),
                                                ),
                                              ),
                                            ],
                                          ),
                                        ),
                                      ],
                                    ),
                                  );
                                },
                              ),
                      ],
                    ),
                  ),
                  // Dynamic Bottom Confirmation Button: Changes between 'צור תזמון' and 'קבע תור' with distinct spacing
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: Pneumatic3DButton(
                    height: 60,
                    palette: palette,
                    customGlow: _activeTabIndex == 0 ? palette.glow : const Color(0xFF00E5FF),
                    onTap: () {
                      HapticFeedback.mediumImpact();
                      if (_activeTabIndex == 0) {
                        _openAddScheduleDialog();
                      } else {
                        _openAddAppointmentDialog();
                      }
                    },
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 26),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(
                            _activeTabIndex == 0 ? Icons.add_alarm_rounded : Icons.event_available_rounded,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                            size: 26,
                          ),
                          const SizedBox(width: 10),
                          textChannel3D(
                            _activeTabIndex == 0
                                ? (t['save_schedule_action'] ?? 'צור תזמון')
                                : (t['book_appointment_action'] ?? 'קבע תור'),
                            fontSize: hc ? 19 : 17,
                            color: hc ? const Color(0xFFFFE500) : Colors.white,
                            wordSpacing: 3.0,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            );
          }

          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

