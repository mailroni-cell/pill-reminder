          BoxDecoration cyber3D({
            required BuildContext context,
            double radius = 22,
            bool isPressed = false,
            bool highContrast = false,
            Color? customGlow,
            bool isMetallic = false,
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? const Color(0xFF242200) : Colors.black,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: const Color(0xFFFFE500), width: 3.5),
                boxShadow: const [
                  BoxShadow(color: Color(0xFFFFE500), blurRadius: 14, spreadRadius: 2)
                ],
              );
            }

            final app = CyberPillMasterApp.of(context);
            final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
            final Color surface = palette['surface']!;
            final Color bg = palette['bg']!;
            final Color glow = customGlow ?? palette['accent']!;
            final Color bevel = palette['bevel'] ?? const Color(0xFF1E3A6D);

            if (isPressed) {
              return BoxDecoration(
                color: surface.withOpacity(0.95),
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: glow.withOpacity(0.9), width: 2.4),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.95), offset: const Offset(5, 5), blurRadius: 12, spreadRadius: -2),
                  BoxShadow(color: glow.withOpacity(0.4), offset: const Offset(-2, -2), blurRadius: 8),
                ],
              );
            }

            return BoxDecoration(
              gradient: LinearGradient(
                colors: isMetallic
                    ? [surface.withOpacity(0.98), bevel.withOpacity(0.8), bg.withOpacity(0.95)]
                    : [surface.withOpacity(0.94), bevel.withOpacity(0.5), bg.withOpacity(0.9)],
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
              ),
              borderRadius: BorderRadius.circular(radius),
              border: Border.all(color: glow.withOpacity(0.75), width: 2.0),
              boxShadow: [
                BoxShadow(color: Colors.black.withOpacity(0.95), offset: const Offset(0, 12), blurRadius: 24),
                BoxShadow(color: glow.withOpacity(0.4), offset: const Offset(-3, -3), blurRadius: 14),
                BoxShadow(color: glow.withOpacity(0.18), blurRadius: 18, spreadRadius: 2),
              ],
            );
          }

