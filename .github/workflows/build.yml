            // Fixed Preset Buttons: Mute, 25%, 50%, 75%, 100%
            Row(
              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
              children: [0.0, 0.25, 0.50, 0.75, 1.0].map((preset) {
                final bool isCurr = (_currentVol * 100).round() == (preset * 100).round();
                final String label = preset == 0.0 ? muteLabel : '${(preset * 100).toInt()}%';
                return Expanded(
                  child: Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 3),
                    child: SizedBox(
                      height: 38,
                      child: Pneumatic3DButton(
                        height: 38,
                        palette: palette,
                        isPushed: isCurr,
                        customGlow: isCurr ? accentColor : Colors.transparent,
                        onTap: () {
                          HapticFeedback.lightImpact();
                          _updateVolume(preset);
                          SoundGenerator.playAlertTone('bell', preset);
                        },
                        child: FittedBox(
                          fit: BoxFit.scaleDown,
                          child: Text(
                            label,
                            style: TextStyle(
                              color: isCurr ? highlightColor : Colors.white70,
                              fontWeight: FontWeight.bold,
                              fontSize: 12,
                              decoration: TextDecoration.none,
                            ),
                          ),
                        ),
                      ),
                    ),
                  ),
                );
              }).toList(),
            ),
          ],
          ),
          ),
          );
          }
          }

          class Multi3DGraphicsPainter extends CustomPainter {
            final double progress;
            final ThemePalette palette;
            final String style;

            Multi3DGraphicsPainter({
              required this.progress,
              required this.palette,
              required this.style,
            });

            @override
            void paint(Canvas canvas, Size size) {
              if (size.width <= 0 || size.height <= 0) return;
              canvas.save();
              // STRICT CLIPPING TO SCREEN BOUNDARIES: No element ever spills out
              canvas.clipRect(Rect.fromLTWH(0, 0, size.width, size.height));

              switch (style) {
                case 'butterflies':
                  _paint3DButterflies(canvas, size);
                  break;
                case 'planets':
                  _paint3DPlanetarySystem(canvas, size);
                  break;
                case 'flowers':
                  _paint3DLotusFlowers(canvas, size);
                  break;
                case 'space':
                  _paint3DSpaceWarp(canvas, size);
                  break;
                case 'aurora':
                  _paint3DAuroraWaves(canvas, size);
                  break;
                case 'fireflies':
                  _paint3DFireflyForest(canvas, size);
                  break;
                case 'tunnel':
                  _paintTronTunnel(canvas, size);
                  break;
                case 'blackhole':
                  _paint3DBlackHole(canvas, size);
                  break;
                case 'reactor':
                  _paint3DIndustrialReactor(canvas, size);
                  break;
                case 'crystal':
                  _paint3DCrystalLattice(canvas, size);
                  break;
                case 'dna':
                  _paint3DDNAHelix(canvas, size);
                  break;
                case 'supernova':
                  _paint3DSupernova(canvas, size);
                  break;
                case 'matrix':
                  _paint3DMatrixRain(canvas, size);
                  break;
                case 'nebula':
                  _paint3DNebulaStorm(canvas, size);
                  break;
                default:
                  _paint3DButterflies(canvas, size);
                  break;
              }

              canvas.restore();
            }

            // 1. פרפרים זרחניים תלת-מימדיים עם עומק Z ונפנוף כנפיים ריאליסטי (3D Cyber Butterflies)
            void _paint3DButterflies(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int bCount = 9;
              final hues = [
                palette.highlight,
                palette.primary,
                const Color(0xFF00FFCC),
                const Color(0xFFFF007F),
                const Color(0xFFFFD700),
              ];

              for (int i = 0; i < bCount; i++) {
                final double seed = i * 137.5;
                final double speed = 0.7 + (i % 3) * 0.25;
                final double phase = (progress * speed + seed) % 1.0;

                // 3D Lissajous orbit in space
                final double rawX = (size.width * 0.42) * math.sin(phase * 2 * math.pi + seed);
                final double rawY = (size.height * 0.38) * math.sin(phase * 4 * math.pi + seed * 0.5);
                final double rawZ = 200.0 + 150.0 * math.cos(phase * 3 * math.pi + seed);

                // 3D perspective projection
                final double fov = 320.0;
                final double scale = (fov / (fov + rawZ)).clamp(0.25, 1.25);
                final double sx = cx + rawX * scale;
                final double sy = cy + rawY * scale;

                // Screen boundary check
                if (sx < -20 || sx > size.width + 20 || sy < -20 || sy > size.height + 20) continue;

                final Color bColor = hues[i % hues.length];
                final double flap = math.sin(progress * 8 * 2 * math.pi + seed * 2.0);
                final double wingSpan = 22.0 * scale;
                final double wingH = 16.0 * scale;
                final double alpha = (scale * 0.9).clamp(0.2, 0.95);

                canvas.save();
                canvas.translate(sx, sy);
                canvas.rotate(math.sin(phase * 2 * math.pi) * 0.4);

                // Glowing trailing particles behind butterfly
                for (int p = 1; p <= 4; p++) {
                  final double pLag = (phase - p * 0.015) % 1.0;
                  final double px = (size.width * 0.42) * math.sin(pLag * 2 * math.pi + seed) * scale;
                  final double py = (size.height * 0.38) * math.sin(pLag * 4 * math.pi + seed * 0.5) * scale;
                  canvas.drawCircle(
                    Offset(px - rawX * scale, py - rawY * scale),
                    (2.5 - p * 0.4) * scale,
                    Paint()..color = bColor.withOpacity(alpha * (0.6 / p))..maskFilter = const MaskFilter.blur(BlurStyle.solid, 2),
                  );
                }

                // 3D Left Wing with perspective flap
                final Path leftWing = Path();
                leftWing.moveTo(0, 0);
                leftWing.cubicTo(-wingSpan * flap.abs(), -wingH * 1.3, -wingSpan * 1.2 * flap.abs(), wingH * 0.4, 0, wingH * 0.3);
                canvas.drawPath(
                  leftWing,
                  Paint()
                    ..shader = LinearGradient(colors: [bColor.withOpacity(alpha), bColor.withOpacity(0.15)]).createShader(Rect.fromLTWH(-wingSpan, -wingH, wingSpan, wingH * 1.5))
                    ..style = PaintingStyle.fill,
                );
                canvas.drawPath(
                  leftWing,
                  Paint()..color = bColor.withOpacity(alpha)..style = PaintingStyle.stroke..strokeWidth = 1.3 * scale,
                );

                // 3D Right Wing
                final Path rightWing = Path();
                rightWing.moveTo(0, 0);
                rightWing.cubicTo(wingSpan * flap.abs(), -wingH * 1.3, wingSpan * 1.2 * flap.abs(), wingH * 0.4, 0, wingH * 0.3);
                canvas.drawPath(
                  rightWing,
                  Paint()
                    ..shader = LinearGradient(colors: [bColor.withOpacity(alpha), bColor.withOpacity(0.15)]).createShader(Rect.fromLTWH(0, -wingH, wingSpan, wingH * 1.5))
                    ..style = PaintingStyle.fill,
                );
                canvas.drawPath(
                  rightWing,
                  Paint()..color = bColor.withOpacity(alpha)..style = PaintingStyle.stroke..strokeWidth = 1.3 * scale,
                );

                // Glowing Butterfly Torso & Antennae
                canvas.drawOval(
                  Rect.fromCenter(center: Offset.zero, width: 3.5 * scale, height: 11 * scale),
                  Paint()..color = Colors.white.withOpacity(alpha)..maskFilter = const MaskFilter.blur(BlurStyle.solid, 2),
                );

                canvas.restore();
              }
            }

            // 2. מערכת כוכבי לכת וגירוסקופ תלת-מימדי (3D Celestial Gyroscope & Orbitals)
            void _paint3DPlanetarySystem(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.45;

              // 1. Central Blazing Sun with Multi-Harmonic Corona
              final sunRadius = 26.0;
              final sunRect = Rect.fromCircle(center: Offset(cx, cy), radius: sunRadius * 1.8);
              canvas.drawCircle(
                Offset(cx, cy),
                sunRadius * 2.2,
                Paint()
                  ..shader = RadialGradient(
                    colors: [palette.highlight.withOpacity(0.85), palette.primary.withOpacity(0.3), Colors.transparent],
                    stops: const [0.0, 0.45, 1.0],
                  ).createShader(sunRect),
              );
              canvas.drawCircle(
                Offset(cx, cy),
                sunRadius,
                Paint()
                  ..shader = RadialGradient(
                    colors: [Colors.white, palette.highlight, palette.primary],
                    stops: const [0.0, 0.5, 1.0],
                  ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: sunRadius)),
              );

              // 2. Three 3D Multi-Axis Gyroscope Rings
              final ringAngles = [
                progress * 2 * math.pi,
                -progress * 2.0 * math.pi + 1.2,
                progress * 2.0 * math.pi + 2.4,
              ];
              final ringRadii = [maxR * 0.55, maxR * 0.78, maxR * 0.98];

              for (int r = 0; r < 3; r++) {
                final double rRadius = ringRadii[r];
                final double angle = ringAngles[r];
                final Path ringFront = Path();
                final Path ringBack = Path();
                const int segments = 40;

                for (int s = 0; s <= segments; s++) {
                  final double theta = (s / segments) * 2 * math.pi;
                  // 3D Ring point rotated around Y and X axes
                  final double x0 = rRadius * math.cos(theta);
                  final double y0 = rRadius * math.sin(theta);
                  // Rotate around X (tilt) and Y (spin)
                  final double tilt = 0.75 + r * 0.35;
                  final double y1 = y0 * math.cos(tilt);
                  final double z1 = y0 * math.sin(tilt);

                  final double x2 = x0 * math.cos(angle) - z1 * math.sin(angle);
                  final double z2 = x0 * math.sin(angle) + z1 * math.cos(angle);

                  final double fov = 380.0;
                  final double pScale = fov / (fov + z2);
                  final double sx = cx + x2 * pScale;
                  final double sy = cy + y1 * pScale;

                  if (z2 >= 0) {
                    if (ringFront.getBounds().isEmpty) {
                      ringFront.moveTo(sx, sy);
                    } else {
                      ringFront.lineTo(sx, sy);
                    }
                  } else {
                    if (ringBack.getBounds().isEmpty) {
                      ringBack.moveTo(sx, sy);
                    } else {
                      ringBack.lineTo(sx, sy);
                    }
                  }
                }

                // Draw Back of Ring (behind central sun)
                canvas.drawPath(
                  ringBack,
                  Paint()
                    ..color = (r == 0 ? palette.highlight : (r == 1 ? palette.primary : const Color(0xFF00FFCC))).withOpacity(0.22)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.4,
                );

                // Draw Front of Ring (in front of central sun with glow)
                canvas.drawPath(
                  ringFront,
                  Paint()
                    ..color = (r == 0 ? palette.highlight : (r == 1 ? palette.primary : const Color(0xFF00FFCC))).withOpacity(0.75)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.2
                    ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 2),
                );
              }

              // 3. Orbiting 3D Shaded Spherical Planets
              for (int p = 0; p < 4; p++) {
                final double pSpeed = 0.5 + p * 0.35;
                final double pAngle = (progress * pSpeed * 2 * math.pi + p * 1.57) % (2 * math.pi);
                final double pDist = maxR * (0.35 + p * 0.18);
                final double tilt = 0.55 + p * 0.2;

                final double px = pDist * math.cos(pAngle);
                final double pz = pDist * math.sin(pAngle);
                final double py = (pDist * 0.3) * math.sin(pAngle) * math.sin(tilt);

                final double fov = 380.0;
                final double scale = fov / (fov + pz);
                final double sx = cx + px * scale;
                final double sy = cy + py * scale;
                final double pr = (7.0 + p * 2.2) * scale;
                final double alpha = (scale * 0.95).clamp(0.25, 1.0);

                final Color planetColor = [
                  const Color(0xFF00F0FF),
                  const Color(0xFFFF2A85),
                  const Color(0xFF00FF88),
                  const Color(0xFFFFD700),
                ][p];

                // 3D Spherical Light Shader
                final pRect = Rect.fromCircle(center: Offset(sx, sy), radius: pr);
                canvas.drawCircle(
                  Offset(sx, sy),
                  pr,
                  Paint()
                    ..shader = RadialGradient(
                      center: const Alignment(-0.35, -0.35),
                      colors: [Colors.white, planetColor, Colors.black],
                      stops: const [0.0, 0.55, 1.0],
                    ).createShader(pRect),
                );

                // Small moon for planet 2 and 3
                if (p == 1 || p == 2) {
                  final double mAngle = progress * 8 * math.pi + p;
                  final double mx = sx + math.cos(mAngle) * (pr * 2.4);
                  final double my = sy + math.sin(mAngle) * (pr * 1.2);
                  canvas.drawCircle(
                    Offset(mx, my),
                    pr * 0.35,
                    Paint()..color = palette.highlight.withOpacity(alpha),
                  );
                }
              }
            }

            // 3. פרחי לוטוס ומנדלת גיאומטריה מקודשת 3D (3D Blooming Sacred Geometry Lotus)
            void _paint3DLotusFlowers(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.44;

              // Concentric rotating sacred rings
              for (int r = 1; r <= 3; r++) {
                final double ringR = maxR * (r / 3.0);
                canvas.drawCircle(
                  Offset(cx, cy),
                  ringR,
                  Paint()
                    ..color = palette.highlight.withOpacity(0.12)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.0,
                );
              }

              // 3 Tiers of Blooming Lotus Petals in 3D Perspective
              const int tiers = 3;
              for (int tier = 0; tier < tiers; tier++) {
                final double tierR = maxR * (0.45 + tier * 0.26);
                final int petals = 8 + tier * 4;
                final double rot = math.sin(progress * 2 * math.pi) * (tier % 2 == 0 ? 0.45 : -0.35);
                final double bloom = 0.85 + 0.15 * math.sin(progress * 4 * math.pi + tier);
                final double alpha = (0.75 - tier * 0.18).clamp(0.2, 0.85);

                for (int i = 0; i < petals; i++) {
                  final double a = (i / petals) * 2 * math.pi + rot;
                  final double pLen = tierR * bloom;
                  final double pW = (pLen * 0.38) * (1.0 - tier * 0.15);

                  final double tipX = cx + math.cos(a) * pLen;
                  final double tipY = cy + math.sin(a) * pLen;

                  final double leftAngle = a + 0.35;
                  final double rightAngle = a - 0.35;

                  final double ctrlLX = cx + math.cos(leftAngle) * (pLen * 0.65);
                  final double ctrlLY = cy + math.sin(leftAngle) * (pLen * 0.65);
                  final double ctrlRX = cx + math.cos(rightAngle) * (pLen * 0.65);
                  final double ctrlRY = cy + math.sin(rightAngle) * (pLen * 0.65);

                  final Path petalPath = Path();
                  petalPath.moveTo(cx, cy);
                  petalPath.quadraticBezierTo(ctrlLX, ctrlLY, tipX, tipY);
                  petalPath.quadraticBezierTo(ctrlRX, ctrlRY, cx, cy);

                  final Color petalColor = tier == 0 ? palette.highlight : (tier == 1 ? palette.primary : const Color(0xFF00FFCC));

                  canvas.drawPath(
                    petalPath,
                    Paint()
                      ..shader = LinearGradient(
                        begin: Alignment.center,
                        end: Alignment.bottomRight,
                        colors: [petalColor.withOpacity(alpha * 0.5), Colors.transparent],
                      ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: tierR))
                      ..style = PaintingStyle.fill,
                  );

                  canvas.drawPath(
                    petalPath,
                    Paint()
                      ..color = petalColor.withOpacity(alpha)
                      ..style = PaintingStyle.stroke
                      ..strokeWidth = 1.5,
                  );
                }
              }

              // Glowing Golden Core Crystal
              canvas.drawCircle(
                Offset(cx, cy),
                18,
                Paint()
                  ..shader = RadialGradient(
                    colors: [Colors.white, const Color(0xFFFFD700), palette.primary],
                  ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: 18))
                  ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 4),
              );
            }

            // 4. שדה כוכבים תלת-מימדי בעיוות מהירות אור (3D Relativistic Starfield Warp)
            void _paint3DSpaceWarp(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int starCount = 130;

              // Distant rotating galactic vortex at center
              final double gRot = progress * 2 * math.pi;
              for (int a = 0; a < 3; a++) {
                final double armOffset = a * (2 * math.pi / 3);
                final Path arm = Path();
                for (double r = 8; r < 75; r += 4) {
                  final double theta = gRot + armOffset + (r * 0.06);
                  final double gx = cx + math.cos(theta) * r;
                  final double gy = cy + math.sin(theta) * (r * 0.6);
                  if (r == 8) arm.moveTo(gx, gy); else arm.lineTo(gx, gy);
                }
                canvas.drawPath(
                  arm,
                  Paint()
                    ..color = palette.highlight.withOpacity(0.25)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.0
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 3),
                );
              }

              // 130 3D Warp Stars traveling through depth Z
              for (int i = 0; i < starCount; i++) {
                final double seed = i * 277.3;
                final double speed = 1.0 + (i % 4) * 0.5;
                final double p = (progress * speed + seed) % 1.0;

                // Z goes from 1000 (far) to 20 (close)
                final double z = (1.0 - p) * 980.0 + 20.0;
                final double prevZ = z + 40.0;

                final double rawX = math.cos(seed) * (size.width * 0.85);
                final double rawY = math.sin(seed * 1.3) * (size.height * 0.85);

                final double fov = 260.0;
                final double sx = cx + (rawX * fov / z);
                final double sy = cy + (rawY * fov / z);
                final double prevSx = cx + (rawX * fov / prevZ);
                final double prevSy = cy + (rawY * fov / prevZ);

                if (sx < 0 || sx > size.width || sy < 0 || sy > size.height) continue;

                final double intensity = (1.0 - (z / 1000.0)).clamp(0.1, 1.0);
                final Color starColor = (i % 3 == 0) ? palette.highlight : ((i % 3 == 1) ? palette.primary : Colors.white);

                // Hyperdrive motion streak
                canvas.drawLine(
                  Offset(prevSx, prevSy),
                  Offset(sx, sy),
                  Paint()
                    ..color = starColor.withOpacity(intensity * 0.85)
                    ..strokeWidth = (1.0 + intensity * 2.4)
                    ..strokeCap = StrokeCap.round,
                );

                // Star point head
                canvas.drawCircle(
                  Offset(sx, sy),
                  (1.2 + intensity * 2.2),
                  Paint()..color = Colors.white.withOpacity(intensity),
                );
              }
            }

            // 5. גלי זוהר קטבים ופלזמה תלת-מימדיים (3D Quantum Plasma Aurora)
            void _paint3DAuroraWaves(Canvas canvas, Size size) {
              const int layers = 4;
              final colors = [
                const Color(0xFF00FF88),
                palette.highlight,
                palette.primary,
                const Color(0xFF7C4DFF),
              ];

              for (int l = 0; l < layers; l++) {
                final double lSpeed = 0.4 + l * 0.25;
                final double phase = progress * lSpeed * 2 * math.pi + l * 1.2;
                final double baseY = size.height * (0.35 + l * 0.12);
                final Color aColor = colors[l % colors.length];

                const int steps = 30;
                final double stepW = size.width / steps;

                final Path waveRibbon = Path();
                waveRibbon.moveTo(0, baseY);

                for (int s = 0; s <= steps; s++) {
                  final double x = s * stepW;
                  final double nx = x / size.width;
                  final double y1 = baseY +
                      math.sin(nx * 4 * math.pi + phase) * (size.height * 0.08) +
                      math.sin(nx * 8 * math.pi - phase * 0.8) * (size.height * 0.04);
                  waveRibbon.lineTo(x, y1);
                }

                waveRibbon.lineTo(size.width, size.height);
                waveRibbon.lineTo(0, size.height);
                waveRibbon.close();

                canvas.drawPath(
                  waveRibbon,
                  Paint()
                    ..shader = LinearGradient(
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                      colors: [
                        aColor.withOpacity(0.35),
                        aColor.withOpacity(0.08),
                        Colors.transparent,
                      ],
                      stops: const [0.0, 0.45, 1.0],
                    ).createShader(Rect.fromLTWH(0, baseY - 50, size.width, size.height - baseY + 50))
                    ..style = PaintingStyle.fill,
                );

                // Vertical glowing light pillars of aurora
                for (int p = 0; p < 8; p++) {
                  final double px = size.width * ((p / 8.0 + progress * (l + 1).toDouble()) % 1.0);
                  final double pHeight = size.height * (0.2 + 0.15 * math.sin(phase + p));
                  canvas.drawLine(
                    Offset(px, baseY + 10),
                    Offset(px, baseY - pHeight),
                    Paint()
                      ..color = aColor.withOpacity(0.22)
                      ..strokeWidth = 3.5
                      ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5),
                  );
                }
              }
            }

            // 6. יער גחליליות ונחיל אורות ביו-לומיננטי 3D (3D Firefly Micro-Verse Swarm)
            void _paint3DFireflyForest(Canvas canvas, Size size) {
              const int count = 38;
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;

              final List<Offset> positions = [];
              final List<double> scales = [];

              for (int i = 0; i < count; i++) {
                final double seed = i * 83.7;
                final double speed = 0.5 + (i % 3) * 0.3;
                final double t = progress * speed * 2 * math.pi + seed;

                // Smooth 3D wandering trajectory
                final double rawX = (size.width * 0.46) * math.sin(t * 0.7 + seed);
                final double rawY = (size.height * 0.44) * math.cos(t * 0.9 + seed * 0.8);
                final double rawZ = 120.0 + 100.0 * math.sin(t * 1.1 + seed * 1.5);

                final double fov = 260.0;
                final double scale = (fov / (fov + rawZ)).clamp(0.4, 1.4);
                final double sx = cx + rawX * scale;
                final double sy = cy + rawY * scale;

                positions.add(Offset(sx, sy));
                scales.add(scale);

                final double pulse = 0.5 + 0.5 * math.sin(progress * 10 * math.pi + seed * 3.0);
                final double r = (4.0 * scale) * (0.8 + 0.4 * pulse);
                final double alpha = (scale * 0.85 * pulse).clamp(0.15, 0.95);

                final Color fColor = (i % 3 == 0)
                    ? const Color(0xFF00FF66)
                    : ((i % 3 == 1) ? palette.highlight : const Color(0xFFFFE500));

                // Glowing halo
                canvas.drawCircle(
                  Offset(sx, sy),
                  r * 3.0,
                  Paint()..color = fColor.withOpacity(alpha * 0.35)..maskFilter = const MaskFilter.blur(BlurStyle.normal, 6),
                );
                // Core
                canvas.drawCircle(
                  Offset(sx, sy),
                  r,
                  Paint()..color = Colors.white.withOpacity(alpha),
                );
              }

              // Interconnecting bioluminescent filaments when near
              for (int i = 0; i < count; i++) {
                for (int j = i + 1; j < count; j++) {
                  final double d = (positions[i] - positions[j]).distance;
                  if (d < 45) {
                    final double linkAlpha = (1.0 - (d / 45)) * 0.25;
                    canvas.drawLine(
                      positions[i],
                      positions[j],
                      Paint()..color = palette.highlight.withOpacity(linkAlpha)..strokeWidth = 0.8,
                    );
                  }
                }
              }
            }

            // 7. מנהרת טרון ואופק סייבר תלת-מימדי (3D Synthwave Horizon & Wireframe Tunnel)
            void _paintTronTunnel(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.52; // horizon line

              // Distant Neon Sun at Horizon
              final sunRadius = size.width * 0.22;
              final sunRect = Rect.fromCircle(center: Offset(cx, cy), radius: sunRadius);
              canvas.drawCircle(
                Offset(cx, cy),
                sunRadius,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [const Color(0xFFFFD700), palette.primary, const Color(0xFF7C4DFF)],
                  ).createShader(sunRect),
              );

              // Horizontal scanline slats across the sun
              for (int s = 1; s <= 7; s++) {
                final double slatY = cy + (s * (sunRadius / 8.0));
                final double slatH = 2.0 + s * 1.0;
                canvas.drawRect(
                  Rect.fromLTWH(cx - sunRadius, slatY, sunRadius * 2, slatH),
                  Paint()..color = palette.background,
                );
              }

              // 3D Receding Floor Grid lines (Transverse)
              const int floorLines = 14;
              for (int i = 0; i < floorLines; i++) {
                final double p = ((i + progress) / floorLines);
                final double depthY = cy + math.pow(p, 2.8) * (size.height - cy);
                final double alpha = (p * 0.9).clamp(0.1, 0.95);
                canvas.drawLine(
                  Offset(0, depthY),
                  Offset(size.width, depthY),
                  Paint()
                    ..color = palette.highlight.withOpacity(alpha)
                    ..strokeWidth = (1.0 + p * 2.2),
                );
              }

              // 3D Longitudinal Grid Lines (Radiating to Horizon)
              const int rays = 16;
              for (int r = 0; r <= rays; r++) {
                final double rx = (r / rays) * size.width;
                canvas.drawLine(
                  Offset(cx, cy),
                  Offset(rx, size.height),
                  Paint()
                    ..color = palette.primary.withOpacity(0.55)
                    ..strokeWidth = 1.4,
                );
              }

              // Floating 3D Wireframe Cyber Cubes tumbling in tunnel
              for (int c = 0; c < 3; c++) {
                final double cPhase = (progress * 1.0 + c * 0.33) % 1.0;
                final double cZ = (1.0 - cPhase) * 600.0 + 30.0;
                final double cX = (c == 0 ? -120.0 : (c == 1 ? 120.0 : 0.0));
                final double cY = (c == 2 ? -100.0 : 40.0);

                final double fov = 260.0;
                final double scale = fov / (fov + cZ);
                final double cubeCx = cx + cX * scale;
                final double cubeCy = (cy * 0.8) + cY * scale;
                final double cubeSize = 34.0 * scale;

                final double rot = progress * 4 * math.pi + c * 2.0;

                canvas.save();
                canvas.translate(cubeCx, cubeCy);
                canvas.rotate(rot);

                canvas.drawRect(
                  Rect.fromCenter(center: Offset.zero, width: cubeSize, height: cubeSize),
                  Paint()
                    ..color = (c == 0 ? palette.highlight : palette.primary).withOpacity(scale.clamp(0.2, 0.9))
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.8 * scale,
                );
                canvas.restore();
              }
            }

            // 8. חור שחור קוסמי ודיסקת ספיחה (3D Relativistic Singularity & Accretion Disk)
            void _paint3DBlackHole(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.44;

              // Dual Relativistic Polar Jets
              for (int dir in [-1, 1]) {
                final Path jet = Path();
                jet.moveTo(cx, cy);
                jet.lineTo(cx - 16, cy + dir * maxR * 1.1);
                jet.lineTo(cx + 16, cy + dir * maxR * 1.1);
                jet.close();

                canvas.drawPath(
                  jet,
                  Paint()
                    ..shader = LinearGradient(
                      begin: Alignment.center,
                      end: dir == -1 ? Alignment.topCenter : Alignment.bottomCenter,
                      colors: [Colors.white, palette.highlight.withOpacity(0.6), Colors.transparent],
                    ).createShader(Rect.fromLTWH(cx - 20, cy - maxR, 40, maxR * 2))
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 8),
                );
              }

              // Warped 3D Accretion Disk (36 Spiral Streamlines)
              const int streams = 24;
              for (int i = 0; i < streams; i++) {
                final double streamR = maxR * (0.35 + (i / streams) * 0.65);
                final double rot = progress * (3.0 / (1.0 + i * 0.15)) * 2 * math.pi + (i * 0.25);
                final double tilt = 0.38; // 3D tilt

                final Rect diskRect = Rect.fromCenter(center: Offset(cx, cy), width: streamR * 2.2, height: streamR * 0.85);

                // Relativistic beaming: one side is brighter
                canvas.save();
                canvas.translate(cx, cy);
                canvas.rotate(0.35); // inclination angle
                canvas.drawOval(
                  Rect.fromCenter(center: Offset.zero, width: streamR * 2.2, height: streamR * 0.85),
                  Paint()
                    ..shader = SweepGradient(
                      colors: [
                        const Color(0xFF00F0FF),
                        const Color(0xFFFFD700),
                        const Color(0xFFFF1744),
                        const Color(0xFF00F0FF),
                      ],
                      transform: GradientRotation(rot),
                    ).createShader(diskRect)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.0
                    ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 2),
                );
                canvas.restore();
              }

              // Gravitational Lensing Halo (Ring around event horizon)
              canvas.drawCircle(
                Offset(cx, cy),
                38,
                Paint()
                  ..color = palette.highlight.withOpacity(0.9)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 3.0
                  ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 4),
              );

              // Absolute Black Hole Void
              canvas.drawCircle(
                Offset(cx, cy),
                36,
                Paint()..color = Colors.black,
              );
            }

            // 9. כור היתוך תעשייתי ובוכנות מגנטיות 3D (3D Tokamak Fusion Core)
            void _paint3DIndustrialReactor(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.44;

              // Outer Toroidal Magnetic Coils (12 3D Elliptical Ribs)
              const int coils = 12;
              for (int i = 0; i < coils; i++) {
                final double a = (i / coils) * 2 * math.pi;
                final double coilX = cx + math.cos(a) * (maxR * 0.72);
                final double coilY = cy + math.sin(a) * (maxR * 0.72);

                canvas.save();
                canvas.translate(coilX, coilY);
                canvas.rotate(a + math.pi / 2);

                canvas.drawRRect(
                  RRect.fromRectAndRadius(
                    Rect.fromCenter(center: Offset.zero, width: 22, height: 48),
                    const Radius.circular(6),
                  ),
                  Paint()
                    ..color = palette.chassis
                    ..style = PaintingStyle.fill,
                );
                canvas.drawRRect(
                  RRect.fromRectAndRadius(
                    Rect.fromCenter(center: Offset.zero, width: 22, height: 48),
                    const Radius.circular(6),
                  ),
                  Paint()
                    ..color = palette.primary.withOpacity(0.85)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.8,
                );

                // LED Status on each coil
                final bool activeLed = ((progress * coils * 2).toInt() % coils) == i;
                canvas.drawCircle(
                  Offset.zero,
                  3.0,
                  Paint()..color = activeLed ? const Color(0xFF00FF66) : palette.bevelLight,
                );

                canvas.restore();
              }

              // Helical Twisting Plasma Rope in Center
              const int ropePoints = 50;
              final Path plasmaRope = Path();
              for (int p = 0; p <= ropePoints; p++) {
                final double theta = (p / ropePoints) * 2 * math.pi;
                final double rHelix = maxR * 0.45;
                final double wobble = 12.0 * math.sin(theta * 8.0 + progress * 6 * math.pi);
                final double px = cx + (rHelix + wobble) * math.cos(theta);
                final double py = cy + (rHelix + wobble) * math.sin(theta);
                if (p == 0) plasmaRope.moveTo(px, py); else plasmaRope.lineTo(px, py);
              }
              canvas.drawPath(
                plasmaRope,
                Paint()
                  ..color = palette.highlight
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 3.5
                  ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 4),
              );

              // Central Blazing Plasma Core
              final double corePulse = 0.85 + 0.15 * math.sin(progress * 8 * math.pi);
              canvas.drawCircle(
                Offset(cx, cy),
                35 * corePulse,
                Paint()
                  ..shader = RadialGradient(
                    colors: [Colors.white, palette.highlight, palette.primary, Colors.transparent],
                    stops: const [0.0, 0.4, 0.75, 1.0],
                  ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: 35 * corePulse)),
              );
            }

            // 10. מארג גבישים קוונטי פוליהדרלי 3D (3D Rotating Polyhedral Quantum Geode)
            void _paint3DCrystalLattice(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.42;

              // 12 Vertices of an Icosahedron in 3D
              const double phi = 1.6180339887; // golden ratio
              final List<List<double>> vertices = [
                [-1,  phi, 0], [ 1,  phi, 0], [-1, -phi, 0], [ 1, -phi, 0],
                [0, -1,  phi], [0,  1,  phi], [0, -1, -phi], [0,  1, -phi],
                [ phi, 0, -1], [ phi, 0,  1], [-phi, 0, -1], [-phi, 0,  1],
              ];

              final double rotX = progress * 2.0 * math.pi;
              final double rotY = progress * 2.0 * math.pi;
              final double rotZ = progress * 2.0 * math.pi;

              final List<Offset> projected = [];
              final List<double> depths = [];

              for (var v in vertices) {
                double x = v[0] * (maxR * 0.5);
                double y = v[1] * (maxR * 0.5);
                double z = v[2] * (maxR * 0.5);

                // Rotate around X
                double y1 = y * math.cos(rotX) - z * math.sin(rotX);
                double z1 = y * math.sin(rotX) + z * math.cos(rotX);
                // Rotate around Y
                double x2 = x * math.cos(rotY) + z1 * math.sin(rotY);
                double z2 = -x * math.sin(rotY) + z1 * math.cos(rotY);
                // Rotate around Z
                double x3 = x2 * math.cos(rotZ) - y1 * math.sin(rotZ);
                double y3 = x2 * math.sin(rotZ) + y1 * math.cos(rotZ);

                final double fov = 350.0;
                final double scale = fov / (fov + z2);
                projected.add(Offset(cx + x3 * scale, cy + y3 * scale));
                depths.add(z2);
              }

              // Draw connecting wireframe edges (based on golden ratio distance)
              for (int i = 0; i < vertices.length; i++) {
                for (int j = i + 1; j < vertices.length; j++) {
                  double dx = vertices[i][0] - vertices[j][0];
                  double dy = vertices[i][1] - vertices[j][1];
                  double dz = vertices[i][2] - vertices[j][2];
                  double distSq = dx * dx + dy * dy + dz * dz;

                  // In a unit icosahedron, edges have length = 2.0 (distSq = 4.0)
                  if ((distSq - 4.0).abs() < 0.1) {
                    final double avgZ = (depths[i] + depths[j]) * 0.5;
                    final double alpha = (0.55 + (avgZ / (maxR * 0.5)) * 0.35).clamp(0.15, 0.95);
                    canvas.drawLine(
                      projected[i],
                      projected[j],
                      Paint()
                        ..color = (avgZ > 0 ? palette.highlight : palette.primary).withOpacity(alpha)
                        ..strokeWidth = (avgZ > 0 ? 2.2 : 1.2),
                    );
                  }
                }
              }

              // Draw Glowing Vertices
              for (int i = 0; i < projected.length; i++) {
                final double alpha = (0.6 + (depths[i] / (maxR * 0.5)) * 0.4).clamp(0.2, 1.0);
                canvas.drawCircle(
                  projected[i],
                  depths[i] > 0 ? 5.0 : 3.0,
                  Paint()..color = palette.highlight.withOpacity(alpha)..maskFilter = const MaskFilter.blur(BlurStyle.solid, 2),
                );
              }
            }

            // 11. סליל DNA תלת-מימדי וננו-חלקיקים (3D Molecular DNA Double Helix)
            void _paint3DDNAHelix(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              const int rungs = 28;
              final double startY = size.height * 0.08;
              final double stepH = (size.height * 0.84) / rungs;

              for (int i = 0; i < rungs; i++) {
                final double theta = (i / rungs) * 4 * math.pi + (progress * 2 * math.pi);
                final double y = startY + i * stepH;
                final double span = (size.width * 0.38) * math.sin(theta);
                final double z = math.cos(theta); // depth: -1 to 1

                final Offset p1 = Offset(cx + span, y);
                final Offset p2 = Offset(cx - span, y);

                final double alpha = (0.55 + z * 0.4).clamp(0.15, 0.95);
                final double atomRadius = (z > 0 ? 6.5 : 3.5);

                // Connecting Base Pair Rod
                canvas.drawLine(
                  p1,
                  p2,
                  Paint()
                    ..shader = LinearGradient(colors: [
                      palette.highlight.withOpacity(alpha),
                      palette.primary.withOpacity(alpha),
                    ]).createShader(Rect.fromPoints(p1, p2))
                    ..strokeWidth = (z > 0 ? 2.4 : 1.2),
                );

                // Strand 1 Nucleotide Atom (3D shaded)
                canvas.drawCircle(
                  p1,
                  atomRadius,
                  Paint()
                    ..shader = RadialGradient(
                      center: const Alignment(-0.3, -0.3),
                      colors: [Colors.white, palette.highlight, Colors.black],
                    ).createShader(Rect.fromCircle(center: p1, radius: atomRadius)),
                );

                // Strand 2 Nucleotide Atom (3D shaded)
                canvas.drawCircle(
                  p2,
                  atomRadius,
                  Paint()
                    ..shader = RadialGradient(
                      center: const Alignment(-0.3, -0.3),
                      colors: [Colors.white, palette.primary, Colors.black],
                    ).createShader(Rect.fromCircle(center: p2, radius: atomRadius)),
                );
              }
            }

            // 12. פיצוץ סופרנובה תלת-מימדי עם גלי הלם (3D Volumetric Supernova)
            void _paint3DSupernova(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.46;

              // 1. Concentric Relativistic Shockwave Ellipses
              for (int ring = 1; ring <= 3; ring++) {
                final double rPhase = (progress + ring * 0.33) % 1.0;
                final double rRadius = maxR * rPhase;
                final double rAlpha = (1.0 - rPhase).clamp(0.0, 0.85);

                canvas.save();
                canvas.translate(cx, cy);
                canvas.rotate(ring * 0.65);
                canvas.drawOval(
                  Rect.fromCenter(center: Offset.zero, width: rRadius * 2.2, height: rRadius * 1.1),
                  Paint()
                    ..color = (ring == 1 ? palette.highlight : (ring == 2 ? palette.primary : const Color(0xFFFFD700))).withOpacity(rAlpha)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.8 * (1.0 - rPhase * 0.5)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 4),
                );
                canvas.restore();
              }

              // 2. High-Velocity Radial Ejecta Particles (80 rays)
              const int particles = 75;
              for (int i = 0; i < particles; i++) {
                final double seed = i * 47.1;
                final double pSpeed = 0.6 + (i % 5) * 0.2;
                final double pDist = (progress * pSpeed + seed) % 1.0;
                final double r = maxR * pDist;
                final double angle = (i / particles) * 2 * math.pi + seed;

                final double px = cx + math.cos(angle) * r;
                final double py = cy + math.sin(angle) * r;
                final double alpha = (1.0 - pDist).clamp(0.1, 0.95);

                canvas.drawCircle(
                  Offset(px, py),
                  (2.8 * (1.0 - pDist * 0.5)).clamp(1.0, 4.0),
                  Paint()..color = (i % 2 == 0 ? palette.highlight : palette.primary).withOpacity(alpha),
                );
              }

              // 3. Central Pulsing Protostar Core
              final double coreFlash = 0.85 + 0.15 * math.sin(progress * 12 * math.pi);
              canvas.drawCircle(
                Offset(cx, cy),
                32 * coreFlash,
                Paint()
                  ..shader = RadialGradient(
                    colors: [Colors.white, const Color(0xFFFFE500), palette.primary, Colors.transparent],
                    stops: const [0.0, 0.35, 0.7, 1.0],
                  ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: 32 * coreFlash)),
              );
            }

            // 13. גשם קוד מטריקס סייבר 3D (3D Depth-Layered Matrix Rain)
            void _paint3DMatrixRain(Canvas canvas, Size size) {
              const int cols = 26;
              final double colW = size.width / cols;

              for (int c = 0; c < cols; c++) {
                final double speed = 0.55 + (c % 4) * 0.22;
                final double offset = (c * 17.3);
                final double dropY = ((progress * speed * size.height * 1.5 + offset) % (size.height * 1.4)) - (size.height * 0.2);
                final double x = c * colW + colW * 0.5;

                // 3D Depth layer: closer columns are thicker & brighter
                final int depthLayer = (c % 3);
                final double alphaMult = depthLayer == 0 ? 1.0 : (depthLayer == 1 ? 0.65 : 0.40);
                final double strokeW = depthLayer == 0 ? 2.2 : (depthLayer == 1 ? 1.6 : 1.1);

                // Stream Trail
                for (int s = 0; s < 12; s++) {
                  final double sy = dropY - (s * 18.0);
                  if (sy < 0 || sy > size.height) continue;
                  final double charAlpha = ((12 - s) / 12.0) * alphaMult;

                  // Leading char is bright white, trailing is neon
                  final Color cColor = s == 0 ? Colors.white : (depthLayer == 0 ? palette.highlight : palette.primary);

                  canvas.drawRect(
                    Rect.fromCenter(center: Offset(x, sy), width: colW * 0.55, height: 11),
                    Paint()..color = cColor.withOpacity(charAlpha.clamp(0.05, 0.95)),
                  );
                }

                // Splash impact ripple when reaching bottom
                if (dropY >= size.height - 20 && dropY <= size.height + 40) {
                  final double r = (dropY - (size.height - 20));
                  canvas.drawOval(
                    Rect.fromCenter(center: Offset(x, size.height - 5), width: r * 2, height: r * 0.6),
                    Paint()
                      ..color = palette.highlight.withOpacity((1.0 - r / 60.0).clamp(0.0, 0.7))
                      ..style = PaintingStyle.stroke
                      ..strokeWidth = strokeW,
                  );
                }
              }
            }

            // 14. ערפילית סערה קוסמית 3D (3D Galactic Cyclone & Stellar Nursery)
            void _paint3DNebulaStorm(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              final maxR = math.min(size.width, size.height) * 0.46;

              // Rotating Chromatic Galaxy Arms
              const int arms = 3;
              for (int a = 0; a < arms; a++) {
                final double armPhase = a * (2 * math.pi / arms) + progress * 2.0 * math.pi;

                final Path armPath = Path();
                for (double r = 10; r < maxR; r += 6) {
                  final double theta = armPhase + (r / maxR) * 3.5;
                  final double x = cx + math.cos(theta) * r;
                  final double y = cy + math.sin(theta) * (r * 0.65);
                  if (r == 10) armPath.moveTo(x, y); else armPath.lineTo(x, y);
                }

                final Color armColor = a == 0 ? palette.highlight : (a == 1 ? palette.primary : const Color(0xFF7C4DFF));

                canvas.drawPath(
                  armPath,
                  Paint()
                    ..color = armColor.withOpacity(0.35)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 14.0
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 12),
                );

                canvas.drawPath(
                  armPath,
                  Paint()
                    ..color = Colors.white.withOpacity(0.65)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.0,
                );
              }

              // Foreground Twinkling Diffraction Stars
              for (int s = 0; s < 6; s++) {
                final double sa = s * (math.pi / 3) + progress * 2.0 * math.pi;
                final double sDist = maxR * (0.3 + (s % 3) * 0.25);
                final double sx = cx + math.cos(sa) * sDist;
                final double sy = cy + math.sin(sa) * (sDist * 0.7);

                final double sPulse = 0.5 + 0.5 * math.sin(progress * 14 * math.pi + s * 2.0);
                final double rayLen = (12.0 + sPulse * 8.0);

                // 4-point cross diffraction spikes
                canvas.drawLine(Offset(sx - rayLen, sy), Offset(sx + rayLen, sy), Paint()..color = Colors.white.withOpacity(0.8)..strokeWidth = 1.2);
                canvas.drawLine(Offset(sx, sy - rayLen), Offset(sx, sy + rayLen), Paint()..color = Colors.white.withOpacity(0.8)..strokeWidth = 1.2);
                canvas.drawCircle(Offset(sx, sy), 3.0, Paint()..color = Colors.white);
              }
            }

            @override
            bool shouldRepaint(covariant Multi3DGraphicsPainter oldDelegate) => true;
          }

          class Interactive3DGlassBackground extends StatefulWidget {
            final Widget child;
            final ThemePalette palette;
            final bool isHighContrast;
            final String style;

            const Interactive3DGlassBackground({
              super.key,
              required this.child,
              required this.palette,
              required this.isHighContrast,
              required this.style,
            });

            @override
            State<Interactive3DGlassBackground> createState() => _Interactive3DGlassBackgroundState();
          }

          class _Interactive3DGlassBackgroundState extends State<Interactive3DGlassBackground>
              with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: this, duration: const Duration(seconds: 12))..repeat();
            }

            @override
            void didUpdateWidget(covariant Interactive3DGlassBackground oldWidget) {
              super.didUpdateWidget(oldWidget);
              if (oldWidget.style != widget.style || oldWidget.palette != widget.palette) {
                setState(() {});
              }
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) {
                return Container(color: Colors.black, child: widget.child);
              }

              return Stack(
                children: [
                  Container(color: widget.palette.background),
                  ClipRect(
                    child: RepaintBoundary(
                      child: AnimatedBuilder(
                        animation: _anim,
                        builder: (context, _) {
                          return CustomPaint(
                            size: Size.infinite,
                            painter: Multi3DGraphicsPainter(
                              progress: _anim.value,
                              palette: widget.palette,
                              style: widget.style,
                            ),
                          );
                        },
                      ),
                    ),
                  ),
                  // High-clarity subtle vignette with IgnorePointer to ensure zero interference with buttons
                  IgnorePointer(
                    child: Container(
                      decoration: BoxDecoration(
                        gradient: RadialGradient(
                          center: Alignment.center,
                          radius: 1.25,
                          colors: [
                            widget.palette.background.withOpacity(0.08),
                            widget.palette.background.withOpacity(0.30),
                            Colors.black.withOpacity(0.55),
                          ],
                        ),
                      ),
                    ),

                  ),
                  widget.child,
                ],
              );
            }
          }

          class AppSplashScreen extends StatefulWidget {
            final Widget Function() onFinish;
            const AppSplashScreen({super.key, required this.onFinish});

            @override
            State<AppSplashScreen> createState() => _AppSplashScreenState();
          }

          class _AppSplashScreenState extends State<AppSplashScreen> with SingleTickerProviderStateMixin {
            late final AnimationController _anim;
            bool _navigated = false;
            Timer? _navTimer;

            @override
            void initState() {
              super.initState();
              // Synchronous initialization so build() NEVER throws LateInitializationError
              _anim = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1400),
              )..forward();

              // Navigation timer guaranteed to fire without being blocked by permissions
              _navTimer = Timer(const Duration(milliseconds: 1800), _navigateToNextScreen);

              // Non-blocking background permission request
              _requestPermissions();
            }

