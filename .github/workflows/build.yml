            @override
            Widget build(BuildContext context) {
              final app = CyberPillMasterApp.of(context);
              final t = dict[app.currentLang]!;
              final hc = app.highContrast;

              return Scaffold(
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.symmetric(horizontal: 28),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          width: 110,
                          height: 110,
                          decoration: cyber3D(radius: 35, highContrast: hc),
                          child: Icon(Icons.person_pin, size: 60, color: hc ? Colors.black : const Color(0xFF06B6D4)),
                        ),
                        const SizedBox(height: 30),
                        Text(
                          t['enter_name_title']!,
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            fontSize: hc ? 26 : 22,
                            fontWeight: FontWeight.bold,
                            color: hc ? Colors.black : Colors.white,
                          ),
                        ),
                        const SizedBox(height: 25),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 18),
                          decoration: cyber3D(radius: 20, isPressed: true, highContrast: hc),
                          child: TextField(
                            controller: _ctrl,
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 20,
                              fontWeight: FontWeight.bold,
                              color: hc ? Colors.black : Colors.cyanAccent,
                            ),
                            decoration: InputDecoration(
                              border: InputBorder.none,
                              hintText: t['name_hint']!,
                              hintStyle: TextStyle(color: hc ? Colors.grey : Colors.white38),
                            ),
                          ),
                        ),
                        const SizedBox(height: 30),
                        GestureDetector(
                          onTap: () {
                            if (_ctrl.text.trim().isNotEmpty) {
                              app.setUserName(_ctrl.text.trim());
                            }
                          },
                          child: Container(
                            height: 56,
                            decoration: cyber3D(radius: 22, highContrast: hc, glowColor: const Color(0xFF38BDF8)),
                            child: Center(
                              child: Text(
                                t['continue_btn']!,
                                style: TextStyle(
                                  fontSize: 18,
                                  fontWeight: FontWeight.bold,
                                  color: hc ? Colors.black : const Color(0xFF38BDF8),
                                ),
                              ),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class CyberSplashScreen extends StatefulWidget {
            const CyberSplashScreen({super.key});

            @override
            State<CyberSplashScreen> createState() => _CyberSplashScreenState();
          }

          class _CyberSplashScreenState extends State<CyberSplashScreen> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(milliseconds: 2500), () {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (ctx) => const MainDashboard()),
                );
              });
