                    textDirection: isRtl ? TextDirection.rtl : TextDirection.ltr,
                    child: _firstRun ? const FirstTimeSetupScreen() : const MainDashboard(),
                  ),
                ),
              );
            }
          }

          class Dynamic3DCyberBackground extends StatefulWidget {
            final Widget child;
            final Color accentColor;
            final bool isHighContrast;
            const Dynamic3DCyberBackground({
              super.key,
              required this.child,
              required this.accentColor,
              this.isHighContrast = false,
            });

            @override
            State<Dynamic3DCyberBackground> createState() => _Dynamic3DCyberBackgroundState();
          }

          class _Dynamic3DCyberBackgroundState extends State<Dynamic3DCyberBackground>
              with SingleTickerProviderStateMixin {
            late AnimationController _anim;

            @override
            void initState() {
              super.initState();
              _anim = AnimationController(vsync: const Duration(seconds: 5) as TickerProvider)
                ..repeat();
            }

            @override
            void dispose() {
              _anim.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (widget.isHighContrast) {
                return widget.child;
              }
              return AnimatedBuilder(
                animation: _anim,
                builder: (context, child) {
                  return CustomPaint(
                    painter: CyberGrid3DPainter(
                      progress: _anim.value,
                      color: widget.accentColor,
                    ),
                    child: widget.child,
                  );
                },
              );
            }
          }

          class CyberGrid3DPainter extends CustomPainter {
            final double progress;
            final Color color;
            CyberGrid3DPainter({required this.progress, required this.color});

            @override
            void paint(Canvas canvas, Size size) {
              final w = size.width;
              final h = size.height;
              final horizon = h * 0.45;

              final linePaint = Paint()
                ..color = color.withOpacity(0.09)
                ..strokeWidth = 1.2
                ..style = PaintingStyle.stroke;

              final vanishingPoint = Offset(w * 0.5, horizon);

              for (double x = -w * 0.3; x <= w * 1.3; x += w * 0.16) {
                canvas.drawLine(vanishingPoint, Offset(x, h), linePaint);
              }

              final double numLines = 8;
              for (int i = 0; i < numLines; i++) {
                double normalized = ((i / numLines) + progress) % 1.0;
                double y = horizon + (h - horizon) * math.pow(normalized, 2.2);
                linePaint.color = color.withOpacity(0.04 + (normalized * 0.1));
                canvas.drawLine(Offset(0, y), Offset(w, y), linePaint);
              }

              final dotPaint = Paint()..style = PaintingStyle.fill;
              for (int i = 0; i < 15; i++) {
                double pProgress = (progress + (i * 0.067)) % 1.0;
                double px = (math.sin(i * 1.5) * 0.4 + 0.5) * w;
                double py = h - (pProgress * h * 0.65);
                double pSize = 1.5 + (pProgress * 2.5);
                dotPaint.color = color.withOpacity((1.0 - pProgress) * 0.35);
                canvas.drawCircle(Offset(px, py), pSize, dotPaint);
              }
            }

            @override
            bool shouldRepaint(covariant CyberGrid3DPainter oldDelegate) => true;
          }

          BoxDecoration cyber3D({
            required BuildContext context,
            double radius = 24,
            bool isPressed = false,
            bool highContrast = false,
            Color? customGlow,
          }) {
            if (highContrast) {
              return BoxDecoration(
                color: isPressed ? const Color(0xFF282500) : Colors.black,
                borderRadius: BorderRadius.circular(radius),
                border: Border.all(color: const Color(0xFFFFD700), width: 3.0),
                boxShadow: const [
                  BoxShadow(color: Color(0xFFFFD700), blurRadius: 4, offset: Offset(1, 1))
                ],
              );
            }
            final app = CyberPillMasterApp.of(context);
            final palette = themePalettes[app.themeKey] ?? themePalettes['cyber']!;
            final Color surface = palette['surface']!;
            final Color bg = palette['bg']!;
            final Color glow = customGlow ?? palette['accent']!;

            if (isPressed) {
              return BoxDecoration(
                color: surface,
