          // Splash Screen Component with Elastic Animation & Persistent Login Skip
          class AppSplashScreen extends StatefulWidget {
            final Widget Function() onFinish;

            const AppSplashScreen({super.key, required this.onFinish});

            @override
            State<AppSplashScreen> createState() => _AppSplashScreenState();
          }

          class _AppSplashScreenState extends State<AppSplashScreen> with SingleTickerProviderStateMixin {
            late AnimationController _animCtrl;
            late Animation<double> _scaleAnim;
            late Animation<double> _fadeAnim;
            bool _navigated = false;

            @override
            void initState() {
              super.initState();
              _animCtrl = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 2200),
              );

              _scaleAnim = Tween<double>(begin: 0.3, end: 1.0).animate(
                CurvedAnimation(
                  parent: _animCtrl,
                  curve: const Interval(0.0, 0.7, curve: Curves.elasticOut),
                ),
              );

              _fadeAnim = Tween<double>(begin: 0.0, end: 1.0).animate(
                CurvedAnimation(
                  parent: _animCtrl,
                  curve: const Interval(0.1, 0.6, curve: Curves.easeIn),
                ),
              );

              _animCtrl.forward();

              Timer(const Duration(milliseconds: 2600), () {
                if (mounted && !_navigated) {
                  _navigated = true;
                  Navigator.of(context).pushReplacement(
                    PageRouteBuilder(
                      transitionDuration: const Duration(milliseconds: 650),
                      pageBuilder: (context, anim, secAnim) => widget.onFinish(),
                      transitionsBuilder: (context, anim, secAnim, child) {
                        return FadeTransition(opacity: anim, child: child);
                      },
                    ),
                  );
                }
              });
            }

            @override
            void dispose() {
              _animCtrl.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final palette = themePalettes['cyberpunk']!;

              return Scaffold(
                backgroundColor: palette.background,
                body: Interactive3DGlassBackground(
                  palette: palette,
                  isHighContrast: false,
                  style: 'mesh',
                  child: Center(
                    child: AnimatedBuilder(
                      animation: _animCtrl,
                      builder: (context, child) {
                        return FadeTransition(
                          opacity: _fadeAnim,
                          child: ScaleTransition(
                            scale: _scaleAnim,
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Futuristic3DPillIcon(
                                  size: 130,
                                  primaryColor: palette.primary,
                                  secondaryColor: palette.highlight,
                                  glowColor: palette.glow,
                                ),
