          class PillItem {
            String name;
            int dosage;
            int stock;
            PillItem({required this.name, required this.dosage, required this.stock});

            Map<String, dynamic> toJson() => {'name': name, 'dosage': dosage, 'stock': stock};
            factory PillItem.fromJson(Map<String, dynamic> j) =>
                PillItem(name: j['name'] ?? '', dosage: j['dosage'] ?? 1, stock: j['stock'] ?? 30);
          }

          class ScheduleGroup {
            String id;
            String title;
            int hour;
            int minute;
            List<PillItem> pills;
            bool isTaken;

            ScheduleGroup({
              required this.id,
              required this.title,
              required this.hour,
              required this.minute,
              required this.pills,
              this.isTaken = false,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'hour': hour,
                  'minute': minute,
                  'pills': pills.map((p) => p.toJson()).toList(),
                  'isTaken': isTaken,
                };

            factory ScheduleGroup.fromJson(Map<String, dynamic> j) => ScheduleGroup(
                  id: j['id'] ?? '',
                  title: j['title'] ?? '',
                  hour: j['hour'] ?? 8,
                  minute: j['minute'] ?? 0,
                  pills: (j['pills'] as List? ?? []).map((p) => PillItem.fromJson(p)).toList(),
                  isTaken: j['isTaken'] ?? false,
                );
          }

