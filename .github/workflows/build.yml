name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project Files
        run: |
          flutter create --org com.example --project-name pill_reminder . --platforms=android --overwrite
          
          # Fix Desugaring & Permissions
          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  m_txt = f.read()
              perms = '''
    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
    <uses-permission android:name=\"android.permission.VIBRATE\"/>
    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>
    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>
    <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\"/>
  '''
              m_txt = m_txt.replace('<application', perms + '  <application')
              with open(manifest_path, 'w') as f:
                  f.write(m_txt)

          gradle_kts = 'android/app/build.gradle.kts'
          gradle_groovy = 'android/app/build.gradle'
          
          if os.path.exists(gradle_kts):
              with open(gradle_kts, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'dependencies {' in txt:
                  txt = txt.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")')
              else:
                  txt += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              with open(gradle_kts, 'w') as f:
                  f.write(txt)
          elif os.path.exists(gradle_groovy):
              with open(gradle_groovy, 'r') as f:
                  txt = f.read()
              if 'compileOptions {' in txt:
                  txt = txt.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              if 'dependencies {' in txt:
                  txt = txt.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"')
              else:
                  txt += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
              with open(gradle_groovy, 'w') as f:
                  f.write(txt)
          "

          cat << 'EOF' > pubspec.yaml
          name: pill_reminder
          description: Pill reminder app
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.1
            timezone: ^0.9.4
            shared_preferences: ^2.3.2
            flutter_tts: ^4.2.0
          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > lib/main.dart
