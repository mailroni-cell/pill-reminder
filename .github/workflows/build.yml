          class Pill3DPainter extends CustomPainter {
            final Color topColor;
            final Color bottomColor;
            final Color glowColor;


            Pill3DPainter({
              required this.topColor,
              required this.bottomColor,
              required this.glowColor,
            });


            @override
            void paint(Canvas canvas, Size size) {
              final center = Offset(size.width / 2, size.height / 2);

              // 1. Radiant 360-Degree LED Glow Ring Around Capsule
              final ringRadius = size.width * 0.44;
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = const Color(0xFF00E5FF).withOpacity(0.25)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 10)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 6.0,
              );
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = const Color(0xFFD500F9).withOpacity(0.35)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 3.5,
              );
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = const Color(0xFF00F5FF)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.8,
              );
              canvas.drawCircle(
                center,
                ringRadius,
                Paint()
                  ..color = Colors.white.withOpacity(0.9)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 0.8,
              );

              // 12 High-Intensity Perimeter LED Nodes
              const ledColors = [
                Color(0xFF00F5FF),
                Color(0xFF80D8FF),
                Color(0xFFD500F9),
                Color(0xFFFF4081),
                Color(0xFF7C4DFF),
                Color(0xFF00E5FF),
                Color(0xFF00F5FF),
                Color(0xFFE040FB),
                Color(0xFFD500F9),
                Color(0xFF00FFCC),
                Color(0xFF80D8FF),
                Color(0xFF7C4DFF),
              ];
              for (int i = 0; i < 12; i++) {
                final angle = i * (2 * math.pi / 12);
                final diodePos = Offset(
                  center.dx + ringRadius * math.cos(angle),
                  center.dy + ringRadius * math.sin(angle),
                );
                canvas.drawCircle(diodePos, 3.0, Paint()..color = const Color(0xFF060A14));
                canvas.drawCircle(
                  diodePos,
                  2.2,
                  Paint()
                    ..color = ledColors[i].withOpacity(0.6)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 2),
                );
                canvas.drawCircle(diodePos, 1.6, Paint()..color = ledColors[i]);
                canvas.drawCircle(diodePos, 0.7, Paint()..color = Colors.white);
              }

              // 2. 3D Floating Isometric Neon Capsule (Angled at 45°)
              canvas.save();
              canvas.translate(center.dx, center.dy);
              canvas.rotate(-math.pi / 4);

              final pillWidth = size.width * 0.38;
              final pillHeight = size.height * 0.82;
              final radius = pillWidth / 2;

              final baseRect = Rect.fromCenter(center: Offset.zero, width: pillWidth, height: pillHeight);
              final rrect = RRect.fromRectAndRadius(baseRect, Radius.circular(radius));

              // Deep 3D Contact Occlusion Shadows
              canvas.drawRRect(
                rrect.shift(const Offset(6, 10)),
                Paint()
                  ..color = Colors.black.withOpacity(0.85)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 10),
              );
              canvas.drawRRect(
                rrect.shift(const Offset(3, 5)),
                Paint()
                  ..color = const Color(0xFF020409).withOpacity(0.9)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5),
              );

              // Outer Radiant Aura
              canvas.drawRRect(
                rrect,
                Paint()
                  ..color = const Color(0xFF00E5FF).withOpacity(0.4)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 12),
              );

              canvas.clipRRect(rrect);

              // 3. Top Half (Electric Laser Blue / Hyper-Cyan)
              final topHalfRect = Rect.fromLTRB(-pillWidth / 2, -pillHeight / 2, pillWidth / 2, 0);
              final topPaint = Paint()
                ..shader = const LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: [
                    Color(0xFFFFFFFF),
                    Color(0xFF80D8FF),
                    Color(0xFF00E5FF),
                    Color(0xFF0052CC),
                    Color(0xFF002B49),
                  ],
                  stops: [0.0, 0.25, 0.55, 0.85, 1.0],
                ).createShader(topHalfRect);
              canvas.drawRect(topHalfRect, topPaint);

              // 4. Bottom Half (Laser Radiant Purple / Neon Magenta)
              final bottomHalfRect = Rect.fromLTRB(-pillWidth / 2, 0, pillWidth / 2, pillHeight / 2);
              final bottomPaint = Paint()
                ..shader = const LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: [
                    Color(0xFFFF80AB),
                    Color(0xFFFF4081),
                    Color(0xFFD500F9),
                    Color(0xFF7B1FA2),
                    Color(0xFF2E023D),
                  ],
                  stops: [0.0, 0.25, 0.55, 0.85, 1.0],
                ).createShader(bottomHalfRect);
              canvas.drawRect(bottomHalfRect, bottomPaint);

              // 5. Central High-Tech Superconductor Connector Ring
              final ringRect = Rect.fromCenter(center: Offset.zero, width: pillWidth * 1.1, height: pillHeight * 0.08);
              canvas.drawRRect(
                RRect.fromRectAndRadius(ringRect, const Radius.circular(3)),
                Paint()..color = const Color(0xFF080E1C),
              );
              final beamRect = Rect.fromCenter(center: Offset.zero, width: pillWidth * 1.05, height: pillHeight * 0.035);
              canvas.drawRRect(
                RRect.fromRectAndRadius(beamRect, const Radius.circular(2)),
                Paint()
                  ..shader = const LinearGradient(
                    colors: [Color(0xFF00E5FF), Color(0xFF00FFCC), Colors.white, Color(0xFF00FFCC), Color(0xFF00E5FF)],
                  ).createShader(beamRect),
              );

              // 6. Ultra-Gloss Glass Specular Reflections
              final sheenPath = Path()
                ..moveTo(-pillWidth * 0.32, -pillHeight * 0.44)
                ..quadraticBezierTo(-pillWidth * 0.05, -pillHeight * 0.42, 0, -pillHeight * 0.18)
                ..lineTo(-pillWidth * 0.22, -pillHeight * 0.18)
                ..close();
              canvas.drawPath(sheenPath, Paint()..color = Colors.white.withOpacity(0.9));

              final glintPath = Path()
                ..moveTo(-pillWidth * 0.36, -pillHeight * 0.38)
                ..lineTo(-pillWidth * 0.36, -pillHeight * 0.1)
                ..lineTo(-pillWidth * 0.30, -pillHeight * 0.1)
                ..lineTo(-pillWidth * 0.30, -pillHeight * 0.38)
                ..close();
              canvas.drawPath(glintPath, Paint()..color = Colors.white.withOpacity(0.6));

              // Bottom Glass Fresnel Reflection Rim
              final rimPath = Path()
                ..arcTo(
                  Rect.fromCircle(center: Offset(0, pillHeight * 0.25), radius: pillWidth * 0.42),
                  math.pi * 0.2,
                  math.pi * 0.6,
                  false,
                );
              canvas.drawPath(
                rimPath,
                Paint()
                  ..color = const Color(0xFFD500F9).withOpacity(0.4)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.0
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 2),
              );

              canvas.restore();
            }


            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          class Multi3DGraphicsPainter extends CustomPainter {
            final double progress;
            final ThemePalette palette;
            final String style;

            Multi3DGraphicsPainter({
              required this.progress,
              required this.palette,
              required this.style,
            });

            @override
            void paint(Canvas canvas, Size size) {
              switch (style) {
                case 'butterflies':
                  _paint3DButterflies(canvas, size);
                  break;
                case 'planets':
                  _paint3DPlanetarySystem(canvas, size);
                  break;
                case 'flowers':
                  _paint3DLotusFlowers(canvas, size);
                  break;
                case 'space':
                  _paint3DSpaceWarp(canvas, size);
                  break;
                case 'aurora':
                  _paint3DAuroraWaves(canvas, size);
                  break;
                case 'fireflies':
                  _paint3DFireflyForest(canvas, size);
                  break;
                case 'tunnel':
                  _paintTronTunnel(canvas, size);
                  break;
                case 'blackhole':
                  _paint3DBlackHole(canvas, size);
                  break;
                case 'reactor':
                  _paint3DIndustrialReactor(canvas, size);
                  break;
                case 'crystal':
                  _paint3DCrystalLattice(canvas, size);
                  break;
                case 'dna':
                  _paint3DDNAHelix(canvas, size);
                  break;
                case 'supernova':
                  _paint3DSupernova(canvas, size);
                  break;
                case 'matrix':
                  _paint3DMatrixRain(canvas, size);
                  break;
                case 'nebula':
                  _paint3DNebulaStorm(canvas, size);
                  break;
                default:
                  _paint3DButterflies(canvas, size);
                  break;
              }
            }

            // 1. פרפרים זרחניים תלת-מימדיים עם עומק Z ונפנוף כנפיים ריאליסטי
            void _paint3DButterflies(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int bCount = 7;
              final hues = [
                const Color(0xFF00FFFF),
                const Color(0xFFFF007F),
                const Color(0xFF76FF03),
                const Color(0xFFFFD600),
                const Color(0xFFB388FF),
              ];

              for (int i = 0; i < bCount; i++) {
                double t = (i / bCount) + (progress * 1.25);
                double theta = t * 2 * math.pi;
                double bx = cx + math.sin(theta) * (size.width * 0.40);
                double by = cy + math.cos(theta * 1.35) * (size.height * 0.30) + math.sin(t * 8 * math.pi) * 22;

                double flap = math.cos(progress * 28 * math.pi + i * 2.4);
                Color color = hues[i % hues.length];

                for (int tr = 1; tr <= 5; tr++) {
                  double trT = t - (tr * 0.015);
                  double tx = cx + math.sin(trT * 2 * math.pi) * (size.width * 0.40);
                  double ty = cy + math.cos(trT * 2.7 * math.pi) * (size.height * 0.30) + math.sin(trT * 8 * math.pi) * 22;
                  canvas.drawCircle(
                    Offset(tx, ty),
                    (6.0 - tr),
                    Paint()
                      ..color = color.withOpacity(0.30 / tr)
                      ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 3),
                  );
                }

                canvas.save();
                canvas.translate(bx, by);
                canvas.rotate(math.sin(theta) * 0.5);

                canvas.drawOval(
                  Rect.fromCenter(center: Offset.zero, width: 4.0, height: 24),
                  Paint()..color = Colors.white,
                );

                final wingPaint = Paint()
                  ..color = color.withOpacity(0.88)
                  ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 4.5);

                canvas.save();
                canvas.scale(flap.abs(), 1.0);
                Path rightWing = Path()
                  ..moveTo(2, -2)
                  ..cubicTo(32, -30, 46, 10, 2, 16);
                canvas.drawPath(rightWing, wingPaint);
                canvas.restore();

                canvas.save();
                canvas.scale(-flap.abs(), 1.0);
                Path leftWing = Path()
                  ..moveTo(2, -2)
                  ..cubicTo(32, -30, 46, 10, 2, 16);
                canvas.drawPath(leftWing, wingPaint);
                canvas.restore();

                canvas.restore();
              }
            }

            // 2. מערכת שמש קוסמית תלת-מימדית (כוכבי לכת עם טבעות ומסלולים אליפטיים)
            void _paint3DPlanetarySystem(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;


              canvas.drawCircle(
                Offset(cx, cy),
                26,
                Paint()
                  ..shader = RadialGradient(
                    colors: [Colors.white, const Color(0xFFFF9100), const Color(0xFFFF3D00).withOpacity(0.0)],
                  ).createShader(Rect.fromCircle(center: Offset(cx, cy), radius: 55)),
              );


              final planetSpecs = [
                {'dist': 60.0, 'r': 6.5, 'speed': 2.2, 'color': const Color(0xFF00E5FF), 'rings': false},
                {'dist': 105.0, 'r': 12.0, 'speed': 1.5, 'color': const Color(0xFFFF007F), 'rings': true},
                {'dist': 155.0, 'r': 8.5, 'speed': 0.9, 'color': const Color(0xFF76FF03), 'rings': false},
                {'dist': 200.0, 'r': 14.0, 'speed': 0.6, 'color': const Color(0xFFFFD600), 'rings': true},
              ];


              for (var p in planetSpecs) {
                double dist = p['dist'] as double;
                double r = p['r'] as double;
                double speed = p['speed'] as double;
                Color color = p['color'] as Color;
                bool rings = p['rings'] as bool;


                canvas.drawOval(
                  Rect.fromCenter(center: Offset(cx, cy), width: dist * 2.3, height: dist * 0.88),
                  Paint()
                    ..color = Colors.white.withOpacity(0.07)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.2,
                );


                double angle = (progress * speed * 2 * math.pi);
                double px = cx + math.cos(angle) * (dist * 1.15);
                double py = cy + math.sin(angle) * (dist * 0.44);


                canvas.drawCircle(
                  Offset(px, py),
                  r,
                  Paint()..color = color,
                );


                if (rings) {
                  canvas.drawOval(
                    Rect.fromCenter(center: Offset(px, py), width: r * 3.4, height: r * 0.95),
                    Paint()
                      ..color = color.withOpacity(0.65)
                      ..style = PaintingStyle.stroke
                      ..strokeWidth = 2.2,
                  );
                }
              }
            }


            // 3. פרחי לוטוס זוהרים ב-3D עם עלי כותרת פועמים בשכבות
            void _paint3DLotusFlowers(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.54;


              for (int f = 0; f < 3; f++) {
                double fx = cx + (f - 1) * (size.width * 0.34);
                double fy = cy + math.sin(progress * 2 * math.pi + f) * 14;
                double pulse = 1.0 + 0.14 * math.sin(progress * 4 * math.pi + f);


                for (int layer = 1; layer <= 3; layer++) {
                  int petals = 6 + layer * 2;
                  double rad = (26.0 * layer) * pulse;
                  for (int i = 0; i < petals; i++) {
                    double angle = (2 * math.pi / petals) * i + (progress * 0.35 * math.pi);
                    double px = fx + math.cos(angle) * rad;
                    double py = fy + math.sin(angle) * (rad * 0.65);


                    canvas.drawCircle(
                      Offset(px, py),
                      9.0 / layer,
                      Paint()
                        ..color = (f % 2 == 0 ? const Color(0xFFFF4081) : const Color(0xFF00E5FF)).withOpacity(0.70)
                        ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 7),
                    );
                  }
                }


                canvas.drawCircle(
                  Offset(fx, fy),
                  10,
                  Paint()..color = Colors.white,
                );
              }
            }


            // 4. שדה כוכבים עמוק (Space Warp 3D) עם היטלים פרספקטיביים
            void _paint3DSpaceWarp(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int count = 110;


              for (int i = 0; i < count; i++) {
                double t = ((i / count) + progress) % 1.0;
                double depth = math.pow(t, 2.4).toDouble();
                double angle = (i * 137.5) * math.pi / 180.0;
                double dist = depth * (size.width * 0.72);


                double x = cx + math.cos(angle) * dist;
                double y = cy + math.sin(angle) * dist;
                double starSize = (depth * 5.0).clamp(1.2, 5.5);


                canvas.drawCircle(
                  Offset(x, y),
                  starSize,
                  Paint()..color = Colors.white.withOpacity(depth.clamp(0.2, 1.0)),
                );
              }
            }


            // 5. זוהר קטבים וגלי אנרגיה מרובדים (3D Cosmic Aurora)
            void _paint3DAuroraWaves(Canvas canvas, Size size) {
              for (int w = 0; w < 4; w++) {
                final path = Path();
                double phase = progress * 2 * math.pi + (w * 1.35);
                double baseH = size.height * (0.34 + w * 0.13);


                path.moveTo(0, baseH);
                for (double x = 0; x <= size.width; x += 15) {
                  double y = baseH + math.sin((x * 0.014) + phase) * (38.0 + w * 15);
                  path.lineTo(x, y);
                }


                canvas.drawPath(
                  path,
                  Paint()
                    ..color = (w % 2 == 0 ? palette.primary : palette.highlight).withOpacity(0.42)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 3.2
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 9),
                );
              }
            }


            // 6. גחליליות זוהרות ונבגים מרחפים בנפח תלת-מימדי
            void _paint3DFireflyForest(Canvas canvas, Size size) {
              const int count = 50;
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;


              for (int i = 0; i < count; i++) {
                double t = (i / count);
                double angle = t * 12 * math.pi + (progress * 2 * math.pi);
                double rad = (size.width * 0.46) * math.sin(t * math.pi + progress * math.pi);
                double x = cx + rad * math.cos(angle);
                double y = cy + (t - 0.5) * size.height * 0.88 + math.sin(angle) * 38;
                double pSize = (math.sin(t * math.pi) * 5.5 + 2.0).clamp(1.5, 7.5);


                canvas.drawCircle(
                  Offset(x, y),
                  pSize,
                  Paint()
                    ..color = const Color(0xFF69F0AE).withOpacity((math.sin(t * math.pi) * 0.85).clamp(0.2, 0.95))
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 5),
                );
                canvas.drawCircle(
                  Offset(x, y),
                  pSize * 0.35,
                  Paint()..color = Colors.white,
                );
              }
            }


            // 7. מנהרת טרון תלת-מימדית (Infinite Tron Tunnel & Matrix Grid)
            void _paintTronTunnel(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.48;


              for (int i = 0; i < 14; i++) {
                double t = (i + progress) / 14.0;
                double s = math.pow(t, 2.5) * (size.width * 0.98);
                double alpha = (1.0 - t).clamp(0.1, 0.85);


                canvas.drawRect(
                  Rect.fromCenter(center: Offset(cx, cy), width: s * 1.25, height: s),
                  Paint()
                    ..color = palette.primary.withOpacity(alpha * 0.55)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.8,
                );
              }
              for (double a = 0; a < math.pi * 2; a += math.pi / 4) {
                canvas.drawLine(
                  Offset(cx, cy),
                  Offset(cx + math.cos(a) * size.width, cy + math.sin(a) * size.height),
                  Paint()..color = palette.highlight.withOpacity(0.28)..strokeWidth = 1.3,
                );
              }
            }


            // 8. חור שחור קוסמי ודיסקת ספיחה (3D Gravitational Singularity)
            void _paint3DBlackHole(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int rings = 12;


              for (int i = 0; i < rings; i++) {
                double r = 40.0 + i * 16.0;
                canvas.save();
                canvas.translate(cx, cy);
                canvas.rotate(0.35);


                canvas.drawOval(
                  Rect.fromCenter(center: Offset.zero, width: r * 2.4, height: r * 0.65),
                  Paint()
                    ..color = (i % 2 == 0 ? const Color(0xFFFF5252) : const Color(0xFFFFD700))
                        .withOpacity(((rings - i) / rings * 0.45).clamp(0.05, 0.6))
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 2.4
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 4),
                );
                canvas.restore();
              }


              canvas.drawCircle(
                Offset(cx, cy),
                32,
                Paint()..color = Colors.black,
              );
              canvas.drawCircle(
                Offset(cx, cy),
                35,
                Paint()
                  ..color = const Color(0xFF00E5FF).withOpacity(0.8)
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.5
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 6),
              );
            }


            // 9. ליבת כור תעשייתית עם גלגלי שיניים ומערכת בוכנות (3D Industrial Reactor)
            void _paint3DIndustrialReactor(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const double r = 70.0;
              final double rot = progress * 2 * math.pi;


              canvas.save();
              canvas.translate(cx, cy);


              for (int g = 0; g < 16; g++) {
                double a = rot + (g * math.pi / 8);
                double tx = math.cos(a) * (r + 14);
                double ty = math.sin(a) * (r + 14);
                canvas.drawCircle(
                  Offset(tx, ty),
                  5,
                  Paint()..color = palette.primary.withOpacity(0.7),
                );
              }


              canvas.drawCircle(
                Offset.zero,
                r,
                Paint()
                  ..color = palette.chassis
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 8,
              );


              for (int g = 0; g < 12; g++) {
                double a = -rot * 1.5 + (g * math.pi / 6);
                double tx = math.cos(a) * (r * 0.55);
                double ty = math.sin(a) * (r * 0.55);
                canvas.drawRect(
                  Rect.fromCenter(center: Offset(tx, ty), width: 8, height: 8),
                  Paint()..color = palette.highlight.withOpacity(0.85),
                );
              }


              for (int p = 0; p < 4; p++) {
                double a = (p * math.pi / 2);
                double stroke = 25.0 + math.sin(rot * 2 + p) * 15;
                canvas.drawLine(
                  Offset(math.cos(a) * r, math.sin(a) * r),
                  Offset(math.cos(a) * (r + stroke), math.sin(a) * (r + stroke)),
                  Paint()
                    ..color = palette.primary
                    ..strokeWidth = 6
                    ..strokeCap = StrokeCap.round,
                );
              }


              canvas.restore();
            }


            // 10. מארג גבישים קוונטי תלת-מימדי (3D Sacred Crystal Lattice)
            void _paint3DCrystalLattice(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int nodes = 8;
              const double rad = 110.0;
              final double rotY = progress * 2 * math.pi;


              List<Offset> projected = [];
              for (int i = 0; i < nodes; i++) {
                double u = (i * math.pi * 2 / nodes) + rotY;
                double v = ((i % 2 == 0 ? 1 : -1) * 0.6) + math.sin(rotY * 2) * 0.2;
                double x = math.cos(u) * rad;
                double y = v * rad;
                double z = math.sin(u) * rad;
                double scale = 300.0 / (300.0 + z);
                projected.add(Offset(cx + x * scale, cy + y * scale));
              }


              final lineP = Paint()
                ..color = const Color(0xFFB388FF).withOpacity(0.4)
                ..strokeWidth = 1.4;


              for (int i = 0; i < projected.length; i++) {
                for (int j = i + 1; j < projected.length; j++) {
                  canvas.drawLine(projected[i], projected[j], lineP);
                }
                canvas.drawCircle(
                  projected[i],
                  5,
                  Paint()
                    ..color = const Color(0xFFE040FB)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 4),
                );
              }
            }


            // 11. סליל DNA כפול זוהר בתלת-מימד (3D Bioluminescent DNA Helix)
            void _paint3DDNAHelix(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              const int steps = 28;
              final double startY = size.height * 0.12;
              final double stepH = size.height * 0.76 / steps;


              for (int i = 0; i < steps; i++) {
                double t = (i / steps) * 4 * math.pi + (progress * 2 * math.pi);
                double y = startY + i * stepH;
                double span = (size.width * 0.35) * math.sin(t);
                double z = math.cos(t);
                double pSize = (z > 0 ? 5.5 : 3.0);
                double alpha = (z > 0 ? 0.9 : 0.35);


                Offset p1 = Offset(cx + span, y);
                Offset p2 = Offset(cx - span, y);


                canvas.drawLine(
                  p1,
                  p2,
                  Paint()
                    ..color = Colors.white.withOpacity(alpha * 0.35)
                    ..strokeWidth = 1.6,
                );


                canvas.drawCircle(
                  p1,
                  pSize,
                  Paint()
                    ..color = const Color(0xFF00E5FF).withOpacity(alpha)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 3),
                );


                canvas.drawCircle(
                  p2,
                  pSize,
                  Paint()
                    ..color = const Color(0xFFFF007F).withOpacity(alpha)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 3),
                );
              }
            }


            // 12. פיצוץ סופרנובה תלת-מימדי עם גלי הלם (3D Volumetric Supernova)
            void _paint3DSupernova(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;
              const int rays = 24;


              for (int r = 0; r < 4; r++) {
                double shock = ((progress * 1.5 + (r * 0.25)) % 1.0);
                double rad = shock * (size.width * 0.65);
                canvas.drawCircle(
                  Offset(cx, cy),
                  rad,
                  Paint()
                    ..color = const Color(0xFFFF3D00).withOpacity((1.0 - shock) * 0.55)
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 3.5 * (1.0 - shock)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 8),
                );
              }


              for (int i = 0; i < rays; i++) {
                double a = (i * math.pi * 2 / rays) + (progress * math.pi);
                double len = (size.width * 0.42) * (0.6 + 0.4 * math.sin(i * 3 + progress * 8));
                canvas.drawLine(
                  Offset(cx, cy),
                  Offset(cx + math.cos(a) * len, cy + math.sin(a) * len),
                  Paint()
                    ..color = const Color(0xFFFFD600).withOpacity(0.35)
                    ..strokeWidth = 2.0,
                );
              }


              canvas.drawCircle(
                Offset(cx, cy),
                28,
                Paint()
                  ..color = Colors.white
                  ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 14),
              );
            }


            // 13. גשם קוד סייבר מטריקס תלת-מימדי (3D Perspective Matrix Rain)
            void _paint3DMatrixRain(Canvas canvas, Size size) {
              const int streams = 24;
              for (int s = 0; s < streams; s++) {
                double sx = (s / streams) * size.width;
                double speed = 1.0 + (s % 4) * 0.4;
                double yProgress = ((progress * speed * 2.5) + (s * 0.17)) % 1.0;
                double headY = yProgress * (size.height + 150) - 80;
                double depth = 0.5 + (s % 3) * 0.25;


                canvas.drawCircle(
                  Offset(sx, headY),
                  3.5 * depth,
                  Paint()
                    ..color = Colors.white
                    ..maskFilter = const MaskFilter.blur(BlurStyle.solid, 4),
                );


                canvas.drawLine(
                  Offset(sx, headY),
                  Offset(sx, headY - 120 * depth),
                  Paint()
                    ..shader = LinearGradient(
                      begin: Alignment.bottomCenter,
                      end: Alignment.topCenter,
                      colors: [const Color(0xFF00FF66), Colors.transparent],
                    ).createShader(Rect.fromLTWH(sx - 2, headY - 120 * depth, 4, 120 * depth))
                    ..strokeWidth = 2.2 * depth,
                );
              }
            }


            // 14. סערת ערפילית בין-כוכבית עם הבזקי אנרגיה (3D Interstellar Nebula)
            void _paint3DNebulaStorm(Canvas canvas, Size size) {
              final cx = size.width * 0.5;
              final cy = size.height * 0.5;


              for (int i = 0; i < 4; i++) {
                double phase = progress * 2 * math.pi + (i * 1.5);
                double rad = (size.width * (0.32 + i * 0.12));
                Offset c = Offset(cx + math.sin(phase) * 35, cy + math.cos(phase * 1.2) * 45);


                canvas.drawOval(
                  Rect.fromCenter(center: c, width: rad * 1.4, height: rad * 0.9),
                  Paint()
                    ..color = (i % 2 == 0 ? const Color(0xFF7C4DFF) : const Color(0xFF00B0FF)).withOpacity(0.18)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 36),
                );
              }


              if ((progress * 100).toInt() % 14 == 0) {
                canvas.drawCircle(
                  Offset(cx + math.sin(progress * 12) * 120, cy + math.cos(progress * 8) * 100),
                  18,
                  Paint()
                    ..color = Colors.white.withOpacity(0.85)
                    ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 16),
                );
              }
            }


            @override
            bool shouldRepaint(covariant Multi3DGraphicsPainter oldDelegate) => true;
          }

